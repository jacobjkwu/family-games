<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>喷火龙的宝石山</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#20123f}
body{position:fixed;inset:0;font-family:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;color:#3a2a17;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:absolute;inset:0;touch-action:none;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
input{-webkit-user-select:text;user-select:text;font:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid #ffb347;width:220px;text-align:center;color:#3a2a17;background:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.hidden{display:none!important}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
b{color:#d9581c}
/* buttons */
.btn{font:inherit;font-weight:800;font-size:21px;border:none;border-radius:18px;padding:10px 18px;min-height:54px;min-width:54px;color:#fff;background:linear-gradient(#ffb347,#ff7a1a);--sh:#c4520a;box-shadow:0 5px 0 var(--sh),0 8px 14px rgba(0,0,0,.22);transition:transform .06s;line-height:1.2;touch-action:manipulation}
.btn b{color:inherit}
.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.btn.green{background:linear-gradient(#72e38f,#2fb457);--sh:#1d7f3a}
.btn.blue{background:linear-gradient(#6ec3ff,#2f8be0);--sh:#1b5fa3}
.btn.purple{background:linear-gradient(#c49bff,#8a4fe6);--sh:#5b2aa8}
.btn.red{background:linear-gradient(#ff7a6b,#e8352a);--sh:#a31d14}
.btn.gray{background:linear-gradient(#c9c2b8,#9b9187);--sh:#6e665d}
.btn.big{font-size:25px;min-height:64px;padding:12px 26px}
.btn.huge{font-size:30px;min-height:96px;padding:16px 30px}
.btn.sm{font-size:18px;min-height:50px;padding:8px 12px}
.btn[disabled]{filter:grayscale(.85);opacity:.55}
.ibtn{font:inherit;width:52px;height:52px;border-radius:14px;border:none;background:rgba(255,255,255,.2);font-size:24px;color:#fff;flex:none;touch-action:manipulation}
.ibtn.pressed{background:rgba(255,255,255,.4)}
/* top bar */
.top{position:relative;z-index:4;display:flex;align-items:center;gap:10px;padding:6px 12px;background:rgba(0,0,0,.28);color:#fff;min-height:64px;flex:none}
.ttl{font-size:21px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ttl small{font-size:14px;background:#ffd23f;color:#5a3a12;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.res{display:flex;gap:6px;flex:none}
.res span{background:rgba(0,0,0,.32);border-radius:999px;padding:6px 11px;font-size:18px;font-weight:800;white-space:nowrap;display:inline-block}
.res span.bump{animation:pulse .5s}
/* bubbles & dialog */
.bubble{background:#fff;border-radius:20px;padding:10px 16px;font-size:19px;line-height:1.5;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.12);color:#3a2a17}
.bubble.pop{animation:pop .3s}
#dlg{position:fixed;inset:0;z-index:60;background:rgba(20,10,40,.62);display:flex;align-items:center;justify-content:center;padding:20px;touch-action:none}
.dbox{background:#fff8e8;border-radius:28px;padding:22px 24px;max-width:min(600px,94vw);max-height:90%;overflow:auto;text-align:center;font-size:21px;line-height:1.55;box-shadow:0 0 0 6px #ffd27a,0 20px 40px rgba(0,0,0,.4);animation:pop .35s;color:#3a2a17}
.dbox h3{margin:4px 0 10px;font-size:27px}
.dbox p{margin:8px 0}
.dbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.fbub{position:fixed;z-index:45;transform:translate(-50%,-110%);background:#fff;color:#3a2a17;border-radius:16px;padding:10px 14px;font-size:18px;font-weight:700;max-width:270px;box-shadow:0 6px 16px rgba(0,0,0,.3);pointer-events:none;animation:pop .3s;line-height:1.45;text-align:center}
.fbub.out{opacity:0;transition:opacity .4s}
.flyer{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-50%);font-size:24px;line-height:1}
/* gems & candy */
.gem{display:inline-block;width:var(--gs,26px);height:var(--gs,26px);clip-path:polygon(25% 6%,75% 6%,100% 38%,50% 100%,0 38%);background:linear-gradient(135deg,#fff 0 14%,var(--c) 32%,var(--d) 100%);margin:1px;font-style:normal}
.g0{--c:#5ad1ff;--d:#1a7fd6}.g1{--c:#ff6fae;--d:#c21e6a}.g2{--c:#7df07b;--d:#20a03a}.g3{--c:#ffd84a;--d:#d99a00}.g4{--c:#c08cff;--d:#6a2fd0}.g5{--c:#ff8a5c;--d:#d63a10}
.bag{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:50px;height:50px;border-radius:42% 42% 46% 46%;background:radial-gradient(circle at 35% 30%,#c79bff,#6b3fd0);color:#fff;font-weight:900;font-style:normal;font-size:17px;margin:2px;box-shadow:0 3px 0 #43218f;line-height:1}
.bag::before{content:'💎';font-size:13px}
.bag.cb{background:radial-gradient(circle at 35% 30%,#ffb3d6,#e0509a);box-shadow:0 3px 0 #a3276a}
.bag.cb::before{content:'🍬'}
.cd{font-style:normal;line-height:1;margin:1px;display:inline-block}
/* characters */
.dragon{position:relative;width:100%;container-type:inline-size}
.dragon svg{width:100%;height:auto;display:block;overflow:visible}
.acc{position:absolute;line-height:1;pointer-events:none}
.acc.head{left:72%;top:16%;font-size:26cqw;transform:translate(-50%,-75%) rotate(10deg)}
.acc.face{left:75%;top:35%;font-size:17cqw;transform:translate(-50%,-50%)}
.esvg{width:100%;height:auto;display:block;overflow:visible}
.gsvg{width:100%;height:auto;display:block}
.emo{display:inline-block;line-height:1}
.flip{transform:scaleX(-1)}
/* animations */
@keyframes bob{50%{transform:translateY(-4%)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-30%) rotate(-8deg)}60%{transform:translateY(-30%) rotate(8deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes marchOut{to{transform:translateX(110vw)}}
@keyframes walkin{from{transform:translateX(-70vw)}}
@keyframes hit{0%{filter:none}25%{filter:brightness(2.2) saturate(2);transform:translateX(14px)}55%{transform:translateX(-8px)}100%{filter:none}}
@keyframes dance{0%,100%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(12deg) translateY(-18%)}}
@keyframes leaveL{to{transform:translateX(-90vw)}}
@keyframes pulse{50%{transform:scale(1.18)}}
@keyframes boomfx{0%,100%{transform:scale(.8) rotate(0)}50%{transform:scale(1.25) rotate(15deg)}}
@keyframes drift{from{transform:translateX(-8vw)}to{transform:translateX(25vw)}}
@keyframes starIn{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
@keyframes blink{50%{opacity:0}}
@keyframes stomp{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%) rotate(-2deg)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #ffe680)}}
.bob{animation:bob 2.2s ease-in-out infinite}
.hop{animation:hop 1.1s ease-in-out infinite}
.jump{animation:jump .8s ease-in-out infinite}
.dance{animation:dance .5s ease-in-out infinite}
.pop{animation:pop .35s}
.shake{animation:shake .45s}
.talk{animation:hop .6s ease-in-out infinite}
.walkin{animation:walkin 1.6s ease-out}
.boomfx{animation:boomfx .5s ease-in-out infinite}
.boomfx.d2{animation-delay:.25s}
.hit{animation:hit .45s}
.stomp{animation:stomp 1s ease-in-out infinite}
/* scenes */
.bg-meadow,.bg-battle,.bg-mount{background:linear-gradient(#7fd0ff,#d4f1ff 72%)}
.bg-cave{background:radial-gradient(ellipse at 50% 75%,#5b3a7a,#2a1640 60%,#160a24)}
.ground{position:absolute;left:0;right:0;bottom:0;height:27%;background:linear-gradient(#8fd66a,#5cb043);border-top:6px solid #6cc04f}
.bg-battle .ground{background:linear-gradient(#b9c96a,#8a9e43);border-top-color:#a3b552}
.sun{position:absolute;right:7%;top:24%;width:13vmin;height:13vmin;border-radius:50%;background:radial-gradient(#fff6a8,#ffd23f);box-shadow:0 0 40px #ffe680}
.cloud{position:absolute;width:20vmin;height:6vmin;background:#fff;border-radius:999px;opacity:.92;animation:drift 30s linear infinite alternate}
.cloud::before{content:'';position:absolute;width:9vmin;height:9vmin;border-radius:50%;background:#fff;left:4vmin;top:-4.5vmin}
.c1{top:26%;left:8%}.c2{top:36%;left:50%;animation-duration:44s}
.flowers{position:absolute;bottom:1.5%;left:0;right:0;display:flex;justify-content:space-around;font-size:5vmin}
.tree{position:absolute;bottom:24%;font-size:19vmin;line-height:1}.t1{left:1%}.t2{right:2%}
.mount{position:absolute;left:18%;right:18%;bottom:24%;height:62%;background:linear-gradient(#a99c90,#6e625a);clip-path:polygon(50% 0,62% 14%,100% 100%,0 100%,38% 14%)}
.cavedoor{position:absolute;left:50%;bottom:0;width:26%;height:36%;transform:translateX(-50%);border-radius:50% 50% 0 0;background:#120818;overflow:hidden}
.cavedoor::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#8b5a2b 0 18%,#6b4220 18% 20%);border-radius:inherit;transform-origin:left;transition:transform 1s}
.cavedoor.open::after{transform:perspective(400px) rotateY(-85deg)}
.cavedoor.open{box-shadow:0 0 60px 20px #ffe680 inset}
.stal{position:absolute;top:0;left:0;right:0;height:9vmin;background:conic-gradient(from -25deg at 50% 100%,#140820 50deg,transparent 0) 0 0/7vmin 100% repeat-x;opacity:.9;pointer-events:none}
.story .stage{position:absolute;inset:0}
.actor{position:absolute}
.storybox{position:absolute;left:3%;right:3%;top:calc(2% + env(safe-area-inset-top));background:rgba(255,255,255,.96);border-radius:22px;padding:12px 20px;font-size:clamp(19px,1.6vmin + 12px,30px);line-height:1.55;box-shadow:0 6px 0 rgba(0,0,0,.15);z-index:5;animation:pop .3s}
.who{font-weight:900;color:#d9581c;font-size:.85em}
.tapnext{text-align:right;font-size:15px;color:#a08a6a;animation:blink 1.4s infinite}
.sbtn{display:flex;justify-content:center;margin-top:10px}
.skip{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:auto;padding:0 14px;font-size:17px;z-index:7;background:rgba(0,0,0,.35)}
.cage{width:14vmin;height:15vmin;border-radius:40% 40% 8px 8px;background:repeating-linear-gradient(90deg,transparent 0 1.6vmin,#555 1.6vmin 2.2vmin);border:.7vmin solid #555;display:flex;align-items:flex-end;justify-content:center;font-size:10vmin;line-height:1;background-color:rgba(255,255,255,.25)}
.hp{font-size:4.5vmin;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 12px;white-space:nowrap}
.fallen .flip{transform:scaleX(-1) rotate(170deg) translateY(-30%)}
.leaveL{display:flex;align-items:flex-end;gap:1vmin;animation:leaveL 3.2s ease-in .6s forwards}
.parade{display:flex;justify-content:space-between;align-items:flex-end}
.parade .pe{width:12%;text-align:center}
.parade .pl{font-size:clamp(11px,1.6vmin,16px);color:#fff;font-weight:800;white-space:nowrap;text-shadow:0 2px 2px #000}
/* tower */
.tower{display:flex;flex-direction:column;height:100%;width:100%;gap:3px;padding:4px;background:rgba(0,0,0,.25);border-radius:12px}
.floor{flex:1;position:relative;border:3px solid #3d2560;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden;min-height:14px}
.fl-fill{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 20% 30%,#5ad1ff 0 11%,transparent 12%),radial-gradient(circle at 62% 70%,#ff6fae 0 11%,transparent 12%),radial-gradient(circle at 85% 25%,#ffd84a 0 11%,transparent 12%),radial-gradient(circle at 40% 82%,#7df07b 0 9%,transparent 10%),linear-gradient(#b48cff,#7b4fd6);background-size:34px 30px,34px 30px,34px 30px,34px 30px,100% 100%;box-shadow:inset 0 0 12px rgba(255,255,255,.5);transition:width .6s}
.fl-n{position:absolute;left:5px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.fl-gift{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:16px}
.fl-amt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
/* title */
.title{align-items:center;justify-content:center}
.tbox{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.tbox h1{margin:0;font-size:clamp(40px,8vmin,84px);line-height:1.1;color:#fff;text-shadow:0 5px 0 #d9581c,0 10px 20px rgba(0,0,0,.3)}
.tbox h1 span{color:#ffe14a}
.tdragon{width:min(42vmin,340px)}
.tsub{font-size:22px;font-weight:800;color:#3a2a17;background:rgba(255,255,255,.85);padding:6px 16px;border-radius:999px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-size:19px;font-weight:800;border:none;border-radius:999px;padding:10px 16px;min-height:46px;background:#fff;color:#d9581c;box-shadow:0 3px 0 #e0c48a}
.chip.pressed{transform:translateY(3px)}
/* hub */
.hubmain{flex:1;display:grid;grid-template-columns:minmax(150px,22%) 1fr minmax(170px,24%);grid-template-rows:1fr auto;grid-template-areas:"tower center gp" "elves elves elves";gap:8px;padding:8px 14px 0;position:relative;min-height:0}
.hub-tower{grid-area:tower;display:flex;flex-direction:column;align-items:center;min-height:0;gap:4px;z-index:2}
.tlabel{color:#fff;font-size:16px;font-weight:800;text-align:center}
.tlabel b{color:#ffe14a}
.hub-tower .tower{flex:1;max-width:230px;min-height:0}
.hub-center{grid-area:center;position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.hub-dragon{width:min(46vmin,92%);position:relative;z-index:2}
.mybed{display:flex;flex-wrap:wrap;justify-content:center;margin-top:-6%;padding:0 10%;position:relative;z-index:-1}
.baby{position:absolute;right:2%;bottom:4%;width:min(15vmin,24%);z-index:3}
.hub-gp{grid-area:gp;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;min-height:0;z-index:2}
.hub-gp .gsvg{width:min(17vmin,140px)}
.hub-gp .bubble{font-size:17px}
.hub-elves{grid-area:elves;display:flex;justify-content:center;gap:1.2%;align-items:flex-end;z-index:2}
.he{width:min(9vmin,10%)}
.hubbar{display:flex;gap:14px;justify-content:center;padding:10px 12px 14px;flex:none;z-index:2}
.deco{position:absolute;font-size:7vmin;line-height:1;pointer-events:none;z-index:1;filter:drop-shadow(0 0 8px rgba(255,230,128,.5))}
@media (orientation:portrait){
 .hubmain{grid-template-columns:36% 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"gp gp" "tower center" "elves elves"}
 .hub-gp{flex-direction:row-reverse;align-items:flex-end}
 .hub-gp .gsvg{width:100px;flex:none}
 .hub-gp .bubble{flex:1}
 .he{width:10%}
}
/* step screens */
.stepbg{background:linear-gradient(#3b2163,#22123f)}
.stepmain{flex:1;display:grid;grid-template-columns:1.3fr 1fr;gap:12px;padding:12px;min-height:0}
.panel{border-radius:24px;position:relative;overflow:hidden;min-height:0}
.scenep{display:flex;flex-direction:column;gap:8px;padding:12px}
.sky2{background:linear-gradient(#a8e0ff,#e6f7ff 58%,#c5ea9f 58%,#8fd16a)}
.cavep{background:radial-gradient(ellipse at 50% 80%,#6b468f,#341d55 70%)}
.gpline{display:flex;align-items:flex-start;gap:8px;flex:none}
.gpm{width:72px;flex:none}
.gpline .bubble{flex:1;font-size:18px;padding:8px 14px}
.pilebox{flex:1.1;display:flex;flex-direction:column;align-items:center;min-height:0;background:rgba(255,255,255,.35);border-radius:18px;padding:6px}
.cavep .pilebox{background:rgba(255,255,255,.1)}
.pilecount{font-size:22px;font-weight:900;color:#3a2a17;background:#fff;border-radius:999px;padding:2px 16px;flex:none}
.pilecount span{color:#d9581c;font-size:28px}
.pile{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;overflow:hidden;width:100%;padding:4px}
.pile.glow{animation:glow 1s 2}
.teamline{display:flex;align-items:center;gap:12px;flex:none;background:rgba(255,255,255,.6);border-radius:18px;padding:4px 12px}
.teamelf{width:86px}
.teaminfo{font-size:18px;line-height:1.45}
.road{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:4px 6px;min-height:0;padding-top:12px;overflow:hidden}
.re{width:var(--es,60px);position:relative}
.re .tag{position:absolute;top:-4px;right:-6px;background:#e33;color:#fff;border-radius:10px;font-size:12px;padding:1px 6px;font-weight:900}
.re .tag.ok{background:#2fb457}
.re.bad{animation:shake .5s 2}
.plates{flex:1.3;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px 10px;min-height:0;overflow:hidden}
.pl{width:var(--es,64px);display:flex;flex-direction:column;align-items:center;position:relative}
.pl .cnt{background:#fff;border-radius:999px;font-weight:900;font-size:15px;padding:1px 8px;margin-top:-4px;color:#d9581c;box-shadow:0 2px 0 rgba(0,0,0,.2);white-space:nowrap}
.pl .cnt::before{content:'🍬'}
.pl.angry .cnt{background:#e33;color:#fff}
.pl.angry .pe{animation:shake .5s 3}
.pl .pe{width:100%}
.qp{background:#fff8e8;box-shadow:inset 0 0 0 4px #ffd27a;padding:14px;display:flex;flex-direction:column;gap:12px}
.qbox{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:18px;padding:12px 14px;flex:none}
.qrow{font-size:25px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ans{display:inline-flex;min-width:88px;height:60px;border:4px dashed #ffb347;border-radius:14px;align-items:center;justify-content:center;font-size:36px;color:#d9581c;background:#fffaf0;padding:0 8px}
.ans.on{border-style:solid;border-color:#ff7a1a;box-shadow:0 0 0 5px rgba(255,122,26,.25)}
.ans.on:empty::after{content:'?';color:#ffcf9a;animation:blink 1s infinite}
.ans.bad{border-color:#e33;animation:shake .4s}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;flex:1;min-height:0;max-height:420px}
.key{font:inherit;font-size:30px;font-weight:900;border:none;border-radius:16px;background:#fff;color:#5a3a12;box-shadow:0 4px 0 #e0c48a;min-height:52px;touch-action:manipulation}
.key.pressed{transform:translateY(3px);box-shadow:0 1px 0 #e0c48a;background:#fff1d6}
.key[disabled]{opacity:.5}
.acts{display:flex;flex-direction:column;gap:10px;flex:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.qp.alt{display:flex;flex-direction:column;justify-content:center}
.manual{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.mtitle{font-size:26px;font-weight:900}
.mnote{font-size:19px;line-height:1.5}
.mstat{font-size:22px;font-weight:900;color:#d9581c;background:#fff;border-radius:16px;padding:8px}
.win{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:pop .4s}
.wt{font-size:30px;font-weight:900;color:#2fb457}
.stars{font-size:52px;letter-spacing:6px;line-height:1}
.st{color:#ddd;display:inline-block}

 if(N>S.tower){N=S.tower;k=clamp(k,2,Math.max(2,Math.floor(N/2)));q=Math.floor(N/k);r=N%k}
 return{N,k,q,r,E:q,gemTries:0,candyTries:0,gemStars:0,candyStars:0,perfect:false,tut,active:true,coinD:0,jarD:0,gemD:0,starD:0,earn:0,supply:0,bagPrice:0}}

 if(D.perfect){setTimeout(()=>sfx('fanfare'),300);talk(`<b>完美！</b>一颗不剩，正好分完！精灵们原地开跳「完美舞」💃 绝绝子！额外 +1 ⭐`)}
 else{talk(`每只 <b>${D.cq}</b> 颗，一样多！精灵们：「公平！YYDS！」 剩下的 <b>${D.cr}</b> 颗放进龙大王的糖罐 🍬`);const p=ctr($('#pile')),j=ctr($('#rj'));for(let i=0;i<D.cr;i++)fly('🍬',{x:p.x+rnd(-30,30),y:p.y},j,700+i*90);setTimeout(()=>{renderPile(0,'candy');refreshRes('rj')},750+D.cr*90)}
 setTimeout(()=>refreshRes('rs'),400);
 S.hist.unshift(`${D.C} ÷ ${D.E} = ${D.cq}${D.cr?' …… '+D.cr:''}`);if(S.hist.length>40)S.hist.length=40;
 let note=`${D.E} 只精灵，每只 <b>${D.cq}</b> 颗，${D.cr?`剩 <b>${D.cr}</b> 颗进糖罐。`:'正好分完！'}`;
 if(manual)note=`一共发了 <b>${D.cq}</b> 轮，所以每只 ${D.cq} 颗，剩 ${D.cr} 颗。<br>这就是<b>除法</b>！下次直接算出来，又快又能拿 3 颗 ⭐！`;
 const qp=$('#qp');qp.classList.add('alt');qp.innerHTML=winCard({title:D.perfect?'💃 完美分糖！':'🎉 分得真公平！',stars:D.candyStars,eq:eqHTML(D.C,D.E,D.cq,D.cr),note,btn:`<button class="btn big green" data-act="toSummary">🌙 结束今天的工作</button>`});
 [1,2,3].forEach(i=>{if(i<=D.candyStars)setTimeout(()=>sfx('star'),i*250)});busy=false}
function startManualCandy(tut){D.mLeft=D.C;D.mRounds=0;resetPlates();renderPile(D.C,'candy');D.mCnt=Array(D.E).fill(0);
 const qp=$('#qp');qp.classList.add('alt');qp.innerHTML=`<div class="manual"><div class="mtitle">🖐 一轮一轮发</div><div class="mnote">每发<b>一轮</b>，每只精灵拿 <b>1</b> 颗。<br>剩下的不够每只一颗时，就停下！</div><button class="btn huge green" data-act="mRound">🍬 发一轮</button><div class="mstat" id="mstat">已发 0 轮 · 剩 ${D.C} 颗</div><button class="btn blue" data-act="mDoneCandy">✋ 不够每只一颗了，收工！</button>${tut?'':'<button class="btn sm gray" data-act="backCandy">↩ 我还是自己算</button>'}</div>`;
 talk(tut?'第一次分糖，我们<b>一轮一轮</b>地发：每发一轮，每只精灵拿一颗。不够每只一颗的时候，就收工！':'点「发一轮」，每只精灵拿一颗。不够每只一颗时，就点「收工」！')}
ACT.manualCandy=()=>{if(busy)return;startManualCandy(false)};
ACT.backCandy=()=>{if(busy)return;const qp=$('#qp');qp.classList.remove('alt');IN={v:['',''],f:0};qp.innerHTML=candyQ();resetPlates();renderPile(D.C,'candy');talk(candyTalk())};
ACT.mRound=async()=>{if(busy)return;if(D.mLeft<D.E){sfx('bad');talk(`只剩 <b>${D.mLeft}</b> 颗，不够每只一颗了！硬要分的话，有的精灵会没有——不公平！<br>点「收工」吧。`);shakeEl($('#pile'));return}
 busy=true;const g=await dealRound(D.mLeft,480,D.mCnt);D.mLeft=g.left;D.mRounds++;const s=$('#mstat');if(s)s.textContent=`已发 ${D.mRounds} 轮 · 剩 ${D.mLeft} 颗`;busy=false};
ACT.mDoneCandy=()=>{if(busy)return;if(D.mLeft>=D.E){sfx('bad');talk(`还剩 <b>${D.mLeft}</b> 颗，还够每只再发一颗呢！再发一轮吧。`);return}candyWin(true)};

/* ========== summary, floors, egg ========== */
const REWARDS=[
 {icon:'💰',txt:'7 楼的宝石搬空啦！宝石底下藏着<b>一箱金币</b>！',fn(){S.coins+=100;return'+100 🪙'}},
 {icon:'⭐',txt:'6 楼搬空啦！角落里有一盏<b>星星灯</b>，已经挂在洞里了！',deco:'star'},
 {icon:'🍬',txt:'5 楼搬空啦！发现了一个<b>超大糖果罐</b>！',fn(){S.jar+=30;return'+30 🍬'}},
 {icon:'👑',txt:'4 楼搬空啦！一顶<b>闪闪发光的王冠</b>，已经给你戴上啦！',deco:'crown',wear:1},
 {icon:'🌈',txt:'3 楼搬空啦！墙上挂着一道<b>彩虹灯</b>！',deco:'rainbow'},
 {icon:'💎',txt:'2 楼搬空啦！一个装满<b>私房宝石</b>的小箱子！',fn(){S.myGems+=30;return'+30 💎'}},
];
function applyReward(n){const r=REWARDS[n-1];if(r.fn)return r.fn();if(S.owned[r.deco]){S.coins+=80;return'已经有了，换成 +80 🪙'}S.owned[r.deco]=1;if(r.wear)S.head=r.deco;return'获得！'}
ACT.toSummary=async()=>{if(busy||!D||D.done)return;D.done=true;D.active=false;
 const st=D.gemStars+D.candyStars+(D.perfect?1:0),bonus=st*2,cb=D.comboBonus||0,coinD=D.earn-D.supply-D.bagPrice+bonus+cb;
 S.coins=Math.max(0,S.coins+coinD);S.myGems+=D.r;S.jar+=D.cr;S.stars+=st;S.tower=Math.max(0,S.tower-D.N);
 let lv='';if(!D.tut){const base=D.gemStars+D.candyStars;if(base>=6){S.good++;S.bad=0;if(S.good>=2&&S.level<7){S.level++;S.good=0;lv='up'}}else if(base<=3){S.bad++;S.good=0;if(S.bad>=2&&S.level>1){S.level--;S.bad=0;lv='down'}}}
 let tail=0;if(S.tower>0&&S.tower<12){tail=S.tower;S.myGems+=tail;S.tower=0}
 const cleared=7-Math.ceil(S.tower/FLOOR),nf=[];while(S.floorsGot<cleared){S.floorsGot++;nf.push(S.floorsGot)}
 const gots=nf.map(n=>n<7?applyReward(n):null);const dayNo=S.day;S.day++;save();
 const row=(a,b)=>`<div class="srow"><span>${a}</span><span>${b}</span></div>`,stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
 app.innerHTML=`<div class="screen bg-cave"><div class="stal"></div>${topHTML(`第 ${dayNo} 天 · 收工啦`)}<div class="center"><div class="card scroll"><h2>🌙 第 ${dayNo} 天 · 结算</h2><div style="font-family:var(--fd);font-size:22px;color:var(--gold)">${st>=7?'👑 MVP！完美的一天！':st>=6?'😎 全对！稳如老狗！':st>=4?'👍 干得不错！':'💪 明天继续冲！'}</div>
 ${row('① 搬宝石',`<span style="color:#ffb400">${stars(D.gemStars)}</span>`)}${row('③ 分糖果',`<span style="color:#ffb400">${stars(D.candyStars)}</span>`)}${D.perfect?row('💃 完美分糖','+1 ⭐'):''}
 ${row('🪙 金币',`${coinD>=0?'+':''}${coinD}`)}<div class="sub">卖宝石 +${D.earn} · 物资 -${D.supply} · 糖 -${D.bagPrice} · 星星奖励 +${bonus}${cb?` · 连击 +${cb}`:''}</div>${S.combo>1?row('🔥 当前连击',`${S.combo}（最高 ${S.best}）`):''}
 ${row('💎 私房宝石',`+${D.r+tail}`)}${row('🍬 糖罐',`+${D.cr}`)}${row('⛰️ 宝石山还剩',`${S.tower} 颗`)}
 ${lv==='up'?`<div class="lvmsg">🚀 你太厉害了！精灵爷爷决定给你<b>更大的挑战</b>：${LVNAME[S.level]}</div>`:lv==='down'?`<div class="lvmsg down">🌱 精灵爷爷说：我们先练练小一点的数，稳稳的！</div>`:''}
 <div style="margin-top:14px"><button class="btn big green" data-act="toHub">🏠 回山洞</button></div></div></div></div>`;
 sfx('fanfare');confetti(innerWidth/2,innerHeight*.3,60);
 busy=true;await sleep(1100);for(let i=0;i<nf.length;i++){if(nf[i]<7){const r=REWARDS[nf[i]-1];sfx('fanfare');confetti();await dialog(`<div class="rw"><div class="rwi">${r.icon}</div><p>${r.txt}</p><p class="got">${gots[i]}</p></div>`,[{t:'🎉 太好了！',c:'green'}])}else await eggEnding()}busy=false};
async function eggEnding(){sfx('fanfare');await dialog(`<div class="rw"><div class="rwi egg">🥚</div><h3>宝石山全部搬空啦！</h3><p>在洞底最深的地方，发现了一颗<b>神秘的蛋</b>……它好像在动！</p></div>`,[{t:'👀 快看看！',c:'green'}]);
 sfx('boom');confetti(innerWidth/2,innerHeight/2,160);S.baby=(S.baby||0)+1;S.tower=TOWER;S.floorsGot=0;S.round++;save();
 await dialog(`<div class="rw"><div class="rwbaby">${dragonHTML({col:'baby',head:null,face:null,cls:'hop'})}</div><h3>咔嚓！一只小龙宝宝出生啦！</h3><p>它会住在山洞里一直陪着你。</p><p>精灵爷爷：「快看！洞底又冒出了新宝石，<b>宝石山又长回来啦！</b>」</p></div>`,[{t:'🎉 太好了！',c:'green'}])}
ACT.toHub=()=>{if(busy)return;renderHub()};

/* ========== shop ========== */
let shopTab='wear';
function canPay(it){const have=it.cur==='coins'?S.coins:it.cur==='jar'?S.jar:S.myGems;return have>=it.p?0:it.p-have}
function owned(it){return it.p===0||!!S.owned[it.id]}
function renderShop(){const list=ITEMS.filter(i=>i.cat===shopTab);
 app.innerHTML=`<div class="screen stepbg">${topHTML('🛍️ 龙大王商店')}<div class="shopwrap"><div class="shopprev">${dragonHTML({cls:'bob'})}<div class="bubble" style="font-size:16px">金币 🪙 卖宝石赚；糖 🍬 和私房宝石 💎 来自每天的<b>余数</b>！</div></div>
 <div class="shopright"><div class="tabs">${[['wear','🎩 装扮'],['color','🎨 龙的颜色'],['deco','🏮 洞穴装饰']].map(t=>`<button class="tab ${shopTab===t[0]?'on':''}" data-act="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
 <div class="grid scroll">${list.map(it=>{const o=owned(it),lack=canPay(it);let b;
  if(it.cat==='wear')b=o?(S[it.slot]===it.id?`<button class="btn sm gray" data-act="wear" data-id="${it.id}">摘下</button>`:`<button class="btn sm green" data-act="wear" data-id="${it.id}">戴上</button>`):lack?`<button class="btn sm" disabled>还差 ${lack} ${CUR[it.cur]}</button>`:`<button class="btn sm" data-act="buy" data-id="${it.id}">买 ${it.p} ${CUR[it.cur]}</button>`;
  else if(it.cat==='color')b=o?(S.color===it.col?`<button class="btn sm gray" disabled>使用中</button>`:`<button class="btn sm green" data-act="wear" data-id="${it.id}">换上</button>`):lack?`<button class="btn sm" disabled>还差 ${lack} ${CUR[it.cur]}</button>`:`<button class="btn sm" data-act="buy" data-id="${it.id}">买 ${it.p} ${CUR[it.cur]}</button>`;
  else b=o?`<button class="btn sm gray" disabled>✓ 已摆好</button>`:lack?`<button class="btn sm" disabled>还差 ${lack} ${CUR[it.cur]}</button>`:`<button class="btn sm" data-act="buy" data-id="${it.id}">买 ${it.p} ${CUR[it.cur]}</button>`;
  const icon=it.cat==='color'?`<div class="swatch" style="background:${DCOL[it.col][0]}"></div>`:it.icon;
  return `<div class="item"><div class="ii">${icon}</div><div class="in">${it.name}</div>${b}</div>`}).join('')}</div></div></div></div>`}
ACT.shop=()=>{shopTab='wear';renderShop()};
ACT.tab=el=>{shopTab=el.dataset.t;renderShop()};
ACT.buy=el=>{const it=ITEM[el.dataset.id];if(!it||owned(it)||canPay(it))return;if(it.cur==='coins')S.coins-=it.p;else if(it.cur==='jar')S.jar-=it.p;else S.myGems-=it.p;S.owned[it.id]=1;if(it.cat==='wear')S[it.slot]=it.id;if(it.cat==='color')S.color=it.col;save();sfx('coin');sfx('good');const c=ctr(el);confetti(c.x,c.y,40);renderShop()};
ACT.wear=el=>{const it=ITEM[el.dataset.id];if(!it||!owned(it))return;if(it.cat==='color')S.color=it.col;else S[it.slot]=S[it.slot]===it.id?null:it.id;save();sfx('pop');renderShop()};

/* ========== book ========== */
ACT.book=()=>{const t=titleOf(),i=TITLES.indexOf(t),nx=TITLES[i+1],pct=S.total?Math.round(S.right/S.total*100):0;
 app.innerHTML=`<div class="screen stepbg">${topHTML('📒 龙大王的本子')}<div class="book scroll"><div class="bookin">
 <div class="bk"><h3>🏅 我的称号：${t[1]}</h3>一共得到 <b>${S.stars}</b> 颗 ⭐ ${nx?`· 再得 <b>${nx[0]-S.stars}</b> 颗就能成为「${nx[1]}」<div class="bar"><i style="width:${clamp((S.stars-t[0])/(nx[0]-t[0])*100,0,100)}%"></i></div>`:'· 你已经是最厉害的龙王啦！'}</div>
 <div class="bk"><h3>📊 工作记录</h3>已经工作了 <b>${S.day-1}</b> 天 · 第 ${S.round} 座宝石山<br>一次就答对：<b>${S.right}</b> / ${S.total} 次（${pct}%）<br>最高连击：<b>${S.best||0}</b> 🔥<br>现在的难度：<b>${LVNAME[S.level]}</b>（精灵爷爷会根据你的表现自动调整）</div>
 <div class="bk"><h3>🧮 我做过的除法</h3>${S.hist.length?`<div class="eqlist">${S.hist.slice(0,24).map(e=>`<div>${e}</div>`).join('')}</div>`:'还没有记录，快去干活吧！'}</div>
 <div class="bk"><h3>📜 精灵爷爷的除法秘籍</h3>
 ① <b>被除数 ÷ 除数 = 商 …… 余数</b><br>　宝石数 ÷ 每只拿几颗 = 派几只精灵 …… 剩几颗<br>　糖果数 ÷ 精灵只数 = 每只几颗 …… 剩几颗<br>
 ② <b>余数一定比除数小</b>。如果剩下的还够再分一次，就说明还没分完！<br>
 ③ <b>验算</b>：商 × 除数 + 余数 = 被除数<br>
 ④ 想商的时候，用乘法口诀找：<b>最接近、又不超过</b>被除数的那个数。</div>
 <div class="row2"><button class="btn purple" data-act="replay">📖 重看开场故事</button><button class="btn gray" data-act="settings">⚙️ 设置</button></div>
 </div></div></div>`};
ACT.replay=()=>{storyReplay=true;story(0)};

/* ========== boot ========== */
renderTitle();
</script>
