const MIG={1:function(o){const COL={orange:'ember',green:'jade',blue:'frost',pink:'sakura',purple:'shadow',gold:'gold'};
 const MAP={shades:'shades',crown:'crown',c_green:'c_jade',c_blue:'c_frost',c_pink:'c_sakura',c_purple:'c_shadow',c_gold:'c_gold',torch:'brazier',lantern:'lanterns',star:'lanterns',rainbow:'rune',trophy:'statue',mush:'crystals',plant:'banner',bed:'chest',lolli:'coins',cake:'coins'};
 const REFUND={flower:50,bow:60,tophat:180,grad:240};
 const n={schema:2,name:o.name,day:o.day,coins:o.coins,jar:o.jar,gems:o.myGems,stars:o.stars,level:o.level,good:o.good,bad:o.bad,tower:o.tower,towerMax:1400,round:o.round,floorsGot:o.floorsGot,prologue:o.prologue,right:o.right,total:o.total,baby:o.baby,tipI:o.tipI,combo:o.combo,best:o.best,owned:{},eq:{head:null,face:null,neck:null,body:null,horn:null},color:COL[o.color]||'ember',hist:[]};
 const ow=o.owned||{};for(const k in ow){if(!ow[k])continue;if(MAP[k])n.owned[MAP[k]]=1;else if(REFUND[k])n.coins=(Number(n.coins)||0)+REFUND[k]}
 if(o.head==='crown')n.eq.head='crown';if(o.face==='shades')n.eq.face='shades';
 if(Array.isArray(o.hist))n.hist=o.hist.map(h=>{const m=/(\d+)\s*÷\s*(\d+)\s*=\s*(\d+)(?:\s*…+\s*(\d+))?/.exec(String(h));return m?{a:+m[1],b:+m[2],q:+m[3],r:+(m[4]||0)}:null}).filter(Boolean);
 return n}};
const DOWN={}; /* no downgrade functions exist yet */
const LANGS=['zh-Hans','zh-Hant','en','fr'];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsKeys(){const a=[];try{for(let i=0;i<localStorage.length;i++)a.push(localStorage.key(i))}catch(e){}return a}
function readJSON(k){const r=lsGet(k);if(r==null)return null;try{const o=JSON.parse(r);return o&&typeof o==='object'?o:null}catch(e){return null}}
function detectLang(){const l=(navigator.language||'en').toLowerCase();if(/^zh-(tw|hk|mo)|^zh-hant/.test(l))return'zh-Hant';if(l.startsWith('zh'))return'zh-Hans';if(l.startsWith('fr'))return'fr';return'en'}
const SET=(()=>{const o=readJSON(K_SET)||{};return{lang:LANGS.includes(o.lang)?o.lang:null,last:typeof o.last==='number'?o.last:null}})();
let LANG=SET.lang||detectLang();
function t(k,p){let v=(STR[LANG]&&STR[LANG][k]);if(v===undefined)v=STR.en[k];if(v===undefined)return k;if(p)v=String(v).replace(/\{(\w+)\}/g,(m,n)=>p[n]!==undefined?p[n]:m);return v}
function saveSet(){const cur=readJSON(K_SET)||{};cur.lang=LANG;if(SET.last!=null)cur.last=SET.last;lsSet(K_SET,JSON.stringify(cur))}
let VERS=[];
function saveInfo(schema){const o=readJSON(SCHEMA_KEY[schema]);if(!o)return null;const coins=o.coins|0,stars=o.stars|0,day=o.day|0;return t('L_saveInfo',{d:day||1,s:stars,c:coins})}
/* --- input --- */
const ACT={};let downEl=null,downId=null;
document.addEventListener('pointerdown',e=>{if(!e.isPrimary||downEl)return;const el=e.target.closest('[data-act]');if(!el||el.disabled)return;downEl=el;downId=e.pointerId;el.classList.add('pressed')},{passive:true});
document.addEventListener('pointerup',e=>{if(e.pointerId!==downId)return;const el=downEl;downEl=null;downId=null;if(!el)return;el.classList.remove('pressed');const u=document.elementFromPoint(e.clientX,e.clientY);if(u&&(el===u||el.contains(u))){const f=ACT[el.dataset.act];f&&f(el)}});
document.addEventListener('pointercancel',()=>{if(downEl){downEl.classList.remove('pressed');downEl=null;downId=null}});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.scroll'))e.preventDefault()},{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
['gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(ty=>document.addEventListener(ty,e=>e.preventDefault(),{passive:false}));
let lastTE=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTE<350)e.preventDefault();lastTE=n},{passive:false});
let cbs=[];function dialog(html,btns){return new Promise(res=>{const d=$('#dlg');cbs=btns.map((b,i)=>()=>{d.classList.add('hidden');d.innerHTML='';cbs=[];res(i)});d.innerHTML=`<div class="dbox">${html}<div class="dbtns">${btns.map((b,i)=>`<button class="btn ${b.c||''}" data-act="dlg" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;d.classList.remove('hidden')})}
ACT.dlg=el=>{const f=cbs[+el.dataset.i];f&&f()};
/* --- render --- */
let copyFrom=null,copyTo=null;
function render(){document.documentElement.lang=LANG;document.title=t('L_title');const newest=VERS[0];const last=VERS.find(v=>v.v===SET.last)||newest;
 if(copyFrom==null&&VERS.length>1){copyFrom=VERS[1].v;copyTo=VERS[0].v}
 const backups=lsKeys().filter(k=>/\/copybak-\d+$/.test(k)).sort().reverse();
 $('#app').innerHTML=`<div class="wrap scroll"><div class="inner">
 <h1>${t('L_title')}</h1>
 <div class="chips">${LANGS.map(l=>`<button class="chip ${l===LANG?'on':''}" data-act="lang" data-l="${l}">${STR[l].langName}</button>`).join('')}</div>
 ${last?`<button class="btn big" data-act="open" data-v="${last.v}">${t('L_continue',{v:last.v})}</button>`:''}
 ${VERS.map((v,i)=>{const info=saveInfo(v.schema);return `<div class="card ver"><div class="vn">v${v.v}</div><div><div class="meta">${esc(v.date)} · ${t('L_schema',{s:v.schema})}${i===0?`<span class="badge">${t('L_latest')}</span>`:''}</div><div class="notes">${esc((v.notes&&(v.notes[LANG]||v.notes.en))||'')}</div><div class="save">${info||t('L_noSave')}</div>${v.noSwitch?`<div class="warn">${t('L_badge')}</div>`:''}</div><button class="btn ${i===0?'':'ghost'}" data-act="open" data-v="${v.v}">${t('L_open')}</button></div>`}).join('')}
 ${VERS.length>1?`<div class="card"><h3>${t('L_copyT')}</h3><div class="meta">${t('L_copyB')}</div>
  <div class="row"><span class="lbl">${t('L_from')}</span>${VERS.map(v=>`<button class="chip ${copyFrom===v.v?'on':''}" data-act="from" data-v="${v.v}">v${v.v}</button>`).join('')}</div>
  <div class="row"><span class="lbl">${t('L_to')}</span>${VERS.map(v=>`<button class="chip ${copyTo===v.v?'on':''}" data-act="to" data-v="${v.v}">v${v.v}</button>`).join('')}</div>
  <button class="btn cyan" data-act="copy">${t('L_doCopy')}</button></div>`:''}
 <div class="card"><h3>${t('L_restoreT')}</h3>${backups.length?backups.map(k=>{const ts=+k.split('copybak-')[1];const sch=Object.keys(SCHEMA_KEY).find(s=>k.startsWith(SCHEMA_KEY[s]+'/'));const v=VERS.find(x=>String(x.schema)===sch);return `<div class="bk"><span>${t('L_backupOf',{v:v?'v'+v.v:'s'+sch,date:new Date(ts).toLocaleString()})}</span><button class="btn ghost" data-act="restore" data-k="${esc(k)}">${t('L_restore')}</button></div>`}).join(''):`<div class="meta">${t('L_noBackup')}</div>`}</div>
 </div></div>`}
ACT.lang=el=>{LANG=el.dataset.l;saveSet();render()};
ACT.open=el=>{const v=VERS.find(x=>x.v===+el.dataset.v);if(!v)return;SET.last=v.v;saveSet();location.href=v.file};
ACT.from=el=>{copyFrom=+el.dataset.v;render()};
ACT.to=el=>{copyTo=+el.dataset.v;render()};
ACT.copy=async()=>{const A=VERS.find(v=>v.v===copyFrom),B=VERS.find(v=>v.v===copyTo);if(!A||!B||A===B)return;
 if(A.schema===B.schema){await dialog(`<p>${t('L_same')}</p>`,[{t:t('ok')}]);return}
 if(A.schema>B.schema&&!DOWN[A.schema]){await dialog(`<p>${t('L_noDown')}</p>`,[{t:t('ok')}]);return}
 const src=readJSON(SCHEMA_KEY[A.schema]);if(!src){await dialog(`<p>${t('L_noSave')}</p>`,[{t:t('ok')}]);return}
 const i=await dialog(`<h3>${t('L_confirmT')}</h3><p>${t('L_confirmB',{to:'v'+B.v,from:'v'+A.v,info:saveInfo(B.schema)||t('L_noSave'),info2:saveInfo(A.schema)})}</p>`,[{t:t('cancel'),c:'ghost'},{t:t('L_doCopy')}]);if(i!==1)return;
 let o=src;for(let s=A.schema;s<B.schema;s++)o=MIG[s](o);
 const tk=SCHEMA_KEY[B.schema],prev=lsGet(tk);if(prev!=null)lsSet(`${tk}/copybak-${Date.now()}`,prev);
 lsSet(tk,JSON.stringify(o));await dialog(`<p>${t('L_done')}</p>`,[{t:t('ok')}]);render()};
ACT.restore=async el=>{const k=el.dataset.k,tk=k.split('/copybak-')[0],val=lsGet(k);if(val==null)return;
 const i=await dialog(`<h3>${t('L_restoreT')}</h3><p>${esc(k)}</p>`,[{t:t('cancel'),c:'ghost'},{t:t('L_restore')}]);if(i!==1)return;
 const cur=lsGet(tk);if(cur!=null)lsSet(`${tk}/copybak-${Date.now()}`,cur);lsSet(tk,val);await dialog(`<p>${t('L_restored')}</p>`,[{t:t('ok')}]);render()};
async function boot(){try{const r=await fetch('versions.json',{cache:'no-store'});VERS=await r.json()}catch(e){VERS=VERSIONS_FALLBACK||[]}
 if(!Array.isArray(VERS)||!VERS.length)VERS=VERSIONS_FALLBACK||[];VERS.sort((a,b)=>b.v-a.v);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}render()}
boot();
</script>
<script type="module" src="../shared/family-cloud.js" data-games="dragon-gems" data-chip="float"></script>
</body>
