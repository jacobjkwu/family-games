<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05040b">
<title>喷火龙的宝石山 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--gold1:#ffe9b0;--gold2:#e2a94e;--line:rgba(255,214,140,.32);--glass:rgba(13,10,28,.62);--cyan:#6ff3ff;--ember:#ff7a2f;
--fbz:"Ma Shan Zheng","Kaiti SC","Kaiti TC","STKaiti","KaiTi",serif;--fbl:"Didot","Bodoni 72","Baskerville","Georgia",serif;--fb:var(--fbz);
--fn:"Avenir Next","Avenir","Helvetica Neue",Arial,sans-serif;--fz:"PingFang SC","PingFang TC","Hiragino Sans GB","Heiti SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
html.latin{--fb:var(--fbl)}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#05040b}
body{position:fixed;inset:0;font-family:var(--fz);color:#eee6ff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:absolute;inset:0;touch-action:none;overflow:hidden;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
.hidden{display:none!important}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
b{color:#ffcf6b;font-weight:800}
.num{font-family:var(--fn);font-weight:800;font-variant-numeric:tabular-nums}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;font-size:20px;padding:10px 14px;border-radius:12px;border:1px solid var(--gold2);color:var(--gold1);background:rgba(0,0,0,.5);outline:none}
input{width:240px;text-align:center;box-shadow:0 0 16px rgba(226,169,78,.2)}
textarea{width:100%;min-height:110px;font-family:Menlo,monospace;font-size:16px;word-break:break-all;resize:none}
input[type=range]{width:100%;padding:0;border:none;background:transparent;box-shadow:none;height:40px;accent-color:#e2a94e}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block;overflow:visible}
.frame{position:relative}
.frame::before,.frame::after{content:'';position:absolute;width:22px;height:22px;border:2px solid var(--gold2);pointer-events:none}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px}
.frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
/* buttons */
.btn{font:inherit;font-weight:800;font-size:19px;letter-spacing:1px;color:#fff;border-radius:14px;padding:10px 18px;min-height:54px;min-width:54px;border:1px solid rgba(255,214,160,.85);background:linear-gradient(180deg,#ff9a50 0%,#e2481e 55%,#9e200c 100%);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 8px 22px rgba(255,90,30,.3),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.25);text-shadow:0 1px 2px rgba(0,0,0,.55);transition:transform .07s,filter .07s;touch-action:manipulation;line-height:1.2}
.btn b{color:inherit}
.btn.pressed{transform:translateY(2px) scale(.97);filter:brightness(1.15)}
.btn.gold{background:linear-gradient(180deg,#fff2c8,#e8b456 50%,#9a6418);color:#2a1606;text-shadow:0 1px 0 rgba(255,255,255,.45);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 8px 22px rgba(255,190,80,.3),inset 0 1px 0 #fff}
.btn.cyan{background:linear-gradient(180deg,#9ff9ff,#2fb6d8 55%,#0f5f80);border-color:rgba(190,250,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 8px 22px rgba(80,220,255,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.violet{background:linear-gradient(180deg,#d2abff,#7d42e6 55%,#3a1488);border-color:rgba(225,200,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 8px 22px rgba(150,90,255,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:none;color:var(--gold1);text-shadow:none}
.btn.big{font-size:22px;min-height:62px;padding:12px 26px}
.btn.huge{font-size:28px;min-height:80px;padding:14px 34px;letter-spacing:3px}
.btn.sm{font-size:16px;min-height:48px;padding:8px 12px;letter-spacing:0}
.btn[disabled]{filter:grayscale(.85) brightness(.7);opacity:.6}
.ibtn{font:inherit;min-width:50px;height:50px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--gold1);font-size:15px;flex:none;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.ibtn.pressed{background:rgba(255,255,255,.18)}
.ibtn .ic{width:24px;height:24px}
/* top bar */
.top{position:relative;z-index:4;display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:64px;flex:none;background:linear-gradient(rgba(5,4,12,.92),rgba(5,4,12,.6));border-bottom:1px solid var(--line)}
.ttl{font-size:19px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:1px;color:var(--gold1)}
.ttl small{font-size:13px;border:1px solid var(--gold2);color:var(--gold1);border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;background:rgba(226,169,78,.15)}
.vbadge{font-family:var(--fn);font-size:12px;font-weight:800;color:#0b0716;background:var(--gold2);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.mod{font-family:var(--fn);font-size:11px;font-weight:800;color:#fff;background:#d6286a;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.res{display:flex;gap:6px;flex:none}
.res span{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;font-size:16px;font-family:var(--fn);font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;color:#fff}
.res span.bump{animation:pulse .5s}
.res span.combo{border-color:var(--ember);color:#ffd36b;box-shadow:0 0 14px rgba(255,122,47,.6)}
/* bubbles, dialog */
.bubble{background:rgba(10,8,22,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:18px;line-height:1.55;color:#f2ecff;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.bubble.pop{animation:fadeup .35s}
#dlg{position:fixed;inset:0;z-index:60;background:rgba(3,2,8,.72);display:flex;align-items:center;justify-content:center;padding:20px;touch-action:none}
.dbox{max-width:min(640px,94vw);max-height:90%;overflow:auto;text-align:center;font-size:19px;line-height:1.6;padding:22px 24px;animation:zoomin .3s;background:linear-gradient(180deg,rgba(30,22,58,.96),rgba(12,9,26,.98));border:1px solid var(--gold2);border-radius:18px;box-shadow:0 0 0 1px rgba(0,0,0,.8),0 0 40px rgba(226,169,78,.22),0 24px 50px rgba(0,0,0,.6)}
.dbox h3{margin:2px 0 10px;font-family:var(--fb);font-weight:400;font-size:32px;color:var(--gold1);text-shadow:0 0 16px rgba(255,190,80,.45)}
.dbox p{margin:8px 0}
.dbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.fbub{position:fixed;z-index:45;transform:translate(-50%,-110%);border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700;max-width:290px;pointer-events:none;animation:fadeup .3s;line-height:1.45;text-align:center;background:rgba(10,8,22,.9);border:1px solid var(--gold2);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.fbub.out{opacity:0;transition:opacity .4s}
.flyer{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-50%);line-height:0;filter:drop-shadow(0 0 6px rgba(160,230,255,.8))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:rgba(10,8,22,.95);border:1px solid #ff6a6a;color:#fff;border-radius:12px;padding:10px 16px;font-size:16px;max-width:90vw;animation:fadeup .3s}
/* keyframes */
@keyframes bob{50%{transform:translateY(-3%)}}
@keyframes hover{50%{transform:translateY(-6%)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-24%)}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
@keyframes zoomin{from{opacity:0;transform:scale(.88)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes marchOut{to{transform:translateX(110vw);opacity:.1}}
@keyframes walkin{from{transform:translateX(-60vw);opacity:0}}
@keyframes hit{0%{filter:none}25%{filter:brightness(2.4) saturate(1.4);transform:translateX(16px)}55%{transform:translateX(-8px)}100%{filter:none}}
@keyframes dance{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-16%)}}
@keyframes leaveL{to{transform:translateX(-95vw)}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes starIn{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes blink{50%{opacity:.25}}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.82,1.18)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slam{0%{transform:translate(-50%,-50%) scale(2.6);opacity:0}14%{transform:translate(-50%,-50%) scale(.94);opacity:1}22%{transform:translate(-50%,-50%) scale(1.04)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-62%) scale(1);opacity:0}}
@keyframes quake{20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes caveflash{to{box-shadow:0 0 140px 70px rgba(255,200,90,.9);background:radial-gradient(ellipse at 50% 80%,#fff6d0,#ffb347 40%,#7a2a0a 80%)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.hover{animation:hover 2.2s ease-in-out infinite}
.jump{animation:jump .8s ease-in-out infinite}
.dance{animation:dance .5s ease-in-out infinite}
.shake{animation:shake .45s}
.talk{animation:hover .8s ease-in-out infinite}
.walkin{animation:walkin 1.6s ease-out}
.hit{animation:hit .45s}
.quake{animation:quake .4s}
.tflame{animation:flick .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.banner{position:fixed;left:50%;top:42%;z-index:55;pointer-events:none;font-family:var(--fb);font-size:clamp(60px,12vmin,140px);line-height:1.05;white-space:nowrap;text-align:center;transform:translate(-50%,-50%);animation:slam 1.5s forwards;background:linear-gradient(180deg,#fff7d6,#ffd36b 40%,#ff8a2a 72%,#c2361a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(255,150,40,.8)) drop-shadow(0 4px 0 rgba(0,0,0,.7))}
.banner.en{font-family:var(--fn);font-style:italic;font-weight:900;letter-spacing:2px}
.banner.cyan{background:linear-gradient(180deg,#ffffff,#9ff9ff 40%,#2fb6d8 75%,#0f5f80);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 20px rgba(80,220,255,.9)) drop-shadow(0 4px 0 rgba(0,0,0,.7))}
.banner.bad{background:linear-gradient(180deg,#fff,#ffb0b0 40%,#ff3a3a 80%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 16px rgba(255,40,40,.7)) drop-shadow(0 4px 0 rgba(0,0,0,.7))}
.banner small{display:block;font-family:var(--fn);font-style:normal;font-weight:800;font-size:.26em;letter-spacing:3px;-webkit-text-fill-color:#fff;color:#fff}
/* characters */
.dragon{position:relative;width:100%}
.dragon svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.char svg,.esvg,.gsvg{width:100%;height:auto;display:block;overflow:visible}
.flip{transform:scaleX(-1)}
/* story */
.story .stage{position:absolute;inset:0}
.actor{position:absolute}
.lbox{position:absolute;left:0;right:0;top:0;height:calc(4vh + env(safe-area-inset-top));background:#000;z-index:4;pointer-events:none}
.storybox{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:30px 7% calc(18px + env(safe-area-inset-bottom));background:linear-gradient(rgba(4,3,10,0),rgba(4,3,10,.88) 26%,rgba(4,3,10,.96));font-size:clamp(18px,1.3vmin + 12px,27px);line-height:1.6;color:#f4eeff;animation:fadeup .35s}
.who{font-family:var(--fb);font-size:1.3em;color:var(--gold1);text-shadow:0 0 14px rgba(255,180,70,.6);margin-bottom:2px}
.tapnext{text-align:right;font-size:14px;color:rgba(255,233,176,.6);animation:blink 1.6s infinite;letter-spacing:2px}
.sbtn{display:flex;justify-content:center;margin-top:10px}
.skip{position:absolute;right:14px;top:calc(4vh + 10px + env(safe-area-inset-top));z-index:7}
.bossbar{position:absolute;left:50%;top:calc(4vh + 12px + env(safe-area-inset-top));transform:translateX(-50%);width:min(56vw,560px);z-index:6;text-align:center}
.bossbar .bn2{font-family:var(--fb);font-size:26px;color:#ffb0b0;text-shadow:0 0 12px rgba(255,40,40,.7)}
.hpbar{height:16px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(255,140,140,.6);overflow:hidden;box-shadow:0 0 16px rgba(255,40,40,.4)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff2a3a,#ff8a3d);transition:width .35s;box-shadow:0 0 12px #ff3a3a}
.cavemouth{position:absolute;left:50%;bottom:21%;width:min(20vmin,22%);aspect-ratio:1/.85;transform:translateX(-50%);border-radius:50% 50% 6% 6%/70% 70% 6% 6%;background:radial-gradient(ellipse at 50% 90%,rgba(255,170,60,.55),rgba(80,30,10,.6) 45%,#05030a 75%);box-shadow:0 0 40px rgba(255,140,40,.35)}
.cavemouth.open{animation:caveflash 1.1s forwards}
.parade{display:flex;justify-content:space-between;align-items:flex-end}
.parade .pe{width:11.5%;text-align:center}
.parade .pl{font-size:clamp(11px,1.4vmin,15px);color:var(--gold1);font-weight:700;white-space:nowrap;text-shadow:0 1px 3px #000}
/* title */
.title{align-items:center;justify-content:center}
.tlay{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:3vw;width:100%;padding:0 4vw}
.tcol{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(640px,60vw)}
.tlogo{white-space:nowrap;font-family:var(--fb);font-size:clamp(44px,8.6vmin,112px);line-height:1.05;background:linear-gradient(180deg,#fff8dc 0%,#ffd36b 40%,#ff8a2a 75%,#b32a10 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(255,140,40,.5)) drop-shadow(0 4px 0 rgba(0,0,0,.6))}
html.latin .tlogo{font-size:clamp(38px,7vmin,88px);font-weight:700;font-style:italic;white-space:normal}
.tsub2{font-family:var(--fn);font-weight:600;letter-spacing:.5em;color:var(--gold2);font-size:clamp(11px,1.5vmin,16px)}
.tag2{color:#cfc4ff;font-size:17px;letter-spacing:2px}
.tdragon{width:min(50vmin,480px);flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-size:16px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:9px 15px;min-height:46px;background:rgba(255,255,255,.06);color:var(--gold1);touch-action:manipulation}
.chip.on{background:rgba(226,169,78,.3);border-color:var(--gold2)}
.chip.pressed{background:rgba(255,255,255,.18)}
.tcorner{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:5;display:flex;gap:8px}
@media (orientation:portrait){.tcol{max-width:92vw}.tlay{flex-direction:column-reverse;gap:1vh}.tdragon{width:min(62vw,460px)}}
/* hub */
.hubmain{flex:1;display:grid;grid-template-columns:minmax(150px,22%) 1fr minmax(170px,24%);grid-template-rows:1fr auto;grid-template-areas:"tower center gp" "elves elves elves";gap:8px;padding:8px 14px 0;position:relative;min-height:0}
.hub-tower{grid-area:tower;display:flex;flex-direction:column;align-items:center;min-height:0;gap:6px;z-index:2}
.tlabel{color:#e8dcff;font-size:15px;font-weight:700;text-align:center}
.hub-tower .tower{flex:1;max-width:230px;min-height:0}
.hub-center{grid-area:center;position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.hub-dragon{width:min(50vmin,96%);position:relative;z-index:3}
.mybed{display:flex;flex-wrap:wrap;justify-content:center;margin-top:-5%;padding:0 12%;position:relative;z-index:-1;filter:drop-shadow(0 0 4px rgba(140,220,255,.6))}
.baby{position:absolute;right:0;bottom:6%;width:min(17vmin,26%);z-index:4}
.hub-gp{grid-area:gp;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;min-height:0;z-index:3}
.hub-gp .gsvg{width:min(17vmin,140px)}
.hub-gp .bubble{font-size:16px}
.hub-elves{grid-area:elves;display:flex;justify-content:center;gap:1.2%;align-items:flex-end;z-index:3}
.he{width:min(8.5vmin,10%)}
.hubbar{display:flex;gap:12px;justify-content:center;padding:10px 12px 14px;flex:none;z-index:3;flex-wrap:wrap}
.deco{position:absolute;pointer-events:none;z-index:1}
.deco svg{width:100%;height:auto;display:block;overflow:visible}
@media (orientation:portrait){
 .hubmain{grid-template-columns:36% 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"gp gp" "tower center" "elves elves"}
 .hub-gp{flex-direction:row-reverse;align-items:flex-end}.hub-gp .gsvg{width:96px;flex:none}.hub-gp .bubble{flex:1}.he{width:10%}
}
.tower{display:flex;flex-direction:column;gap:4px;height:100%;width:100%;padding:6px;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6));border:1px solid var(--line);border-radius:12px}
.floor{flex:1;position:relative;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);overflow:hidden;min-height:14px}
.fl-fill{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);background:linear-gradient(115deg,transparent 0 30%,rgba(255,255,255,.4) 32%,transparent 35%) 0 0/38px 100%,linear-gradient(65deg,transparent 0 58%,rgba(255,255,255,.22) 60%,transparent 63%) 0 0/26px 100%,linear-gradient(180deg,#9ff9ff,#3a7bff 55%,#7a2cff);box-shadow:0 0 14px rgba(111,243,255,.55),inset 0 0 10px rgba(255,255,255,.35);transition:width .6s}
.fl-n{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-family:var(--fn);font-size:12px;font-weight:800;color:var(--gold1);text-shadow:0 1px 3px #000}
.fl-amt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--fn);font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}
.fl-gift{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:16px;height:16px}
/* step screens */
.stepmain{flex:1;display:grid;grid-template-columns:1.3fr 1fr;gap:12px;padding:12px;min-height:0}
.panel{border-radius:18px;position:relative;overflow:hidden;min-height:0}
.scenep{display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(8,6,18,.28);border:1px solid rgba(255,214,140,.18)}
.gpline{display:flex;align-items:flex-start;gap:8px;flex:none}
.gpm{width:64px;flex:none;filter:drop-shadow(0 0 10px rgba(111,243,255,.25))}
.gpline .bubble{flex:1;font-size:17px;padding:8px 14px}
.pilebox{flex:1.1;display:flex;flex-direction:column;align-items:center;min-height:0;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:6px}

function apply(a){switch(a.type){
 case 'setName':S.name=String(a.name||'').slice(0,12);break;
 case 'prologueDone':S.prologue=true;break;
 case 'tip':S.tipI++;break;
 case 'buy':{const it=ITEM[a.id];if(!it||owned(it))return false;if(!CHEAT.res){if(canPay(it))return false;S[curKey(it.cur)]-=it.p}S.owned[it.id]=1;if(it.cat==='wear')S.eq[it.slot]=it.id;if(it.cat==='color')S.color=it.col;break}
 case 'equip':{const it=ITEM[a.id];if(!it||!owned(it))return false;if(it.cat==='color')S.color=it.col;else S.eq[it.slot]=S.eq[it.slot]===it.id?null:it.id;break}
 case 'combo':S.combo=a.value;S.best=Math.max(S.best,S.combo);break;
 case 'answer':S.total++;if(a.first)S.right++;break;
 case 'finishDay':Object.assign(S,a.patch);break;
 case 'hatch':S.baby++;S.tower=S.towerMax=CFG.towerTotal;S.floorsGot=0;S.round++;break;
 case 'level':S.level=clamp(S.level+a.d,1,7);S.good=0;S.bad=0;break;
 case 'replace':S=norm(a.save);break;
 case 'reset':S=fresh();break;
 default:return false}
 save();BUS.emit('state',a);return true}

   DAY FLOW — generation is seeded per save + day, so a day is reproducible.
   ===================================================================== */
function dayRng(salt=0){return rng((S.seed^Math.imul(S.day,2654435761)^Math.imul(S.round,97)^salt)>>>0)}
function newDay(){const R=dayRng(1),tut=S.day===1&&S.round===1;let k,q,r;

 talk(tut?t('tutCandyTalk'):t('manualCandyTalk'))}
ACT.manualCandy=()=>{if(busy)return;startManualCandy(false)};
ACT.backCandy=()=>{if(busy)return;const qp=$('#qp');qp.classList.remove('alt');IN={v:['',''],f:0};qp.innerHTML=candyQ();resetPlates();renderPile(D.C,'candy');talk(candyTalk())};
ACT.mRound=async()=>{if(busy)return;if(D.mLeft<D.E){sfx('bad');talk(t('notEnoughCandy',{l:D.mLeft}));shakeEl($('#pile'));return}
 busy=true;const g=await dealRound(D.mLeft,480,D.mCnt);D.mLeft=g.left;D.mRounds++;const s=$('#mstat');if(s)s.textContent=t('mstatCandy',{r:D.mRounds,l:D.mLeft});busy=false};
ACT.mDoneCandy=()=>{if(busy)return;if(D.mLeft>=D.E){sfx('bad');talk(t('stillEnoughCandy',{l:D.mLeft}));return}candyWin(true)};
/* --- end of day: one finishDay action carries every saved change --- */
function dayOutcome(){const st=D.gemStars+D.candyStars+(D.perfect?1:0),bonus=st*CFG.starBonus,cb=D.comboBonus||0,coinD=D.earn-D.supply-D.bagPrice+bonus+cb;
 const p={coins:Math.max(0,S.coins+coinD),gems:S.gems+D.r,jar:S.jar+D.cr,stars:S.stars+st,tower:Math.max(0,S.tower-D.N),good:S.good,bad:S.bad,level:S.level,day:S.day+1,floorsGot:S.floorsGot};let lv='';
 if(!D.tut){const base=D.gemStars+D.candyStars;if(base>=6){p.good++;p.bad=0;if(p.good>=CFG.levelUpAfter&&p.level<7){p.level++;p.good=0;lv='up'}}else if(base<=3){p.bad++;p.good=0;if(p.bad>=CFG.levelDownAfter&&p.level>1){p.level--;p.bad=0;lv='down'}}}
 let tail=0;if(p.tower>0&&p.tower<12){tail=p.tower;p.gems+=tail;p.tower=0}
 const per=S.towerMax/7,cleared=7-Math.ceil(p.tower/per-1e-9),nf=[];while(p.floorsGot<cleared){p.floorsGot++;nf.push(p.floorsGot)}
 return{patch:p,st,bonus,cb,coinD,lv,tail,nf}}
ACT.toSummary=async()=>{if(busy||!D||D.done)return;D.done=true;const O=dayOutcome(),dayNo=S.day;D.active=false;apply({type:'finishDay',patch:O.patch});
 const gots=O.nf.map(n=>{if(n>=7)return null;const r=REWARDS[n-1];if(r.fn)return r.fn(S);if(S.owned[r.deco]){S.coins+=80;return t('already')}S.owned[r.deco]=1;if(r.wear)S.eq[r.wear]=r.deco;return t('obtained')});save();
 setBG('cave');const row=(a,b)=>`<div class="srow"><span>${a}</span><span>${b}</span></div>`,stars=n=>`<span style="display:inline-flex;width:84px">${[1,2,3].map(i=>`<span style="width:26px">${STARSVG(i<=n)}</span>`).join('')}</span>`;
 const base=D.gemStars+D.candyStars,mvp=t('mvp')[O.st>=7?0:base>=6?1:O.st>=4?2:3];
 app.innerHTML=`<div class="screen">${topHTML(`${t('day',{d:dayNo})} · ${t('stepSum')}`)}<div class="center"><div class="card scroll"><h2>${t('sumTitle',{d:dayNo})}</h2><div class="mvp">${mvp}</div>
 ${row(t('rowGem'),stars(D.gemStars))}${row(t('rowCandy'),stars(D.candyStars))}${D.perfect?row(t('rowPerfect'),'+1 '+IC.star):''}
 ${row(IC.coin+' '+t('rowCoins'),(O.coinD>=0?'+':'')+O.coinD)}<div class="sub">${t('rowCoinsSub',{e:D.earn,s:D.supply,p:D.bagPrice,b:O.bonus})}${O.cb?t('rowComboPart',{c:O.cb}):''}</div>
 ${row(IC.gem+' '+t('rowGems'),'+'+(D.r+O.tail))}${row(IC.candy+' '+t('rowJar'),'+'+D.cr)}${row(t('rowTower'),t('rowTowerVal',{n:S.tower}))}${S.combo>1?row(IC.flame+' '+t('rowCombo'),t('rowComboVal',{c:S.combo,b:S.best})):''}
 ${O.lv==='up'?`<div class="lvmsg">${t('lvUp',{lv:t('levels')[S.level-1]})}</div>`:O.lv==='down'?`<div class="lvmsg down">${t('lvDown')}</div>`:''}
 <div style="margin-top:14px"><button class="btn big" data-act="toHub">${t('backCave')}</button></div></div></div></div>`;
 sfx('fanfare');confetti(W/2,H*.3,60);busy=true;await sleep(1100);
 for(let i=0;i<O.nf.length;i++){const n=O.nf[i];if(n<7){const r=REWARDS[n-1];sfx('fanfare');confetti();const icon=r.icon==='crown'?dragonSVG(S.color,{acc:{head:'crown'},vb:'146 -14 120 104'}):r.icon==='candy'?candySVG(1,120):r.icon==='gem'?gemSVG(0,120):r.icon==='coins'?DECO.coins:decoSVG(r.icon);
  await dialog(`<div class="rw"><div class="rwi">${icon}</div><p>${t('rewards')[n-1]}</p><p class="got">${gots[i]}</p></div>`,[{t:t('great')}])}else await eggEnding()}
 busy=false;D=null};
async function eggEnding(){sfx('fanfare');await dialog(`<div class="rw"><div class="rwi" style="animation:shake .5s infinite"><svg viewBox="0 0 60 70"><ellipse cx="30" cy="38" rx="22" ry="29" fill="#f2e6d0"/><path d="M12 36 l8 -6 6 6 6 -7 6 7 7 -6" stroke="#ff7a2f" stroke-width="2" fill="none" filter="url(#glow)"/></svg></div><h3>${t('eggT')}</h3><p>${t('eggB')}</p></div>`,[{t:t('eggBtn')}]);
 sfx('boom');confetti(W/2,H/2,160);apply({type:'hatch'});
 await dialog(`<div class="rw"><div class="rwbaby hover">${dragonHTML({col:'sakura',baby:1,acc:{}})}</div><h3>${t('babyT')}</h3><p>${t('babyB1')}</p><p>${t('babyB2')}</p></div>`,[{t:t('great')}])}
ACT.toHub=()=>{if(busy)return;show(renderHub)};
/* auto-complete a day (cheat) */
function autoDay(){if(!D){D=newDay()}D.gemStars=3;D.candyStars=3;D.gemTries=1;D.candyTries=1;D.earn=D.q*D.k*CFG.coinPerGem;D.supply=CFG.supplyBase+S.level;if(!D.bags)D.bags=makeBags(D.E);const b=D.bags[0];D.C=b.c;D.bagPrice=b.p;D.cq=Math.floor(D.C/D.E);D.cr=D.C%D.E;D.perfect=D.cr===0;D.active=true;busy=false;D.done=false;ACT.toSummary()}

/* =====================================================================
   SHOP + BOOK
   ===================================================================== */
let shopTab='wear';
function renderShop(){setBG('cave');const list=ITEMS.filter(i=>i.cat===shopTab),cur=c=>IC[c==='coins'?'coin':c==='jar'?'candy':'gem'];
 app.innerHTML=`<div class="screen">${topHTML(t('shopTitle'))}<div class="shopwrap"><div class="shopprev glass frame">${dragonHTML({cls:'bob'})}<div class="bubble" style="font-size:15px">${t('shopTip')}</div></div>
 <div class="shopright"><div class="tabs">${[['wear','tabWear'],['color','tabColor'],['deco','tabDeco']].map(x=>`<button class="tab ${shopTab===x[0]?'on':''}" data-act="tab" data-t="${x[0]}">${t(x[1])}</button>`).join('')}</div>
 <div class="grid scroll">${list.map(it=>{const o=owned(it),lack=canPay(it),price=`${cur(it.cur)} ${it.p}`;let b;
  if(!o)b=lack?`<button class="btn sm ghost" disabled>${t('lack',{n:lack})} ${cur(it.cur)}</button>`:`<button class="btn sm" data-act="buy" data-id="${it.id}">${t('buy')} · ${price}</button>`;
  else if(it.cat==='wear')b=S.eq[it.slot]===it.id?`<button class="btn sm ghost" data-act="wear" data-id="${it.id}">${t('unwear')}</button>`:`<button class="btn sm gold" data-act="wear" data-id="${it.id}">${t('wear')}</button>`;
  else if(it.cat==='color')b=S.color===it.col?`<button class="btn sm ghost" disabled>${t('inUse')}</button>`:`<button class="btn sm gold" data-act="wear" data-id="${it.id}">${t('equip')}</button>`;
  else b=`<button class="btn sm ghost" disabled>✓ ${t('placed')}</button>`;
  return `<div class="item"><div class="ii">${itemIcon(it)}</div><div class="in">${t('items')[it.id]}</div>${b}</div>`}).join('')}</div></div></div></div>`}
ACT.shop=()=>{shopTab='wear';show(renderShop)};
ACT.tab=el=>{shopTab=el.dataset.t;renderShop()};
ACT.buy=el=>{if(apply({type:'buy',id:el.dataset.id})){sfx('coin');sfx('good');const c=ctr(el);confetti(c.x,c.y,40);renderShop()}};
ACT.wear=el=>{if(apply({type:'equip',id:el.dataset.id})){sfx('pop');renderShop()}};
function renderBook(){setBG('cave');const ti=titleIdx(),nx=TITLE_STARS[ti+1],pct=S.total?Math.round(S.right/S.total*100):0,sep=t('remSep');
 app.innerHTML=`<div class="screen">${topHTML(t('bookTitle'))}<div class="book scroll"><div class="bookin">
 <div class="bk glass"><h3>${t('myTitle',{t:t('titles')[ti]})}</h3>${t('starsLine',{s:S.stars})}${nx!==undefined?t('nextTitle',{n:nx-S.stars,t:t('titles')[ti+1]})+`<div class="bar"><i style="width:${clamp((S.stars-TITLE_STARS[ti])/(nx-TITLE_STARS[ti])*100,0,100)}%"></i></div>`:t('maxTitle')}</div>
 <div class="bk glass"><h3>${t('recordT')}</h3>${t('daysWorked',{d:S.day-1,r:S.round})}<br>${t('accuracy',{a:S.right,t:S.total,p:pct})}<br>${t('bestCombo',{b:S.best})}<br>${t('curLevel',{l:t('levels')[S.level-1]})}</div>
 <div class="bk glass"><h3>${t('historyT')}</h3>${S.hist.length?`<div class="eqlist">${S.hist.slice(0,24).map(e=>`<div>${e.a} ÷ ${e.b} = ${e.q}${e.r?` ${sep} ${e.r}`:''}</div>`).join('')}</div>`:t('noHistory')}</div>
 <div class="bk glass"><h3>${t('secretT')}</h3>${t('secretBody')}</div>
 <div class="row2"><button class="btn violet" data-act="replay">${t('replay')}</button><button class="btn ghost" data-act="settings">${t('settings')}</button></div></div></div></div>`}
ACT.book=()=>show(renderBook);
ACT.replay=()=>{storyReplay=true;show(()=>story(PS=0))};

/* =====================================================================
   DEV / CHEAT PANEL (?dev=1, long-press the title logo, or Settings)
   ===================================================================== */
function readPresets(){const o=readJSON(K_PRESETS);return(o&&o!==BAD&&typeof o==='object')?o:{}}
function cleanPreset(o){const c={};for(const k in CFG_DEF){const m=CFG_META[k];c[k]=typeof(o&&o[k])==='number'?clamp(o[k],m.min,m.max):CFG_DEF[k]}return c}
function openDev(){renderDev();$('#dev').classList.remove('hidden')}
ACT.dev=()=>openDev();
function renderDev(){const groups={};for(const k in CFG_META)(groups[CFG_META[k].g]=groups[CFG_META[k].g]||[]).push(k);const pr=readPresets();
 const tog=(id,on,label)=>`<div class="tog"><span>${label}</span><button class="sw ${on?'on':''}" data-act="cheat" data-c="${id}"></button></div>`;
 $('#dev').innerHTML=`<div class="devbox"><div class="devhead"><h3>${t('devT')}</h3><button class="btn sm ghost" data-act="devResetAll">${t('resetAll')}</button><button class="btn sm" data-act="devClose">${t('close')}</button></div><div class="devbody scroll">
 ${Object.keys(groups).map(g=>`<div class="dgrp"><h4>${t(g)}</h4>${groups[g].map(k=>{const m=CFG_META[k];return `<div class="prow"><label>${t('cfg')[k]}</label><div class="pv"><input type="number" inputmode="decimal" id="n_${k}" value="${CFG[k]}" min="${m.min}" max="${m.max}" step="${m.step}" data-k="${k}"></div><button class="btn sm ghost" data-act="devReset" data-k="${k}">${t('reset')}</button><input class="rng" type="range" id="r_${k}" min="${m.min}" max="${m.max}" step="${m.step}" value="${CFG[k]}" data-k="${k}"></div>`}).join('')}</div>`).join('')}
 <div class="dgrp"><h4>${t('grpCheats')}</h4>${tog('res',CHEAT.res,t('cheatRes'))}${tog('show',CHEAT.show,t('cheatShow'))}${tog('fps',CHEAT.fps,t('fps'))}<div class="btnrow"><button class="btn sm" data-act="devSkip">${t('skipDay')}</button><button class="btn sm cyan" data-act="devLvl" data-d="1">${t('levelUp')}</button><button class="btn sm cyan" data-act="devLvl" data-d="-1">${t('levelDown')}</button></div></div>
 <div class="dgrp"><h4>${t('grpPerf')}</h4><div class="btnrow">${[100,1000,5000].map(n=>`<button class="btn sm violet" data-act="devSpawn" data-n="${n}">${t('spawn',{n})}</button>`).join('')}<button class="btn sm ghost" data-act="devClearSpawn">${t('clearSpawn')}</button></div></div>
 <div class="dgrp"><h4>${t('grpPresets')}</h4><div class="btnrow"><input id="pname" placeholder="${t('presetName')}" style="width:200px;font-size:16px"><button class="btn sm gold" data-act="devSavePreset">${t('savePreset')}</button><button class="btn sm ghost" data-act="devImportPreset">${t('importPreset')}</button></div>
 <div class="plist">${Object.keys(pr).map(n=>`<div><span>${esc(n)}</span><button class="btn sm" data-act="devLoadPreset" data-n="${esc(n)}">${t('load')}</button><button class="btn sm cyan" data-act="devExportPreset" data-n="${esc(n)}">${t('exportPreset')}</button><button class="btn sm ghost" data-act="devDelPreset" data-n="${esc(n)}">${t('del')}</button></div>`).join('')}</div>
 <textarea id="pcode" placeholder="${t('presetCode')}" style="margin-top:6px"></textarea></div></div></div>`;
 $$('#dev input[data-k]').forEach(inp=>inp.addEventListener('input',()=>{setCfg(inp.dataset.k,parseFloat(inp.value))}))}
function setCfg(k,v){const m=CFG_META[k];if(!Number.isFinite(v))return;v=clamp(v,m.min,m.max);CFG[k]=v;const n=$('#n_'+k),r=$('#r_'+k);if(n&&document.activeElement!==n)n.value=v;if(r)r.value=v;saveDev();if(k==='particles'||k==='renderScale'){autoScale=1;resizeAll()}BUS.emit('cfg',k)}
ACT.devClose=()=>{$('#dev').classList.add('hidden');CUR&&CUR()};
ACT.devReset=el=>setCfg(el.dataset.k,CFG_DEF[el.dataset.k]);
ACT.devResetAll=()=>{for(const k in CFG_DEF)setCfg(k,CFG_DEF[k]);CHEAT.res=CHEAT.show=CHEAT.fps=false;saveDev();renderDev()};
ACT.cheat=el=>{const c=el.dataset.c;CHEAT[c]=!CHEAT[c];el.classList.toggle('on',CHEAT[c]);saveDev()};
ACT.devSkip=()=>{$('#dev').classList.add('hidden');if(!S.prologue)apply({type:'prologueDone'});autoDay()};
ACT.devLvl=el=>{apply({type:'level',d:+el.dataset.d});toast(t('levels')[S.level-1])};
ACT.devSpawn=el=>{spawnParade(+el.dataset.n);CHEAT.fps=true;saveDev();renderDev()};
ACT.devClearSpawn=()=>{PARADE.n=0};
ACT.devSavePreset=()=>{const n=($('#pname').value||'').trim();if(!n)return;const pr=readPresets();pr[n]=cleanPreset(CFG);lsSet(K_PRESETS,JSON.stringify(pr));renderDev()};
ACT.devLoadPreset=el=>{const p=readPresets()[el.dataset.n];if(!p)return;const c=cleanPreset(p);for(const k in c)setCfg(k,c[k]);renderDev()};
ACT.devDelPreset=el=>{const pr=readPresets();delete pr[el.dataset.n];lsSet(K_PRESETS,JSON.stringify(pr));renderDev()};
ACT.devExportPreset=el=>{const p=readPresets()[el.dataset.n];if(!p)return;$('#pcode').value=JSON.stringify({game:GAME_ID,type:'preset',name:el.dataset.n,cfg:cleanPreset(p)})};
ACT.devImportPreset=()=>{try{const o=JSON.parse($('#pcode').value);const name=String(o.name||'import').slice(0,30);const pr=readPresets();pr[name]=cleanPreset(o.cfg||o);lsSet(K_PRESETS,JSON.stringify(pr));renderDev()}catch(e){toast(t('importBad'))}};

/* =====================================================================
   BOOT
   ===================================================================== */
function boot(){buildDefs();loadDev();LANG=SET.lang||detectLang();applyLang();S=loadSave();SET.last=GAME_VER;saveSettings();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 resizeAll();addEventListener('resize',resizeAll);addEventListener('orientationchange',()=>setTimeout(resizeAll,300));buildSprites();requestAnimationFrame(frame);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
 show(renderTitle);if(/[?&]dev=1/.test(location.search))openDev()}
boot();
</script>
