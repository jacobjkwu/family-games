<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Drawrassic Park</title>
<style>
:root{--ink:#1d3b25;--khaki:#f3e6bf;--paper:#fff8e1;--amber:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#2c5a34 radial-gradient(circle at 20% 0%,#3d7a45 0,#2c5a34 60%) fixed;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","PingFang TC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
main{max-width:860px;margin:0 auto;padding:18px 16px 40px}
button,select,a.btn{font-family:inherit;touch-action:manipulation}
.panel{background:var(--khaki);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);background:var(--paper);border-radius:16px;font-size:18px;font-weight:700;
  padding:8px 16px;min-height:52px;box-shadow:0 4px 0 var(--ink);color:var(--ink);text-decoration:none;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--amber);color:#2b1600}
.btn.danger{background:#f6a38f}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#fff8e1;margin-bottom:14px}
header h1{margin:0;font-size:30px;flex:1;min-width:200px}
header h1 small{display:block;font-size:16px;font-weight:500;opacity:.85}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{min-height:44px;border:3px solid var(--ink);border-radius:12px;background:var(--khaki);font-size:15px;font-weight:700;padding:4px 10px;color:var(--ink)}
.langs button.on{background:var(--amber)}
#continue{width:100%;min-height:72px;font-size:24px;margin:0 0 18px}
.ver{padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ver .info{flex:1;min-width:220px}
.ver h2{margin:0;font-size:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:13px;background:#16a34a;color:#fff;border-radius:999px;padding:2px 10px}
.meta{font-size:14px;opacity:.75;margin:2px 0}
.notes{font-size:16px;margin:4px 0}
.warn{font-size:13px;color:#8a3b12;margin-top:4px}
.ver .btn{min-width:140px}
section.copy{padding:16px;margin-top:20px}
section.copy h3{margin:0 0 6px;font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row label{font-weight:700;font-size:16px}
select{font-size:17px;min-height:48px;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:4px 10px;color:var(--ink)}
.note{font-size:14px;opacity:.85}
.skey{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:2px dashed rgba(29,59,37,.2)}
.skey .nm{flex:1;min-width:200px;font-size:15px}
.skey .btn{min-height:44px;font-size:15px;padding:4px 12px}
#undos{display:flex;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(10,25,12,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.hidden,.hidden{display:none!important}
.dialog{width:min(520px,100%);padding:18px}
.dialog h3{margin:0 0 10px;font-size:22px}
.sum{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin:6px 0 12px;font-size:16px}
#rescueBtn{width:100%;min-height:60px;font-size:20px;margin:0 0 18px;background:#fde68a}
#rescue{z-index:12;align-items:flex-start;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#rescue .dialog{width:min(860px,100%);margin:auto}
.rc{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rc .info{flex:1;min-width:220px}.rc b{font-size:17px}.rc .thumbs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rc .thumbs img{width:54px;height:44px;object-fit:contain;background:#fff;border-radius:8px;border:2px solid rgba(29,59,37,.3)}
.rc.cur{box-shadow:0 0 0 4px #16a34a}
#rDraw{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#rDraw button{width:104px;padding:4px;border:3px solid var(--ink);border-radius:14px;background:#fff;font:inherit;font-size:13px;color:var(--ink)}
#rDraw button img{width:100%;height:70px;object-fit:contain}
#rDraw button.off{opacity:.3}
#toast{z-index:40!important;position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(29,59,37,.95);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:92vw;text-align:center}
#toast.show{opacity:1}
</style>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
<main>
  <header>
    <h1>🦖 Drawrassic Park<small data-t="subtitle"></small></h1>
    <div class="langs" id="langs"></div>
  </header>
  <a class="btn primary" id="continue" href="#"></a>
  <button class="btn" id="rescueBtn"></button>
  <div id="list"></div>
  <section class="copy panel">
    <h3 data-t="copyTitle"></h3>
    <div class="note" data-t="copyHelp"></div>
    <div class="row"><label data-t="from"></label><select id="from"></select><label data-t="to"></label><select id="to"></select>
      <button class="btn" id="copyBtn" data-t="copyBtn"></button></div>
    <div id="undos"></div>
    <p class="note" data-t="storageNote"></p>
  </section>
  <section class="copy panel">
    <h3 data-t="storTitle"></h3>
    <div class="note" data-t="storHelp"></div>
    <div id="storUse" class="sum"></div>
    <div id="storList"></div>
  </section>
</main>
<div id="dlg" class="overlay hidden" style="z-index:30"><div class="dialog panel">
  <h3 id="dlgTitle"></h3>
  <div id="dlgBody"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="dlgNo"></button><button class="btn danger" id="dlgYes"></button></div>
</div></div>
<div id="rescue" class="overlay hidden"><div class="dialog panel">
  <div class="row" style="margin:0"><h3 id="rTitle" style="flex:1;margin:0"></h3><button class="btn" id="rClose"></button></div>
  <div id="rBody"></div>
</div></div>
<div id="toast"></div>
<script>
(()=>{
'use strict';
const GAME_ID='drawrassic-park';
const EMBEDDED={"game": "drawrassic-park", "versions": [{"v": "3.34", "file": "drawrassic-park-v3.34.html", "date": "2026-11-13", "schema": 8, "switcher": true, "notes": {"en": "🧹 Tidier screen + 🛝 playground: the top bar keeps only amber, coins, ☀️, 💾 and a ☰ menu; the quick bar is slimmer and folds away; the dino card shows 4 buttons and ⋯; speech bubbles stop piling up. New: slide, trampoline, swing, seesaw and bubble machine, 🫧 bubbles that float dinos away, and 🎈 balloons that lift them.", "fr": "🧹 Écran plus clair + 🛝 aire de jeux : la barre du haut garde ambre, pièces, ☀️, 💾 et un menu ☰ ; la barre d’outils est plus fine et se replie ; la fiche du dino montre 4 boutons et ⋯ ; les bulles de paroles ne s’empilent plus. Nouveau : toboggan, trampoline, balançoire, bascule, machine à bulles, 🫧 bulles qui emportent les dinos et 🎈 ballons qui les soulèvent.", "zh-Hans": "🧹 界面变清爽 + 🛝 游乐场：顶部只留琥珀、金币、☀️、💾 和 ☰ 菜单；快捷栏更小还能收起；恐龙卡片只显示 4 个按钮和 ⋯；对话气泡不再叠在一起。新增：滑梯、蹦床、秋千、跷跷板、泡泡机，🫧 魔法泡泡能把恐龙装进去飘走，🎈 气球能把恐龙带上天。", "zh-Hant": "🧹 介面變清爽 + 🛝 遊樂場：頂部只留琥珀、金幣、☀️、💾 和 ☰ 選單；快捷列更小還能收起；恐龍卡片只顯示 4 個按鈕和 ⋯；對話氣泡不再疊在一起。新增：溜滑梯、彈跳床、鞦韆、蹺蹺板、泡泡機，🫧 魔法泡泡能把恐龍裝進去飄走，🎈 氣球能把恐龍帶上天。"}}, {"v": "3.33", "file": "drawrassic-park-v3.33.html", "date": "2026-11-13", "schema": 8, "switcher": true, "notes": {"en": "🪁 Kites and silly clouds: 🎲 now rolls 24 silly cloud shapes (dino, bunny, cat, poop swirl, underpants, mustache, teapot…) that can morph when squeezed. Draw a kite (or roll one of 8 designs) and give it to a dino: it runs with it in the wind, the kite climbs, loops when tapped, and a strong gust can lift a small dino.", "fr": "🪁 Cerfs-volants et nuages rigolos : 🎲 donne 24 formes de nuages rigolotes (dino, lapin, chat, tortillon, slip, moustache, théière…) qui peuvent se transformer quand on les presse. Dessine un cerf-volant (ou 8 modèles au hasard) et donne-le à un dino : il court dans le vent, le cerf-volant monte, fait un looping quand on le touche, et un coup de vent peut soulever un petit dino.", "zh-Hans": "🪁 风筝和搞怪云：🎲 现在会随机出 24 种奇形怪状的云（恐龙、兔子、猫、便便、内裤、大胡子、茶壶……），挤一挤还会变形。画一只风筝（或者随机 8 种图案）交给恐龙，它会顶着风跑，风筝越飞越高，点风筝会翻跟头，大风还能把小恐龙拉上天。", "zh-Hant": "🪁 風箏和搞怪雲：🎲 現在會隨機出 24 種奇形怪狀的雲（恐龍、兔子、貓、便便、內褲、大鬍子、茶壺……），擠一擠還會變形。畫一隻風箏（或者隨機 8 種圖案）交給恐龍，牠會頂著風跑，風箏越飛越高，點風箏會翻跟頭，大風還能把小恐龍拉上天。"}}, {"v": "3.32", "file": "drawrassic-park-v3.32.html", "date": "2026-11-13", "schema": 8, "switcher": true, "notes": {"en": "☁️ Weather remote: draw your own cloud (or roll a random one), pick what it does — rain, thunder, snow, rainbow, snacks, frogs, flowers or coins — and put it in the park. It floats with the wind, you can drag it with a finger, tap it to squeeze it, and steer all clouds with the remote. Puddles, umbrellas, snowmen and rainbows.", "fr": "☁️ Télécommande météo : dessine ton nuage (ou un nuage au hasard), choisis ce qu’il fait — pluie, orage, neige, arc-en-ciel, goûters, grenouilles, fleurs ou pièces — et pose-le dans le parc. Il suit le vent, tu peux le traîner du doigt, le presser d’une touche et piloter tous les nuages. Flaques, parapluies, bonshommes de neige et arcs-en-ciel.", "zh-Hans": "☁️ 天气遥控器：自己画一朵云（或者随机一朵），选它干什么——下雨、打雷、下雪、彩虹、掉零食、掉青蛙、开花或掉金币——放到公园里。云会跟着风飘，你可以用手指拖着它走，点它会挤出一阵雨，还能用遥控器指挥所有的云。还有水坑、雨伞、雪人和彩虹。", "zh-Hant": "☁️ 天氣遙控器：自己畫一朵雲（或者隨機一朵），選它幹什麼——下雨、打雷、下雪、彩虹、掉零食、掉青蛙、開花或掉金幣——放到公園裡。雲會跟著風飄，你可以用手指拖著它走，點它會擠出一陣雨，還能用遙控器指揮所有的雲。還有水坑、雨傘、雪人和彩虹。"}}, {"v": "3.31", "file": "drawrassic-park-v3.31.html", "date": "2026-11-13", "schema": 8, "switcher": true, "notes": {"en": "🌦️ Sky fix: weather and disasters can be turned off. Tap a lit button again to stop it, use ⛔ Stop for a disaster, or ☀️ Clear sky to stop everything at once.", "fr": "🌦️ Correctif du ciel : on peut arrêter la météo et les catastrophes. Touche encore un bouton allumé, utilise ⛔ Arrêter pour une catastrophe, ou ☀️ Ciel dégagé pour tout arrêter.", "zh-Hans": "🌦️ 修好天气：天气和灾难都能取消了。再点一次亮着的按钮就停；灾难有 ⛔ 停止按钮；☀️ 一键放晴能全部停止。", "zh-Hant": "🌦️ 修好天氣：天氣和災難都能取消了。再點一次亮著的按鈕就停；災難有 ⛔ 停止按鈕；☀️ 一鍵放晴能全部停止。"}}, {"v": "3.30", "file": "drawrassic-park-v3.30.html", "date": "2026-11-13", "schema": 8, "switcher": true, "notes": {"en": "🍱 Snack Bar: 37 foods, from steak to a super-hot chili (red head, steam, fire breath), spider (web-shooting spider dino), giant mushroom, shrink candy, beans, coffee, ghost jelly, twin cherries and more. Feed people too, snatch snacks, banana peels, snack races, snack rain and a chili contest. Wild dinos get a 🌿 Wild tag.", "fr": "🍱 Bar à goûters : 37 aliments, du steak au piment de l’enfer (tête rouge, fumée, souffle de feu), araignée (dino-araignée qui lance des toiles), champi géant, bonbon rétrécissant, haricots, café, gelée fantôme, cerises jumelles… On nourrit aussi les visiteurs, on se vole les goûters, peaux de banane, courses au goûter, pluie de goûters et concours de piment. Les dinos sauvages ont une étiquette 🌿.", "zh-Hans": "🍱 零食大全：37 种食物，从牛排到变态辣辣椒（头变红冒烟喷火）、蜘蛛（变成会吐丝的蜘蛛龙）、变大蘑菇、缩小糖、豆子、咖啡、幽灵软糖、分身樱桃……还能喂游客、半路抢食、香蕉皮滑倒、抢食大战、零食雨和辣椒王挑战。野生恐龙有 🌿 野生 标记。", "zh-Hant": "🍱 零食大全：37 種食物，從牛排到變態辣辣椒（頭變紅冒煙噴火）、蜘蛛（變成會吐絲的蜘蛛龍）、變大蘑菇、縮小糖、豆子、咖啡、幽靈軟糖、分身櫻桃……還能餵遊客、半路搶食、香蕉皮滑倒、搶食大戰、零食雨和辣椒王挑戰。野生恐龍有 🌿 野生 標記。"}}, {"v": "3.29", "file": "drawrassic-park-v3.29.html", "date": "2026-11-13", "schema": 8, "switcher": true, "notes": {"en": "🍖 Feeding fix: every dino can be fed again, wild ones too. The snack flies into the dino's mouth, it chews, crumbs fly and the tummy bar fills. Full dinos shake their head and the snack drops for someone else. Feeding a wild dino earns trust hearts that make catching easier.", "fr": "🍖 Correctif repas : on peut de nouveau nourrir tous les dinos, même les sauvages. Le goûter vole jusqu’à la bouche, le dino mâche, des miettes volent et le ventre se remplit. Un dino repu secoue la tête et le goûter tombe pour un autre. Nourrir un dino sauvage donne des cœurs de confiance qui facilitent la capture.", "zh-Hans": "🍖 修好喂食：所有恐龙都能喂了，野生恐龙也能喂。零食会飞进恐龙嘴里，它会嚼嚼嚼、掉碎屑，肚子条变满。吃饱的恐龙会摇头，零食掉在地上给别的恐龙吃。喂野生恐龙能得到信任心，越信任越好抓。", "zh-Hant": "🍖 修好餵食：所有恐龍都能餵了，野生恐龍也能餵。零食會飛進恐龍嘴裡，牠會嚼嚼嚼、掉碎屑，肚子條變滿。吃飽的恐龍會搖頭，零食掉在地上給別的恐龍吃。餵野生恐龍能得到信任心，越信任越好抓。"}}, {"v": "3.28", "file": "drawrassic-park-v3.28.html", "date": "2026-11-13", "schema": 8, "switcher": true, "notes": {"en": "🎪 Creation play: 🏆 design contest with themes, three judges and prizes; 🃏 trading cards for every dino; ✨ doodle magic (circle = shield, zigzag = lightning, heart = heal, line = rainbow); 🎨 draw & guess for two or more players; and a welcome ceremony for every new dino.", "fr": "🎪 Jeux de création : 🏆 concours de design avec thèmes, trois juges et prix ; 🃏 cartes à collectionner pour chaque dino ; ✨ magie dessinée (cercle = bouclier, zigzag = éclair, cœur = soin, trait = arc-en-ciel) ; 🎨 dessine et devine à plusieurs ; et une fête de bienvenue pour chaque nouveau dino.", "zh-Hans": "🎪 创作玩法：🏆 设计大赛（主题、三位评委、奖品）；🃏 每只恐龙都有自己的卡牌；✨ 涂鸦魔法（画圆圈＝护盾，折线＝闪电，爱心＝治疗，直线＝彩虹）；🎨 你画我猜多人玩；每只新恐龙进公园都有欢迎仪式。", "zh-Hant": "🎪 創作玩法：🏆 設計大賽（主題、三位評審、獎品）；🃏 每隻恐龍都有自己的卡牌；✨ 塗鴉魔法（畫圓圈＝護盾，折線＝閃電，愛心＝治療，直線＝彩虹）；🎨 你畫我猜多人玩；每隻新恐龍進公園都有歡迎儀式。"}}, {"v": "3.27", "file": "drawrassic-park-v3.27.html", "date": "2026-11-13", "schema": 8, "switcher": true, "notes": {"en": "🏭 Crazy Mix Factory: build monsters from 16 heads, 12 bodies, 10 legs, 10 tails, 8 wings and 10 hats (2–3 heads, more legs, long necks, size), by slot machine, cooking pot, words, capsule or blind relay; names, special moves and stats come from the parts. Plus a 🔀 head-swap event and 🤖 merging 3 dinos into a giant.", "fr": "🏭 Usine à monstres : 16 têtes, 12 corps, 10 pattes, 10 queues, 8 ailes et 10 chapeaux (2–3 têtes, plus de pattes, long cou, taille), par machine à sous, marmite, mots, capsule ou relais à l’aveugle ; le nom, l’attaque spéciale et les stats viennent des morceaux. Et un événement 🔀 échange de têtes et la 🤖 fusion de 3 dinos en géant.", "zh-Hans": "🏭 疯狂混搭工厂：16 种头、12 种身体、10 种腿、10 种尾巴、8 种翅膀、10 种帽子（还能有 2–3 个头、更多腿、长脖子、变大变小），可以用老虎机、料理锅、写字、扭蛋或蒙眼接龙来做；名字、必杀技和能力值都由部件决定。还有 🔀 换头随机事件和 🤖 三只恐龙合体成巨兽。", "zh-Hant": "🏭 瘋狂混搭工廠：16 種頭、12 種身體、10 種腿、10 種尾巴、8 種翅膀、10 種帽子（還能有 2–3 個頭、更多腿、長脖子、變大變小），可以用老虎機、料理鍋、寫字、扭蛋或矇眼接龍來做；名字、必殺技和能力值都由部件決定。還有 🔀 換頭隨機事件和 🤖 三隻恐龍合體成巨獸。"}}, {"v": "3.26", "file": "drawrassic-park-v3.26.html", "date": "2026-11-13", "schema": 8, "switcher": true, "notes": {"en": "🎨 Dino Studio: Easy mode in 3 steps (body → 18 snap-on parts → 10 patterns and 9 stickers), 15 magic brushes, 🎲 random dinos; Pro mode with 4 layers, shapes, shading, colour picker, eyedropper, move/flip/rotate/scale, pinch zoom, undo/redo and rig markers; choose voice, special move and stats; edit any park dino; share dinos as codes.", "fr": "🎨 Studio à dinos : mode Facile en 3 étapes (corps → 18 morceaux à poser → 10 motifs et 9 autocollants), 15 pinceaux magiques, 🎲 dinos au hasard ; mode Pro avec 4 calques, formes, dégradés, nuancier, pipette, déplacer/retourner/tourner/agrandir, zoom à deux doigts, annuler/rétablir et repères d’animation ; choisis la voix, l’attaque spéciale et les stats ; modifie n’importe quel dino du parc ; partage tes dinos par code.", "zh-Hans": "🎨 恐龙工作室：简单模式三步完成（身体 → 18 种部件 → 10 种花纹和 9 种贴纸），15 种魔法笔刷，🎲 随机恐龙；专业模式有 4 个图层、形状、渐变、调色盘、吸色、移动/翻转/旋转/缩放、两指缩放、撤销/重做和骨架点；可以选声音、必杀技和能力值；公园里的恐龙都能重新编辑；还能用代码把恐龙分享给朋友。", "zh-Hant": "🎨 恐龍工作室：簡單模式三步完成（身體 → 18 種部件 → 10 種花紋和 9 種貼紙），15 種魔法筆刷，🎲 隨機恐龍；專業模式有 4 個圖層、形狀、漸層、調色盤、吸色、移動/翻轉/旋轉/縮放、兩指縮放、復原/重做和骨架點；可以選聲音、必殺技和能力值；公園裡的恐龍都能重新編輯；還能用代碼把恐龍分享給朋友。"}}, {"v": "3.25", "file": "drawrassic-park-v3.25.html", "date": "2026-11-13", "schema": 7, "switcher": true, "notes": {"en": "💥 Effects show: glowing sparks, smoke, shock rings and flashes of light on hits, knockouts, level-ups, hatching, roars, lightning and bosses; tiny freeze on big hits; smooth screen shake; and 🎆 fireworks on the quick bar.", "fr": "💥 Festival d’effets : étincelles lumineuses, fumée, anneaux de choc et éclairs de lumière sur les coups, K.-O., niveaux, éclosions, cris, la foudre et les boss ; petit arrêt sur les gros coups ; tremblement d’écran plus doux ; et 🎆 feu d’artifice dans la barre rapide.", "zh-Hans": "💥 特效大爆炸：打中、打倒、升级、孵蛋、大吼、闪电、Boss 出场都有发光火花、烟雾、冲击波和闪光；重击会定格一下；屏幕震动更顺滑；快捷栏里还能 🎆 放烟花。", "zh-Hant": "💥 特效大爆炸：打中、打倒、升級、孵蛋、大吼、閃電、Boss 出場都有發光火花、煙霧、衝擊波和閃光；重擊會定格一下；螢幕震動更順滑；快捷列裡還能 🎆 放煙火。"}}, {"v": "3.24", "file": "drawrassic-park-v3.24.html", "date": "2026-11-13", "schema": 7, "switcher": true, "notes": {"en": "🎨 Better pictures: outlined and shaded dinos, layered snowy mountains, a glowing volcano, fluffy shaded clouds, sun rays in the morning, warm sunsets, sparkling lakes, flowers, nicer trees, bushes, rocks, amber and coins, and people with eyes, outlines and shading.", "fr": "🎨 De plus belles images : dinos avec contour et ombres, montagnes enneigées en couches, volcan lumineux, nuages ombrés, rayons du soleil le matin, couchers de soleil chauds, lacs scintillants, fleurs, arbres, buissons, rochers, ambre et pièces plus jolis, et des visiteurs avec des yeux, des contours et des ombres.", "zh-Hans": "🎨 画面升级：恐龙有了描边和明暗，层层雪山、发光的火山、立体的云、早晨的阳光光束、暖暖的夕阳、闪闪发光的湖、小花，树、灌木、石头、琥珀和金币都更好看了，游客也有了眼睛、描边和明暗。", "zh-Hant": "🎨 畫面升級：恐龍有了描邊和明暗，層層雪山、發光的火山、立體的雲、早晨的陽光光束、暖暖的夕陽、閃閃發光的湖、小花，樹、灌木、石頭、琥珀和金幣都更好看了，遊客也有了眼睛、描邊和明暗。"}}, {"v": "3.23", "file": "drawrassic-park-v3.23.html", "date": "2026-11-13", "schema": 7, "switcher": true, "notes": {"en": "🦖 Livelier dinos (head, tail, hops, spins, roars, rolling KO, sleepy belly flop, blinking eyes), a huge library of jokes and funny lines, a quick bar you can customise (✏️ or long-press), and 📊 park data with charts.", "fr": "🦖 Des dinos plus vivants (tête, queue, sauts, pirouettes, cris, K.-O. sur le dos, sieste, clignements d’yeux), une énorme bibliothèque de blagues et de répliques, une barre rapide à ton goût (✏️ ou appui long) et 📊 les données du parc en graphiques.", "zh-Hans": "🦖 恐龙更生动了（摆头、甩尾、蹦跳、转圈、大吼、被打倒会翻肚皮、睡觉会趴下、会眨眼），超大的笑话和台词库，可以自己定制的快捷栏（点 ✏️ 或长按），还有 📊 带图表的公园数据。", "zh-Hant": "🦖 恐龍更生動了（擺頭、甩尾、蹦跳、轉圈、大吼、被打倒會翻肚皮、睡覺會趴下、會眨眼），超大的笑話和台詞庫，可以自己訂製的快捷列（點 ✏️ 或長按），還有 📊 帶圖表的公園數據。"}}, {"v": "3.22", "file": "drawrassic-park-v3.22.html", "date": "2026-11-13", "schema": 7, "switcher": true, "notes": {"en": "🎲 Random events! Jailbreak, flying saucer, fart storm, superstar visit, mystery egg, time rift and dino flu — every couple of minutes something happens. 🎲 in Settings starts one now.", "fr": "🎲 Événements au hasard ! Évasion, soucoupe volante, tempête de prouts, visite d’une star, œuf mystère, faille temporelle et grippe des dinos : toutes les deux minutes environ, il se passe quelque chose. 🎲 dans les réglages en lance un tout de suite.", "zh-Hans": "🎲 随机事件来了！恐龙越狱、飞碟、放屁风暴、超级明星、神秘巨蛋、时空裂缝、恐龙感冒——每隔两分钟左右就会发生点什么。设置里的 🎲 可以马上来一个。", "zh-Hant": "🎲 隨機事件來了！恐龍越獄、飛碟、放屁風暴、超級明星、神祕巨蛋、時空裂縫、恐龍感冒——每隔兩分鐘左右就會發生點什麼。設定裡的 🎲 可以馬上來一個。"}}, {"v": "3.21", "file": "drawrassic-park-v3.21.html", "date": "2026-11-13", "schema": 7, "switcher": true, "notes": {"en": "🖥️ Smoother when the park gets busy: if frames slow down, the game draws at a slightly lower resolution (down to 50%) and goes back to full sharpness when things calm down.", "fr": "🖥️ Plus fluide quand le parc est chargé : si les images ralentissent, le jeu dessine en résolution un peu plus basse (jusqu’à 50 %) et revient à la pleine netteté quand ça se calme.", "zh-Hans": "🖥️ 公园很热闹时更流畅：画面变卡时，游戏会稍微降低画面清晰度（最低 50%），不卡了再自动变回清晰。", "zh-Hant": "🖥️ 公園很熱鬧時更流暢：畫面變卡時，遊戲會稍微降低畫面清晰度（最低 50%），不卡了再自動變回清晰。"}}, {"v": "3.20", "file": "drawrassic-park-v3.20.html", "date": "2026-11-13", "schema": 7, "switcher": true, "notes": {"en": "👥 Lively visitors: 16 kinds of people (kids, grandparents, photographers, joggers, scientists, artists, astronauts…) with real walking, waving and photo poses. They walk around ponds and step away from fights. Hired staff now have jobs: ranger, vet, keeper, guard, cleaner.", "fr": "👥 Visiteurs vivants : 16 sortes de gens (enfants, grands-parents, photographes, joggeurs, scientifiques, artistes, astronautes…) qui marchent, saluent et prennent des photos. Ils contournent les mares et s’éloignent des bagarres. Le personnel a un métier : ranger, vétérinaire, soigneur, gardien, agent d’entretien.", "zh-Hans": "👥 游客活起来了：16 种人（小朋友、爷爷奶奶、摄影师、跑步的人、科学家、画家、宇航员……），会走路、挥手、拍照。他们会绕开水池，看到恐龙打架会躲开。雇来的员工有了职业：护林员、兽医、饲养员、保安、清洁工。", "zh-Hant": "👥 遊客活起來了：16 種人（小朋友、爺爺奶奶、攝影師、跑步的人、科學家、畫家、太空人……），會走路、揮手、拍照。他們會繞開水池，看到恐龍打架會躲開。雇來的員工有了職業：護林員、獸醫、飼養員、保全、清潔工。"}}, {"v": "3.19", "file": "drawrassic-park-v3.19.html", "date": "2026-11-13", "schema": 7, "switcher": true, "notes": {"en": "🎮 Xbox controller: a cursor on the left stick (A taps or holds, like a finger), D-pad for every button and menu, coloured A/B/X/Y hints, 2-player army battles with two controllers. 📺 Bigger text on the TV.", "fr": "🎮 Manette Xbox : un curseur au stick gauche (A touche ou tient, comme un doigt), la croix pour tous les boutons et menus, aides A/B/X/Y en couleur, batailles d’armées à deux manettes. 📺 Texte plus grand sur la télé.", "zh-Hans": "🎮 Xbox 手柄：左摇杆控制光标（A 键点击或按住，就像手指），十字键可以选所有按钮和菜单，彩色 A/B/X/Y 提示，两个手柄玩双人军团大战。📺 电视上的字更大。", "zh-Hant": "🎮 Xbox 手把：左搖桿控制游標（A 鍵點擊或按住，就像手指），十字鍵可以選所有按鈕和選單，彩色 A/B/X/Y 提示，兩個手把玩雙人軍團大戰。📺 電視上的字更大。"}}, {"v": "3.18", "file": "drawrassic-park-v3.18.html", "date": "2026-11-13", "schema": 7, "switcher": true, "notes": {"en": "🌐 The whole game in four languages: English, Français, 简体中文, 繁體中文 — menus, shop, lab, arena, help and the dinos' jokes. Switch in Help or ⚙️ Settings.", "fr": "🌐 Tout le jeu en quatre langues : English, Français, 简体中文, 繁體中文 — menus, boutique, labo, arène, aide et blagues des dinos. Change dans l’aide ou ⚙️ Réglages.", "zh-Hans": "🌐 整个游戏支持四种语言：English、Français、简体中文、繁體中文——菜单、商店、实验室、竞技场、帮助和恐龙的笑话都翻译了。在帮助或 ⚙️ 设置里切换。", "zh-Hant": "🌐 整個遊戲支援四種語言：English、Français、简体中文、繁體中文——選單、商店、實驗室、競技場、說明和恐龍的笑話都翻譯了。在說明或 ⚙️ 設定裡切換。"}}, {"v": "3.17", "file": "drawrassic-park-v3.17.html", "date": "2026-11-12", "schema": 7, "switcher": true, "notes": {"en": "🌐 Online army battles by room code: one player creates a room (5-letter code or link), the other joins from another iPad, computer or Xbox.", "fr": "🌐 Batailles d’armées en ligne avec un code de salle : un joueur crée une salle (code de 5 lettres ou lien), l’autre la rejoint depuis un autre iPad, ordinateur ou Xbox.", "zh-Hans": "🌐 在线军团大战：一个人创建房间（5 位房间码或链接），另一个人用另一台 iPad、电脑或 Xbox 加入。", "zh-Hant": "🌐 線上軍團大戰：一個人建立房間（5 位房間碼或連結），另一個人用另一台 iPad、電腦或 Xbox 加入。"}}, {"v": "3.16", "file": "drawrassic-park-v3.16.html", "date": "2026-11-12", "schema": 7, "switcher": true, "notes": {"en": "⚔️ Army Battle for 2 players on one iPad: each builds an army with 100 points, then both armies fight; each player has Charge, Defend and Super move buttons on their own side.", "fr": "⚔️ Bataille d’armées à 2 sur un iPad : chacun construit une armée avec 100 points, puis les armées s’affrontent ; chaque joueur a Charge, Défense et Super attaque de son côté.", "zh-Hans": "⚔️ 军团大战（同一台 iPad 双人）：每人用 100 点组建军团，然后两军开战；每位玩家在自己那一边有冲锋、防守、必杀技按钮。", "zh-Hant": "⚔️ 軍團大戰（同一台 iPad 雙人）：每人用 100 點組建軍團，然後兩軍開戰；每位玩家在自己那一邊有衝鋒、防守、必殺技按鈕。"}}, {"v": "3.15", "file": "drawrassic-park-v3.15.html", "date": "2026-11-12", "schema": 7, "switcher": true, "notes": {"en": "🌦️ Sky & powers: tap the sun/moon button for time of day, 6 kinds of weather (rain, thunderstorm, snow, wind, fog) and 6 disasters (earthquake, volcano, meteors, flood, tornado, ice age).", "fr": "🌦️ Ciel et pouvoirs : touche le bouton soleil/lune pour l’heure, 6 météos (pluie, orage, neige, vent, brouillard) et 6 catastrophes (séisme, volcan, météores, inondation, tornade, ère glaciaire).", "zh-Hans": "🌦️ 天空与神力：点太阳/月亮按钮，可以选时间、6 种天气（雨、雷雨、雪、大风、大雾）和 6 种灾难（地震、火山、流星雨、洪水、龙卷风、冰河时代）。", "zh-Hant": "🌦️ 天空與神力：點太陽/月亮按鈕，可以選時間、6 種天氣（雨、雷雨、雪、大風、大霧）和 6 種災難（地震、火山、流星雨、洪水、龍捲風、冰河時代）。"}}, {"v": "3.14", "file": "drawrassic-park-v3.14.html", "date": "2026-11-12", "schema": 7, "switcher": true, "notes": {"en": "Visitors, facilities and rangers: build ice-cream carts, a carousel, a clinic, lamps and more with coins; visitors come, watch your dinos and pay; rangers look after the park.", "fr": "Visiteurs, installations et rangers : construis avec des pièces chariots à glaces, manège, clinique, lampadaires… ; les visiteurs viennent voir tes dinos et paient ; les rangers s’occupent du parc.", "zh-Hans": "游客、设施和护林员：用金币建冰淇淋车、旋转木马、诊所、路灯等；游客来看恐龙还会付钱；护林员帮你照顾公园。", "zh-Hant": "遊客、設施和護林員：用金幣建冰淇淋車、旋轉木馬、診所、路燈等；遊客來看恐龍還會付錢；護林員幫你照顧公園。"}}, {"v": "3.13", "file": "drawrassic-park-v3.13.html", "date": "2026-11-12", "schema": 6, "switcher": true, "notes": {"en": "🧪 Lab: 10 materials to collect, 5 things to make (energy juice, XP candy, mystery, legend and dark eggs), 🧬 fusion of two dinos (head of one, body of the other) and the 📖 Fusion Book.", "fr": "🧪 Labo : 10 matériaux à collecter, 5 choses à fabriquer (jus d’énergie, bonbon d’XP, œufs mystère, légendaire et noir), 🧬 fusion de deux dinos (la tête de l’un, le corps de l’autre) et le 📖 livre des fusions.", "zh-Hans": "🧪 实验室：收集 10 种材料，制作 5 种道具（能量果汁、经验糖、神秘蛋、传说蛋、暗黑蛋），🧬 融合两只恐龙（一只的头 + 另一只的身体），还有 📖 融合图鉴。", "zh-Hant": "🧪 實驗室：收集 10 種材料，製作 5 種道具（能量果汁、經驗糖、神秘蛋、傳說蛋、暗黑蛋），🧬 融合兩隻恐龍（一隻的頭 + 另一隻的身體），還有 📖 融合圖鑑。"}}, {"v": "3.12", "file": "drawrassic-park-v3.12.html", "date": "2026-11-12", "schema": 5, "switcher": true, "notes": {"en": "Funnier dinos: 30 riddles with punchlines, lines for every dino group and 40 species, lines for what is happening, and little conversations between dinos.", "fr": "Des dinos plus drôles : 30 devinettes avec chute, des répliques pour chaque groupe et 40 espèces, selon ce qui se passe, et de petites conversations entre dinos.", "zh-Hans": "恐龙更搞笑了：30 个脑筋急转弯（先问后答）、每类恐龙和 40 种恐龙的专属台词、看情况说的台词，还有恐龙之间的小对话。", "zh-Hant": "恐龍更搞笑了：30 個腦筋急轉彎（先問後答）、每類恐龍和 40 種恐龍的專屬台詞、看情況說的台詞，還有恐龍之間的小對話。"}}, {"v": "3.11", "file": "drawrassic-park-v3.11.html", "date": "2026-11-12", "schema": 5, "switcher": true, "notes": {"en": "Boss Altar: tap the altar in the Boss Arena to challenge any of the 5 bosses in the colosseum with up to 6 of your dinos.", "fr": "Autel des boss : touche l’autel de l’arène des boss pour défier l’un des 5 boss au colisée avec jusqu’à 6 de tes dinos.", "zh-Hans": "Boss 祭坛：点 Boss 竞技场里的祭坛，带最多 6 只恐龙进竞技场挑战 5 个 Boss 中的任意一个。", "zh-Hant": "Boss 祭壇：點 Boss 競技場裡的祭壇，帶最多 6 隻恐龍進競技場挑戰 5 個 Boss 中的任意一個。"}}, {"v": "3.10", "file": "drawrassic-park-v3.10.html", "date": "2026-11-12", "schema": 5, "switcher": true, "notes": {"en": "141 dino species with rarity (common to legendary); set health, attack, stamina and hunger in the 🎛️ number panel or per dino. A boss every night from night 5; the Mutant Dark Quetzalcoatlus from night 9.", "fr": "141 espèces de dinos avec rareté (commun à légendaire) ; règle santé, attaque, endurance et faim dans le 🎛️ tableau des nombres ou par dino. Un boss chaque nuit dès la nuit 5 ; le Quetzalcoatlus des ténèbres mutant dès la nuit 9.", "zh-Hans": "141 种恐龙，有稀有度（普通到传说）；血量、攻击、体力、饥饿可以在 🎛️ 数值面板或每只恐龙的属性里设置。第 5 夜起每晚都有 Boss，第 9 夜起出现变异·暗黑风神翼龙。", "zh-Hant": "141 種恐龍，有稀有度（普通到傳說）；血量、攻擊、體力、飢餓可以在 🎛️ 數值面板或每隻恐龍的屬性裡設定。第 5 夜起每晚都有 Boss，第 9 夜起出現變異·暗黑風神翼龍。"}}, {"v": "3.9", "file": "drawrassic-park-v3.9.html", "date": "2026-11-12", "schema": 4, "switcher": true, "notes": {"en": "Night bosses (4 bosses, 3 skills each) can attack on nights 1–10. Catch wild dinos in the Wild Lands with a net timing game.", "fr": "Des boss de nuit (4 boss, 3 attaques chacun) peuvent attaquer les nuits 1 à 10. Capture des dinos sauvages dans les terres sauvages avec un jeu de filet.", "zh-Hans": "夜晚 Boss：第 1–10 夜可能来袭，4 个 Boss 各有 3 个技能。野外可以用抛网小游戏抓野生恐龙。", "zh-Hant": "夜晚 Boss：第 1–10 夜可能來襲，4 個 Boss 各有 3 個技能。野外可以用拋網小遊戲抓野生恐龍。"}}, {"v": "3.8", "file": "drawrassic-park-v3.8.html", "date": "2026-11-12", "schema": 4, "switcher": true, "notes": {"en": "Xbox: after pairing in the Game Hub with a 6-letter code, the game uses the family's cloud saves without a Google sign-in on the Xbox.", "fr": "Xbox : après l’appairage dans la salle de jeux avec un code de 6 lettres, le jeu utilise les sauvegardes cloud de la famille sans connexion Google sur la Xbox.", "zh-Hans": "Xbox：在游戏大厅用 6 位配对码配对后，不用在 Xbox 上登录 Google，就能用家里的云存档。", "zh-Hant": "Xbox：在遊戲大廳用 6 位配對碼配對後，不用在 Xbox 上登入 Google，就能用家裡的雲端存檔。"}}, {"v": "3.7", "file": "drawrassic-park-v3.7.html", "date": "2026-11-12", "schema": 4, "switcher": true, "notes": {"en": "Fix: duplicate dinos made by a double import are removed automatically when the park opens (copies have the same id).", "fr": "Correctif : les dinos en double créés par un double import sont retirés automatiquement à l’ouverture du parc (les copies ont le même identifiant).", "zh-Hans": "修复：之前重复导入多出来的恐龙，打开公园时会自动清除（重复的恐龙编号相同）。", "zh-Hant": "修復：之前重複匯入多出來的恐龍，打開公園時會自動清除（重複的恐龍編號相同）。"}}, {"v": "3.6", "file": "drawrassic-park-v3.6.html", "date": "2026-11-12", "schema": 4, "switcher": true, "notes": {"en": "Fix: tapping “Load this backup” twice no longer doubles every dino. Restoring from the cloud is also protected.", "fr": "Correctif : toucher deux fois « Charger cette sauvegarde » ne double plus tous les dinos. La restauration depuis le cloud est aussi protégée.", "zh-Hans": "修复：连点两次“载入备份”不会再让恐龙翻倍。从云端恢复也加了同样的保护。", "zh-Hant": "修復：連點兩次「載入備份」不會再讓恐龍翻倍。從雲端恢復也加了同樣的保護。"}}, {"v": "3.5", "file": "drawrassic-park-v3.5.html", "date": "2026-11-12", "schema": 4, "switcher": true, "notes": {"en": "☁️ Automatic cloud backup on the family games website: sign in with Google once, and the park uploads by itself. Other devices (Xbox, PC) can load it, and you can restore any of the last backups.", "fr": "☁️ Sauvegarde cloud automatique sur le site des jeux de la famille : connecte-toi une fois avec Google et le parc s’envoie tout seul. Les autres appareils (Xbox, PC) peuvent le charger, et tu peux restaurer les dernières sauvegardes.", "zh-Hans": "☁️ 在家庭游戏网站上自动云备份：用 Google 登录一次，公园就会自己上传。Xbox、电脑也能载入同一份进度，还能从最近的云端备份里恢复。", "zh-Hant": "☁️ 在家庭遊戲網站上自動雲端備份：用 Google 登入一次，公園就會自己上傳。Xbox、電腦也能載入同一份進度，還能從最近的雲端備份裡恢復。"}}, {"v": "3.4", "file": "drawrassic-park-v3.4.html", "date": "2026-11-12", "schema": 4, "switcher": true, "notes": {"en": "Backups outside the browser: the 💾 button copies a backup code in one tap (paste it into Notes). A red dot and a reminder appear when a backup is due. A new device asks to import your backup before starting fresh.", "fr": "Sauvegardes hors du navigateur : le bouton 💾 copie un code de sauvegarde en un toucher (colle-le dans Notes). Un point rouge et un rappel apparaissent quand il faut sauvegarder. Un nouvel appareil propose d’importer ta sauvegarde avant de recommencer.", "zh-Hans": "浏览器之外的备份：点 💾 一下就复制好备份代码，粘贴到“备忘录”保存。该备份时按钮上会有红点，还会提醒你。新设备会先问你要不要导入备份，再开新公园。", "zh-Hant": "瀏覽器之外的備份：點 💾 一下就複製好備份代碼，貼到「備忘錄」保存。該備份時按鈕上會有紅點，還會提醒你。新裝置會先問你要不要匯入備份，再開新公園。"}}, {"v": "3.3", "file": "drawrassic-park-v3.3.html", "date": "2026-11-12", "schema": 4, "switcher": true, "notes": {"en": "Save safety: if the iPad’s storage opens slowly, the game no longer starts a new park over your save; it waits, and if it still can’t read it, it stops saving and asks you to reopen. Daily backups for 7 days.", "fr": "Sécurité des sauvegardes : si le stockage de l’iPad s’ouvre lentement, le jeu ne crée plus un nouveau parc par-dessus ta sauvegarde ; il attend, et s’il ne peut toujours pas la lire, il arrête d’enregistrer et te demande de rouvrir. Copies quotidiennes sur 7 jours.", "zh-Hans": "存档保护：iPad 存储打开得慢时，游戏不会再用新公园盖掉你的存档；会耐心等，实在读不出来就暂停存档，请你重新打开。每天自动备份，保留 7 天。", "zh-Hant": "存檔保護：iPad 儲存打開得慢時，遊戲不會再用新公園蓋掉你的存檔；會耐心等，實在讀不出來就暫停存檔，請你重新打開。每天自動備份，保留 7 天。"}}, {"v": "3.2", "file": "drawrassic-park-v3.2.html", "date": "2026-11-12", "schema": 4, "switcher": true, "notes": {"en": "Fix: the arena no longer pops up by itself (park dinos fight again). Pick your own fighters, and the new 👑 King of the Arena brawl with up to 150 dinos.", "fr": "Correctif : l’arène ne s’ouvre plus toute seule (les dinos du parc se battent de nouveau). Choisis tes combattants, et nouvelle mêlée 👑 Roi de l’arène jusqu’à 150 dinos.", "zh-Hans": "修复：斗兽场不再自己弹出来（公园里的恐龙又能正常打架了）。可以自己选对战的恐龙；新增 👑 竞技场之王大乱斗，最多 150 只。", "zh-Hant": "修復：鬥獸場不再自己彈出來（公園裡的恐龍又能正常打架了）。可以自己選對戰的恐龍；新增 👑 競技場之王大亂鬥，最多 150 隻。"}}, {"v": "3.1", "file": "drawrassic-park-v3.1.html", "date": "2026-11-13", "schema": 4, "switcher": true, "notes": {"en": "New ⚔️ Arena button: random dinos fight in a colosseum (1v1, 4-way, 3v3, royale of 8) with skills, sparks, shockwaves and K.O. slow-motion.", " const K={settings:GAME_ID+'/settings', launcher:GAME_ID+'/launcher'};
const SAVE_KEY={1:'drawrassic_park_v1',2:GAME_ID+'/save/s2'}, BOX_KEY={1:'drawrassic_box_v1',2:GAME_ID+'/box/s1'};
const IDB_SCHEMAS={3:{save:'save/s3',box:'box/s2'},4:{save:'save/s4',box:'box/s2'},5:{save:'save/s5',box:'box/s2'},6:{save:'save/s6',box:'box/s2'},7:{save:'save/s7',box:'box/s2'},8:{save:'save/s8',box:'box/s2'}}; // v2.3+ keep saves in IndexedDB (database "drawrassic-park")
const IDB={ db:null, ok:false,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open(GAME_ID,1); r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} }; r.onsuccess=()=>{ this.db=r.result; this.ok=true; res(true); }; r.onerror=()=>res(false); r.onblocked=()=>res(false); }catch(e){ res(false); } }); },
  get(k){ return new Promise(res=>{ if(!this.ok) return res(undefined); try{ const q=this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }catch(e){ res(undefined); } }); },
  putMany(ents){ return new Promise(res=>{ if(!this.ok) return res(false); try{ const tx=this.db.transaction('kv','readwrite'), so=tx.objectStore('kv'); for(const [k,v] of ents) so.put(v,k); tx.oncomplete=()=>res(true); tx.onerror=tx.onabort=()=>res(false); }catch(e){ res(false); } }); },
  put(k,v){ return this.putMany([[k,v]]); },
  del(k){ return new Promise(res=>{ if(!this.ok) return res(false); try{ const tx=this.db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=()=>res(true); tx.onerror=tx.onabort=()=>res(false); }catch(e){ res(false); } }); },
  keys(){ return new Promise(res=>{ if(!this.ok) return res([]); try{ const q=this.db.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess=()=>res((q.result||[]).map(String)); q.onerror=()=>res([]); }catch(e){ res([]); } }); } };
function hashStr(t){ let a=0x811c9dc5, b=0x9e3779b9^t.length; for(let i=0;i<t.length;i++){ const c=t.charCodeAt(i); a=Math.imul(a^c,16777619); b=Math.imul(b^c,2246822507); } return (a>>>0).toString(36)+(b>>>0).toString(36)+t.length.toString(36); }
async function toRefs(list){ const items=(list||[]).map(x=>Object.assign({},x)), ents=[]; for(const x of items){ if(typeof x.src!=='string') continue; const h=hashStr(x.src); ents.push(['img/'+h,x.src]); x.img=h; delete x.src; }
  if(ents.length&&!(await IDB.putMany(ents))) throw new Error('img'); return items; }
async function fromRefs(list){ const out=[]; for(const x of (Array.isArray(list)?list:[])){ if(!x) continue; if(typeof x.src==='string'){ out.push(x); continue; } const src=x.img?await IDB.get('img/'+x.img):null; if(typeof src==='string') out.push(Object.assign({},x,{src})); } return out; }
const isIdb=n=>!!IDB_SCHEMAS[n];
async function readData(n){ if(isIdb(n)){ const v=await IDB.get(IDB_SCHEMAS[n].save); if(!v||!Array.isArray(v.dinos)) return null; return Object.assign({},v,{dinos:await fromRefs(v.dinos)}); } const d=st.json(SAVE_KEY[n]); return d&&Array.isArray(d.dinos)?d:null; }
async function readBox(n){ if(isIdb(n)){ const v=await IDB.get(IDB_SCHEMAS[n].box); return Array.isArray(v)?await fromRefs(v):null; } const b=st.json(BOX_KEY[n]); return Array.isArray(b)?b:null; }
async function rawGet(n,what){ if(isIdb(n)) return await IDB.get(IDB_SCHEMAS[n][what]); return st.get(what==='save'?SAVE_KEY[n]:BOX_KEY[n]); }
async function rawSet(n,what,v){ if(isIdb(n)) return await IDB.put(IDB_SCHEMAS[n][what],v); return st.set(what==='save'?SAVE_KEY[n]:BOX_KEY[n],v); }
async function bakGet(n,what){ return isIdb(n)?await IDB.get(IDB_SCHEMAS[n][what]+'/bak-copy'):st.get(what==='save'?bakKey(n):bakBoxKey(n)); }
async function bakSet(n,what,v){ return isIdb(n)?await IDB.put(IDB_SCHEMAS[n][what]+'/bak-copy',v):st.set(what==='save'?bakKey(n):bakBoxKey(n),v); }
async function bakDel(n,what){ if(isIdb(n)) await IDB.del(IDB_SCHEMAS[n][what]+'/bak-copy'); else st.del(what==='save'?bakKey(n):bakBoxKey(n)); }
async function writeData(n,data){ if(isIdb(n)) return await IDB.put(IDB_SCHEMAS[n].save,Object.assign({},data,{dinos:await toRefs(data.dinos)})); return st.set(SAVE_KEY[n],JSON.stringify(data)); }
async function writeBox(n,box){ if(isIdb(n)) return await IDB.put(IDB_SCHEMAS[n].box,await toRefs(box)); return st.set(BOX_KEY[n],JSON.stringify(box)); }
const bakKey=n=>`${GAME_ID}/save/s${n}/bak-copy`, bakBoxKey=n=>`${GAME_ID}/save/s${n}/bak-copy-box`;
const UP={ // same migrations as the game
  1:d=>{ const o=JSON.parse(JSON.stringify(d)); o.schema=2; const ds=Array.isArray(o.dinos)?o.dinos:[], es=Array.isArray(o.eggs)?o.eggs:[];
    for(const x of ds){ x.kids=Math.max(x.kids|0, ds.filter(c=>Array.isArray(c.parents)&&c.parents.includes(x.name)).length+es.filter(e=>Array.isArray(e.parents)&&e.parents.includes(x.id)).length); } return o; },
  2:d=>Object.assign(JSON.parse(JSON.stringify(d)),{schema:3}),
  3:d=>{ const o=JSON.parse(JSON.stringify(d)); o.schema=4; const m=nx=>0.17+Math.min(1,Math.max(0,+nx||0))*0.5; for(const k of ['dinos','decor','eggs']) for(const x of (Array.isArray(o[k])?o[k]:[])) if(x) x.nx=m(x.nx); o.terrain=null; o.giftMosa=true; return o; },
  4:d=>Object.assign(JSON.parse(JSON.stringify(d)),{schema:5}), // s4 -> s5 (v3.10): adds optional per-dino stats and stamina

  7:d=>Object.assign(JSON.parse(JSON.stringify(d)),{schema:8}) }; // s7 -> s8 (v3.26): per-dino rig markers, voice pitch, special move

  2:d=>{ const o=JSON.parse(JSON.stringify(d)); delete o.schema; for(const x of (o.dinos||[])) delete x.kids; return o; },

  // s5 -> s4: drops per-dino stats (st) and stamina (sta)
  5:d=>{ const o=JSON.parse(JSON.stringify(d)); o.schema=4; for(const x of (o.dinos||[])){ delete x.st; delete x.sta; } return o; },
  // s6 -> s5: drops materials, the Fusion Book and fusion counts
  6:d=>{ const o=JSON.parse(JSON.stringify(d)); o.schema=5; delete o.mats; delete o.book; for(const x of (o.dinos||[])) delete x.fz; return o; },
  // s7 -> s6: drops rangers and facilities (older versions only know these decorations)
  7:d=>{ const o=JSON.parse(JSON.stringify(d)); o.schema=6; delete o.rangers; const old=['bush','palm','fern','rock','tree','flowers','bones','nest']; o.decor=(o.decor||[]).filter(x=>x&&old.includes(x.type)); return o; },
  // s8 -> s7: drops per-dino rig markers, voice pitch and chosen special move
  8:d=>{ const o=JSON.parse(JSON.stringify(d)); o.schema=7; for(const x of (o.dinos||[])){ delete x.rig; delete x.voice; delete x.special; } return o; } };

const st={ get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }, json(k){ const r=this.get(k); if(r==null) return null; try{ return JSON.parse(r); }catch(e){ return undefined; } } };
function sharedGet(){ const o=st.json(K.settings); return (o&&typeof o==='object')?o:{}; }
function sharedSet(p){ const o=sharedGet(); st.set(K.settings,JSON.stringify(Object.assign(o,p))); }
function detectLang(){ const l=(navigator.language||'en'); if(/^zh-(TW|HK|MO)|^zh-Hant/i.test(l)) return 'zh-Hant'; if(/^zh/i.test(l)) return 'zh-Hans'; if(/^fr/i.test(l)) return 'fr'; return 'en'; }
let lang=sharedGet().lang; if(!S[lang]) lang=detectLang();
const t=(k,v={})=>(S[lang][k]||S.en[k]).replace(/\{(\w+)\}/g,(m,x)=>v[x]!=null?v[x]:m);
let VERS=[];
function toast(m){ const e=$('#toast'); e.textContent=m; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),3000); }
function dialog(title,body,yes,onYes){ $('#dlgTitle').textContent=title; $('#dlgBody').innerHTML=''; $('#dlgBody').append(...body); $('#dlgYes').textContent=yes; $('#dlgNo').textContent=t('cancel');
  $('#dlg').classList.remove('hidden'); $('#dlgYes').onclick=()=>{ $('#dlg').classList.add('hidden'); Promise.resolve(onYes()).catch(()=>toast(t('full'))); }; $('#dlgNo').onclick=()=>$('#dlg').classList.add('hidden'); }
const el=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
async function summary(n){ let d,b; if(isIdb(n)){ d=await IDB.get(IDB_SCHEMAS[n].save); b=await IDB.get(IDB_SCHEMAS[n].box); } else { d=st.json(SAVE_KEY[n]); b=st.json(BOX_KEY[n]); }
  if(!d||!Array.isArray(d.dinos)) return null; return t('summary',{d:d.dinos.length,a:d.amber|0,c:d.coins|0,b:Array.isArray(b)?b.length:0}); }
function lastPlayed(){ const o=st.json(K.launcher); return o&&o.last; }
function go(v){ const o=st.json(K.launcher)||{}; o.last=v.v; st.set(K.launcher,JSON.stringify(o)); location.href=v.file; }
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t)); $('#rescueBtn').textContent=rt('btn');

    info.appendChild(el('div','meta',v.date+' · '+t('save',{n:v.schema})+(same.length?' · '+t('shares',{list:same.join(', v')}):'')));
    info.appendChild(el('div','notes',(v.notes&&(v.notes[lang]||v.notes.en))||''));
    const smEl=el('div','meta',''); info.appendChild(smEl); summary(v.schema).then(sm=>{ if(sm) smEl.textContent='💾 '+sm; });
    if(!v.switcher) info.appendChild(el('div','warn',t('noSwitch')));
    const b=el('a','btn primary',t('play')); b.href=v.file; b.onclick=e=>{ e.preventDefault(); go(v); };
    card.append(info,b); list.appendChild(card); });
  for(const id of ['from','to']){ const s=$('#'+id), keep=s.value; s.innerHTML=''; for(const v of VERS){ const o=el('option',null,'v'+v.v+' (s'+v.schema+')'); o.value=v.v; s.appendChild(o); } if(keep) s.value=keep; }
  if(!$('#to').value||$('#to').value===$('#from').value){ $('#from').value=VERS[Math.min(1,VERS.length-1)].v; $('#to').value=VERS[0].v; }
  const U=$('#undos'); U.innerHTML=''; const schemas=[...new Set(VERS.map(v=>v.schema))];

function lsKeys(){ const out=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&(k.startsWith(GAME_ID+'/')||k.startsWith('drawrassic_'))){ const v=localStorage.getItem(k)||''; out.push({k,bytes:(k.length+v.length)*2}); } } }catch(e){} return out.sort((a,b)=>b.bytes-a.bytes); }
const mb=b=>(b/1048576).toFixed(2)+' MB';
function keyLabel(k){ if(k===SAVE_KEY[1]) return t('lblSave',{list:VERS.filter(v=>v.schema===1).map(v=>v.v).join(', v')}); if(k===SAVE_KEY[2]) return t('lblSave',{list:VERS.filter(v=>v.schema===2).map(v=>v.v).join(', v')});
  if(/\/bak$/.test(k)) return t('lblBak'); if(/\/broken-/.test(k)) return t('lblBroken'); if(/bak-copy/.test(k)) return t('lblCopy'); if(k===BOX_KEY[1]||k===BOX_KEY[2]) return t('lblBox'); return k; }
async function renderStorage(){ const keys=lsKeys(), total=keys.reduce((a,b)=>a+b.bytes,0); let txt=t('storUse',{used:mb(total)});
  try{ if(navigator.storage&&navigator.storage.estimate){ const e=await navigator.storage.estimate(); if(e&&e.usage!=null) txt+=' · '+t('storIdb',{used:mb(e.usage)}); } }catch(_){}

    const del=el('button','btn danger',t('del')); del.onclick=()=>dialog(t('delTitle'),[el('p',null,keyLabel(it.k)+' ('+mb(it.bytes)+')'),el('p','note',t('delNote'))],t('del'),()=>{ st.del(it.k); toast(t('deleted')); render(); }); row.appendChild(del); L.appendChild(row); } }
async function copyProgress(){ const fv=VERS.find(v=>v.v===$('#from').value), tv=VERS.find(v=>v.v===$('#to').value); if(!fv||!tv) return;
  const fs=fv.schema, ts=tv.schema; if(fs===ts){ toast(t('same')); return; }
  const src=await readData(fs); if(!src){ toast(t('nosave',{v:fv.v})); return; }
  let data=src; try{ if(fs<ts){ for(let n=fs;n<ts;n++) data=UP[n](data); } else { for(let n=fs;n>ts;n--){ if(!DOWN[n]){ toast(t('cannot')); return; } data=DOWN[n](data); } } }catch(e){ toast(t('cannot')); return; }
  const body=[el('div',null,t('willCopy',{from:fv.v})),el('div','sum',(await summary(fs))||''),el('div',null,t('willReplace',{to:tv.v})),el('div','sum',(await summary(ts))||t('empty')),el('p','note',t('backupNote'))];
  dialog(t('confirmTitle',{to:tv.v}),body,t('yes'),async()=>{
    const full=()=>toast(t('full'));

    if(cur!=null&&!(await bakSet(ts,'save',cur))){ full(); return; }
    if(curBox!=null) await bakSet(ts,'box',curBox);
    try{ if(!(await writeData(ts,data))){ full(); return; } }catch(e){ full(); return; }
    const box=await readBox(fs); if(box) try{ await writeBox(ts,box); }catch(e){}
    toast(t('done',{to:tv.v})); render(); }); }
async function undoCopy(n){ const b=await bakGet(n,'save'); if(b==null) return; if(!(await rawSet(n,'save',b))){ toast(t('full')); return; } const bb=await bakGet(n,'box'); if(bb!=null) await rawSet(n,'box',bb);
  await bakDel(n,'save'); await bakDel(n,'box'); toast(t('undone')); render(); }

const rt=(k,v={})=>((RS[lang]||RS.en)[k]||RS.en[k]).replace(/\{(\w+)\}/g,(m,x)=>v[x]!=null?v[x]:m);
const okSave=v=>!!v&&typeof v==='object'&&Array.isArray(v.dinos);
const CUR=()=>Math.max(4,...VERS.map(v=>v.schema|0)), CURK=()=>'save/s'+CUR();
function vlist(n){ const l=VERS.filter(v=>v.schema===n).map(v=>'v'+v.v); return l.length?l.join(', '):'s'+n; }
function rLabel(where,k,n){ let m;
  if(where==='idb'&&k===CURK()) return rt('current');
  if(/\/bak$/.test(k)) return rt('bak'); if(/\/broken-(\d+)/.test(k)) return rt('broken')+' · '+new Date(+k.match(/broken-(\d+)/)[1]).toLocaleString();
  if(/bak-copy/.test(k)) return rt('copy'); if((m=k.match(/\/rescue-(\d+)/))) return rt('rescue')+' · '+new Date(+m[1]).toLocaleString();
  if((m=k.match(/\/day-([\d-]+)/))) return rt('day')+' · '+m[1]; if(where==='ls'&&n>=4&&k===GAME_ID+'/save/s'+n) return rt('fallback');
  if(k===('save/s'+n)||k===SAVE_KEY[n]) return rt('oldv',{v:vlist(n)}); return rt('other')+' · '+k; }
async function srcOf(x){ if(!x) return null; if(typeof x.src==='string') return x.src; if(x.img){ const v=await IDB.get('img/'+x.img); return typeof v==='string'?v:null; } return null; }
async function rCollect(){ const out=[]; const keys=await IDB.keys();
  for(const k of keys){ const m=k.match(/^save\/s(\d+)(\/|$)/); if(!m) continue; const v=await IDB.get(k); if(okSave(v)) out.push({where:'idb',key:k,n:+m[1],val:v}); }
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!k) continue; let n=0, m;
      if(k===SAVE_KEY[1]||k.startsWith(SAVE_KEY[1]+'/')) n=1; else if((m=k.match(/^drawrassic-park\/save\/s(\d+)(\/|$)/))) n=+m[1]; if(!n||/-box$/.test(k)) continue;
      let v=null; try{ v=JSON.parse(localStorage.getItem(k)); }catch(e){} if(okSave(v)) out.push({where:'ls',key:k,n,val:v}); } }catch(e){}
  for(const c of out){ const ds=c.val.dinos.filter(x=>x&&!x.test); c.d=ds.length; c.lv=ds.reduce((a,x)=>Math.max(a,x.level|0),0); c.score=ds.reduce((a,x)=>a+(x.level|0)+1,0)+(c.val.amber|0)/200+(c.val.coins|0)/20; c.ds=ds; }
  return out.sort((a,b)=>(b.where==='idb'&&b.key===CURK())-(a.where==='idb'&&a.key===CURK())||b.score-a.score); }
async function rRestore(c){ const latest=VERS[0], N=CUR(); if(c.n>N){ toast(rt('newer')); return; }
  let data=JSON.parse(JSON.stringify(c.val)); try{ for(let n=c.n;n<N;n++) data=UP[n](data); }catch(e){ toast(rt('full')); return; } data.schema=N;
  const ts=Date.now(), cur=await IDB.get(CURK()), curBox=await IDB.get('box/s2');
  if(okSave(cur)&&!(await IDB.put(CURK()+'/rescue-'+ts,cur))){ toast(rt('full')); return; } if(Array.isArray(curBox)) await IDB.put('box/s2/rescue-'+ts,curBox);
  try{ if(!(await writeData(N,data))){ toast(rt('full')); return; } }catch(e){ toast(rt('full')); return; }
  const o=st.json(K.launcher)||{}; o.last=latest.v; st.set(K.launcher,JSON.stringify(o)); toast(rt('done')); openRescue(); }
async function rToBox(hs,meta){ const ts=Date.now(), cur=await IDB.get('box/s2'), box=Array.isArray(cur)?cur.slice():[];
  if(Array.isArray(cur)&&!(await IDB.put('box/s2/rescue-'+ts,cur))){ toast(rt('full')); return; }
  hs.forEach((h,i)=>{ const m=meta[h]||{}; box.unshift({id:'r'+ts+'-'+i,name:m.name||('Dino '+(i+1)),tpl:m.tpl||null,diet:m.diet==='plant'?'plant':'meat',move:['walk','fly','swim'].includes(m.move)?m.move:'walk',
    size:['S','M','L','XL'].includes(m.size)?m.size:'M',pers:['calm','brave','fierce'].includes(m.pers)?m.pers:'brave',level:Math.min(10,Math.max(1,m.level|0||2)),img:h,saved:ts}); });
  if(!(await IDB.put('box/s2',box))){ toast(rt('full')); return; } toast(rt('boxDone',{n:hs.length})); openRescue(); }
async function openRescue(){ const R=$('#rescue'), B=$('#rBody'); $('#rTitle').textContent=rt('title'); $('#rClose').textContent=rt('close'); R.classList.remove('hidden'); B.innerHTML=''; B.appendChild(el('p','sum',rt('loading')));
  if(!IDB.ok) await Promise.race([IDB.open(),new Promise(r=>setTimeout(()=>r(false),15000))]);
  B.innerHTML='';
  if(!IDB.ok){ B.appendChild(el('p','sum',rt('noIdb'))); const b=el('button','btn primary',rt('retry')); b.onclick=openRescue; B.appendChild(b); return; }
  const latest=VERS[0]; const pb=el('a','btn primary',rt('play',{v:latest.v})); pb.href=latest.file; pb.onclick=e=>{ e.preventDefault(); go(latest); }; B.appendChild(pb);

    info.appendChild(el('b',null,rLabel(c.where,c.key,c.n))); info.appendChild(el('div','meta',rt('sum',{d:c.d,lv:c.lv,a:c.val.amber|0,c:c.val.coins|0,n:c.val.nightNum|0})));
    info.appendChild(el('div','note',c.ds.slice(0,10).map(x=>x.name).join('、')+(c.ds.length>10?' …':'')));
    const th=el('div','thumbs'); info.appendChild(th); for(const x of c.ds.slice(0,8)){ srcOf(x).then(s=>{ if(s){ const im=document.createElement('img'); im.src=s; im.alt=''; th.appendChild(im); } }); }
    card.appendChild(info); if(!(c.where==='idb'&&c.key===CURK())){ const b=el('button','btn primary',rt('restore')); b.onclick=()=>dialog(rt('confirmT'),[el('div','sum',rLabel(c.where,c.key,c.n)+' — '+rt('sum',{d:c.d,lv:c.lv,a:c.val.amber|0,c:c.val.coins|0,n:c.val.nightNum|0})),el('p','note',rt('confirmB'))],rt('yes'),()=>rRestore(c)); card.appendChild(b); }
    B.appendChild(card); }
  // drawings that are in neither the current park nor the Dino Box
  const keys=await IDB.keys(), imgs=keys.filter(k=>k.startsWith('img/')).map(k=>k.slice(4)); const used=new Set();
  const box=await IDB.get('box/s2'), others=[]; for(const n of Object.keys(IDB_SCHEMAS)){ const v=await IDB.get(IDB_SCHEMAS[n].save); if(okSave(v)) others.push(...v.dinos); }
  for(const x of [...others,...(Array.isArray(box)?box:[])]){ if(!x) continue; if(x.img) used.add(x.img); else if(typeof x.src==='string') used.add(hashStr(x.src)); }
  const meta={}; for(const c of list) for(const x of c.ds){ const h=x.img||(typeof x.src==='string'?hashStr(x.src):null); if(h&&(!meta[h]||(x.level|0)>(meta[h].level|0))) meta[h]=x; }
  const stray=imgs.filter(h=>!used.has(h)); B.appendChild(el('h3',null,rt('drawTitle')));
  if(!stray.length){ B.appendChild(el('p','note',rt('drawNone'))); return; }
  B.appendChild(el('p','note',rt('drawHelp',{n:stray.length}))); const g=el('div',null); g.id='rDraw'; B.appendChild(g); const sel=new Set(stray);
  const tb=el('button','btn primary',''); const upd=()=>{ tb.textContent=rt('toBox',{n:sel.size}); tb.disabled=!sel.size; };
  for(const h of stray){ const b=document.createElement('button'); const im=document.createElement('img'); im.alt=''; IDB.get('img/'+h).then(s=>{ if(typeof s==='string') im.src=s; }); b.appendChild(im);
    b.appendChild(el('div',null,meta[h]?meta[h].name+' · Lv'+(meta[h].level|0):'?')); b.onclick=()=>{ if(sel.has(h)) sel.delete(h); else sel.add(h); b.classList.toggle('off',!sel.has(h)); upd(); }; g.appendChild(b); }
  upd(); tb.onclick=()=>rToBox([...sel],meta); B.appendChild(tb); }
$('#rescueBtn').onclick=openRescue; $('#rClose').onclick=()=>{ $('#rescue').classList.add('hidden'); render(); };
$('#copyBtn').onclick=copyProgress;
document.addEventListener('gesturestart',e=>e.preventDefault());
async function start(list){ await Promise.race([IDB.open(),new Promise(r=>setTimeout(()=>r(false),2500))]); VERS=(list&&Array.isArray(list.versions)?list.versions:[]).filter(v=>v&&v.file&&v.v); if(!VERS.length&&EMBEDDED) VERS=EMBEDDED.versions; render(); if(location.hash==='#rescue') openRescue(); }
try{ fetch('versions.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(start,()=>start(EMBEDDED)); }catch(e){ start(EMBEDDED); }
})();
</script>
