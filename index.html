<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Hub">
<title>游戏大厅 Game Hub</title>
<style>
/* =====================================================================
   Game Hub — touch (iPad), controller (Xbox Edge on a TV), mouse, keyboard
   Layout: header · hero (continue / today's pick) · horizontal shelves
   ===================================================================== */
:root {
  --fs: max(16px, 2.6vmin);                 /* 28px at 1920x1080 */
  --bg: #0e1326; --panel: #1b2244; --panel2: #283163; --ink: #f3f5ff; --dim: #b3bbdf;
  --focus: #ffd23f; --A: #3ddc84; --B: #ff5c5c; --X: #4da3ff; --Y: #ffd23f;
  --sx: max(5vw, env(safe-area-inset-left)); --sxr: max(5vw, env(safe-area-inset-right)); --sy: 5vh;
  --tileW: 11em; --tileWide: 14.5em; --gap: 0.8em;
}
* { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", "Noto Sans CJK TC", sans-serif;
  font-size: var(--fs); line-height: 1.3; touch-action: pan-y; -webkit-text-size-adjust: 100%;
  background:
    radial-gradient(70vw 45vh at 15% -10%, rgba(64, 86, 190, .55), transparent 70%),
    radial-gradient(60vw 40vh at 100% 0%, rgba(120, 60, 190, .35), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
button, a, input { font: inherit; color: inherit; }
button, a { touch-action: manipulation; }
#app {
  min-height: 100vh; display: flex; flex-direction: column; gap: 0.85em;
  padding: max(var(--sy), env(safe-area-inset-top)) var(--sxr) max(var(--sy), env(safe-area-inset-bottom)) var(--sx);
}
body.show-focus #app { padding-bottom: calc(var(--sy) + 5.6em); }   /* room for the detail bar */
[hidden] { display: none !important; }

/* ---------- Header ---------- */
header { display: flex; align-items: center; gap: 0.45em 0.55em; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 0.5em; margin-right: auto; min-width: 0; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.6em; font-weight: 800; white-space: nowrap; }
#count { color: var(--dim); font-weight: 600; white-space: nowrap; }
.tb {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.35em; min-height: 44px; min-width: 44px;
  padding: 0.3em 0.75em; border: 0; border-radius: 0.7em; background: var(--panel2); cursor: pointer; white-space: nowrap; font-weight: 650;
  text-decoration: none;
}
.tb[aria-pressed="true"] { background: #4b5bd0; }
#pads { color: var(--dim); white-space: nowrap; }
@media (max-width: 600px) { header .tb .lbl { display: none; } }

/* ---------- Focus (big, visible from the couch) ---------- */
.nav { outline: none; }
body.show-focus .nav.focused {
  box-shadow: 0 0 0 0.17em var(--bg), 0 0 0 0.4em var(--focus), 0 0 1.3em 0.35em rgba(255, 210, 63, .5);
  position: relative; z-index: 3;
}
.tile { transition: transform .14s ease, box-shadow .14s ease; }
body.show-focus .tile.focused { transform: scale(1.045); }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } body.show-focus .tile.focused { transform: none; } }

/* ---------- Hero ---------- */
#hero {
  --hc: #4b5bd0;
  display: flex; align-items: center; gap: 1.1em; padding: 0.9em 1.1em; border-radius: 1.2em;
  background-color: #1b2244;
  background-image: linear-gradient(115deg, color-mix(in srgb, var(--hc) 62%, #121937) 0%, color-mix(in srgb, var(--hc) 22%, #151c3c) 55%, #151c3c 100%);
  box-shadow: 0 0.5em 1.6em rgba(0, 0, 0, .35);
}
.hart { flex: 0 0 6.2em; height: 6.2em; border-radius: 1.1em; background: rgba(255, 255, 255, .12); display: flex; align-items: center; justify-content: center; }
.hart .ic { width: 5.2em; height: 5.2em; filter: drop-shadow(0 .2em .3em rgba(0, 0, 0, .35)); }
.hbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.3em; }
.kicker { color: #e6e9ff; font-weight: 700; opacity: .9; }
.hname { margin: 0; font-size: 1.7em; font-weight: 850; line-height: 1.15; overflow-wrap: anywhere; }
.hblurb { margin: 0; color: #dfe3fb; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hacts { display: flex; gap: 0.6em; align-items: center; flex-wrap: wrap; margin-top: 0.25em; }
.play {
  display: inline-flex; align-items: center; gap: 0.45em; min-height: 2.3em; padding: 0.3em 1.1em; border-radius: 0.8em;
  background: linear-gradient(135deg, #34a853, #1e7a3a); color: #fff; font-size: 1.15em; font-weight: 850; text-decoration: none; white-space: nowrap;
}
.ver { display: inline-flex; align-items: baseline; gap: 0.3em; white-space: nowrap; }
.ver span { color: var(--dim); }
.ver b { font-size: 1.45em; }                   /* ≥40px at 1080p */

/* ---------- Key art & logo lettering (our own games) ---------- */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.logoT { position: relative; display: inline-block; isolation: isolate; font-weight: 900; line-height: 1.04; letter-spacing: 0.01em;
  transform: rotate(-2deg); transform-origin: left bottom; overflow-wrap: anywhere; pointer-events: none;
  color: var(--ls); -webkit-text-stroke: 0.24em var(--ls);
  text-shadow: 0 0.09em 0 var(--ls), 0 0.16em 0.06em rgba(0, 0, 0, .55), 0 0 0.5em var(--lg); }
.logoT::after { content: attr(data-t); position: absolute; left: 0; top: 0; right: 0; -webkit-text-stroke: 0; text-shadow: none; color: transparent;
  background: linear-gradient(180deg, var(--l1) 8%, var(--l2) 55%, var(--l3) 100%); -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 -0.03em 0 rgba(255, 255, 255, .65)); }
.tile.key, .tile.shot { will-change: transform; }
.tile.key .art, .tile.shot .art { height: auto; aspect-ratio: 16 / 9; display: block; overflow: hidden; contain: paint; }
.tile.key .art .ic, .tile.shot .art .ic { position: absolute; inset: 0; width: 100%; height: 100%; filter: none; }
.tile.shot .art::before { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), inset 0 -2.2em 2em -1.6em rgba(6, 8, 24, .55); }
.tile.key .art::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, 0) 28%, rgba(6, 8, 24, 0) 50%, rgba(6, 8, 24, .82) 100%); }
.tile.key .art .logoT { position: absolute; left: 0.4em; bottom: 0.3em; z-index: 1; max-width: calc(100% - 0.8em); }
.tile.key .tname { display: none; }
.hbg { display: none; }
#hero.key { position: relative; overflow: hidden; isolation: isolate; min-height: 11em; }
#hero.key .hart { display: none; }
#hero.key .hbg { display: block; position: absolute; top: 0; right: 0; bottom: 0; width: min(64%, 34em); z-index: -1; contain: paint;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 38%); mask-image: linear-gradient(90deg, transparent 0%, #000 38%); }
#hero.key .hbg img { width: 100%; height: 100%; display: block; object-fit: cover; }
.ic .kimg { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit; -webkit-user-drag: none; }
.dic { border-radius: 0.5em; overflow: hidden; }
#hero.key .hbody { max-width: 62%; }
#hero.key .hname { line-height: 1; padding: 0.1em 0 0.25em; }
#hero.key .hblurb, #hero.key .hname { text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
@media (max-width: 700px) { #hero.key .hbg { width: 100%; opacity: .45; -webkit-mask-image: none; mask-image: none; } #hero.key .hbody { max-width: none; } }

/* ---------- Search ---------- */
#sbar { display: flex; gap: 0.5em; align-items: center; }
#q {
  flex: 1; max-width: 30em; min-height: 44px; font-size: max(16px, 1em); color: var(--ink); background: var(--panel);
  border: 3px solid var(--panel2); border-radius: 0.7em; padding: 0.3em 0.7em; -webkit-user-select: text; user-select: text;
}
#q::placeholder { color: var(--dim); }
#q:focus { border-color: var(--X); outline: none; }

/* ---------- Shelves ---------- */
#shelves { display: flex; flex-direction: column; gap: 1.05em; }
.shelf { display: flex; flex-direction: column; gap: 0.35em; min-width: 0; }
.shead { display: flex; align-items: center; gap: 0 0.5em; min-height: 44px; }
.shead h2 { margin: 0; font-size: 1.2em; font-weight: 800; white-space: nowrap; flex: none; max-width: 100%; }
.shead small { font-size: 1em; color: var(--dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.arrs { margin-left: auto; display: flex; gap: 0.3em; flex: none; }
.arr { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--panel2); cursor: pointer; font-weight: 800; }
.arr:disabled { opacity: .3; cursor: default; }
body.show-focus .arrs { visibility: hidden; }
.divider { margin: 0.4em 0 -0.4em; padding-top: 0.6em; border-top: 2px solid rgba(255, 255, 255, .08); color: var(--dim); }
.divider b { color: var(--ink); font-size: 1.15em; }
.tiles {
  display: flex; gap: var(--gap); overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity;
  padding: 0.7em 0.9em 0.9em; margin: -0.7em -0.9em -0.9em; scroll-padding-inline: 0.9em;
  scrollbar-width: none; touch-action: pan-x pan-y; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
}
.tiles::-webkit-scrollbar { display: none; }
.tw { position: relative; flex: 0 0 var(--tileW); width: var(--tileW); min-width: 0; scroll-snap-align: start; display: flex; }
.tw.wide { flex-basis: var(--tileWide); width: var(--tileWide); }
.tile {
  flex: 1; min-width: 0; width: 100%; display: flex; flex-direction: column; text-decoration: none; background: var(--panel); border-radius: 1em; overflow: hidden;
  cursor: pointer;
}
.art {
  --c: #888; position: relative; height: 4.9em; display: flex; align-items: center; justify-content: center;
  background-color: var(--c);
  background-image: linear-gradient(160deg, color-mix(in srgb, var(--c) 78%, #ffffff) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 55%, #0e1326) 100%);
}
.wide .art { height: 5.8em; }
.art .ic { width: 4em; height: 4em; filter: drop-shadow(0 .15em .25em rgba(0, 0, 0, .35)); }
.wide .art .ic { width: 4.8em; height: 4.8em; }
.ic svg { width: 100%; height: 100%; display: block; }
.extb { position: absolute; left: 0.35em; bottom: 0.3em; padding: 0 0.35em; border-radius: 0.4em; background: rgba(10, 14, 30, .6); font-weight: 800; }
.tbody { flex: 1; display: flex; flex-direction: column; gap: 0.28em; padding: 0.5em 0.7em 0.65em; min-width: 0; }
.tname { font-size: 1.08em; font-weight: 800; line-height: 1.2; max-height: 2.4em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tblurb { color: var(--dim); max-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tmeta { display: flex; gap: 0.2em 0.45em; align-items: center; flex-wrap: wrap; min-width: 0; margin-top: auto; padding-top: 0.15em; }
.credit { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 100%; }
.inp { padding: 0.04em 0.45em; border-radius: 0.5em; font-weight: 700; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.inp.touch { background: #4a3a10; color: #ffe08a; }
.inp.controller { background: #16422c; color: #b9f6ca; }
.inp.both { background: #1d3b5c; color: #bfe0ff; }
.inp.keyboard { background: #3a2f4f; color: #e2d4ff; }
.star {
  position: absolute; top: 0.25em; right: 0.25em; width: 44px; height: 44px; border-radius: 50%; border: 0; z-index: 4;
  background: rgba(10, 14, 30, .55); color: #fff; font-size: 1em; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.star[aria-pressed="true"] { color: var(--Y); }
body.show-focus .star[aria-pressed="false"] { display: none; }

/* ---------- Messages ---------- */
#msg { background: var(--panel); border-radius: 1em; padding: 1em; display: flex; gap: 0.8em; align-items: center; flex-wrap: wrap; }
#none { color: var(--dim); padding: 0.6em 0; }
footer { color: var(--dim); margin-top: auto; }

/* ---------- Detail bar (controller / keyboard) ---------- */
#detail {
  position: fixed; left: var(--sx); right: var(--sxr); bottom: var(--sy); z-index: 20; display: none; align-items: center; gap: 0.8em;
  padding: 0.55em 0.9em; min-height: 4.4em; border-radius: 1em; background: rgba(13, 18, 38, .95); border: 2px solid rgba(255, 255, 255, .1);
  box-shadow: 0 -0.3em 1.6em rgba(0, 0, 0, .55);
}
body.show-focus #detail { display: flex; }
.dic { flex: 0 0 2.8em; height: 2.8em; }
.dtext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.1em; }
.dname { font-weight: 800; font-size: 1.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dline { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.keys { display: flex; gap: 0.25em 0.9em; flex-wrap: wrap; justify-content: flex-end; max-width: 50%; }
.keys span { white-space: nowrap; }
.k { display: inline-flex; align-items: center; justify-content: center; min-width: 1.45em; height: 1.45em; padding: 0 0.3em; margin-right: 0.25em;
  border-radius: 999px; font-weight: 850; color: #0b0f1e; vertical-align: middle; }
.k.a { background: var(--A); } .k.b { background: var(--B); } .k.x { background: var(--X); } .k.y { background: var(--Y); }
.k.d, .k.lb { background: #cfd5f0; border-radius: 0.35em; }

/* ---------- Dialog ---------- */
#dlg { position: fixed; inset: 0; z-index: 40; background: rgba(5, 8, 20, .75); display: flex; align-items: center; justify-content: center; padding: var(--sy) var(--sx); }
.dbox { background: var(--panel); border-radius: 1.2em; padding: 1em 1.2em; width: min(100%, 22em); max-height: 100%; overflow: auto;
  display: flex; flex-direction: column; gap: 0.5em; box-shadow: 0 1em 3em rgba(0, 0, 0, .6); }
.dbox h2 { margin: 0 0 0.2em; font-size: 1.25em; }
.dbox .sep { height: 2px; background: rgba(255, 255, 255, .08); margin: 0.2em 0; }
.dbox .tb { width: 100%; justify-content: flex-start; min-height: 2.1em; }
#dlg.show-focus .tb.focused, body.show-focus #dlg .tb.focused { box-shadow: 0 0 0 0.17em var(--panel), 0 0 0 0.4em var(--focus); }

/* ---------- Narrow screens (iPad portrait) ---------- */
@media (max-aspect-ratio: 1/1) {
  :root { --tileW: 10.2em; --tileWide: 12.5em; }
  .hart { flex-basis: 4.8em; height: 4.8em; } .hart .ic { width: 4em; height: 4em; }
  .hname { font-size: 1.45em; }
}
</style>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
<div id="app">
  <header class="navrow" data-row="header">
    <div class="brand"><h1 id="title"></h1><span id="count"></span></div>
    <button class="tb nav" id="bSearch" type="button" data-key="bSearch">🔍<span class="lbl"></span></button>
    <button class="tb nav" id="bLang" type="button" data-key="bLang">🌐<span class="lbl"></span></button>
    <button class="tb nav" id="fs" type="button" data-key="fs">⛶<span class="lbl"></span></button>
    <span id="pads"></span>
  </header>

  <div id="sbar" class="navrow" data-row="search" hidden>
    <input id="q" class="nav" data-key="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="tb nav" id="bClose" type="button" data-key="bClose">✕<span class="lbl2"></span></button>
  </div>

  <section id="hero" class="navrow" data-row="hero" hidden>
    <div class="hbg" aria-hidden="true"></div>
    <div class="hart"><div class="ic"></div></div>
    <div class="hbody">
      <div class="kicker"></div>
      <h2 class="hname"></h2>
      <p class="hblurb"></p>
      <div class="hacts">
        <a id="cont" class="play nav" data-key="cont" href="#">▶ <span></span></a>
        <button id="hfav" class="tb nav" type="button" data-key="hfav"></button>
        <span class="ver" id="hver"><span></span><b></b></span>
      </div>
    </div>
  </section>

  <div id="msg" class="navrow" data-row="msg" hidden><span id="msgText"></span><button class="tb nav" id="retry" type="button" data-key="retry"></button></div>

  <main id="shelves"></main>
  <div id="none" hidden></div>
  <footer id="foot"></footer>
</div>

<div id="detail" aria-live="polite">
  <div class="dic ic"></div>
  <div class="dtext"><div class="dname"></div><div class="dline d1"></div><div class="dline d2"></div></div>
  <div class="keys"></div>
</div>

<div id="dlg" hidden role="dialog" aria-modal="true"><div class="dbox"></div></div>

<script>
(() => {
'use strict';

/* ============================== Config ============================== */
const HUB_ID = 'game-hub';
const K = {                                  // storage keys (all under game-hub/, backed up by family-cloud)
  settings: HUB_ID + '/settings',            // { lang, sound }
  last: HUB_ID + '/last',                    // { id, at }   (kept for older hub versions)
  recent: HUB_ID + '/recent',                // { v:1, list:[{id, at}] }
  favs: HUB_ID + '/favs',                    // { v:1, ids:[id] }
};
const SS_FOCUS = HUB_ID + '/focus';          // sessionStorage: tile to refocus after coming back from a game
const GAMES_URL = 'games.json';
const CFG = {
  deadZone: 0.15, navThreshold: 0.55,        // sticks
  repeatDelay: 360, repeatRate: 130,         // held direction
  recentMax: 12, recentShelfMin: 2,          // "recently played" shelf appears from 2 games
  smoothAfterMs: 220,                        // fast repeats scroll instantly (smooth scrolling lags on Xbox)
  volume: 0.06,
};
const GENRES = ['arcade', 'racing', 'adventure', 'puzzle', 'build', 'cozy', 'board'];
const UA = navigator.userAgent || '';
const IS_XBOX = /Xbox/i.test(UA);
const IS_DESKTOP = !IS_XBOX && !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
// Legacy Edge on Xbox only: turn its mouse cursor off so the controller drives the page directly (no-op elsewhere).
try { if ('gamepadInputEmulation' in navigator) navigator.gamepadInputEmulation = 'gamepad'; } catch (e) {}

/* ============================== Strings ============================== */
const LANGS = [['en', 'English'], ['fr', 'Français'], ['zh-Hans', '简体中文'], ['zh-Hant', '繁體中文']];
const STR = {
  'zh-Hans': {
    title: '🎮 游戏大厅', count: n => `${n} 个游戏`, search: '搜索', searchPh: n => `搜索 ${n} 个游戏：名字、作者…`, close: '关闭',
    fs: '全屏', exitfs: '退出全屏', fsFail: '全屏不可用', settings: '语言和设置', sound: s => s ? '🔊 按键声音：开' : '🔇 按键声音：关',
    kickCont: '▶ 上次玩的', kickPick: '⭐ 今日推荐', cont: '继续玩', play: '开始玩', fav: '☆ 收藏', faved: '★ 已收藏', latest: '最新',
    shRecent: '🕹️ 最近玩过', shFav: '⭐ 我的收藏', shFamily: '🏠 我们自己做的游戏', shPad: '🎮 用手柄玩', shKeyboard: '⌨️ 要用键盘鼠标',
    kbdNote: '在电脑上玩，iPad 和 Xbox 上玩不了', results: n => `🔍 找到 ${n} 个`, none: '没有找到。换个词试试？', gOther: '🎲 其他',
    community: '🌐 社区游戏', communityNote: '别人用 AI 做的开源游戏，在安全的沙盒里运行',
    genres: { board: '♟️ 棋牌', puzzle: '🧩 解谜', racing: '🏁 赛车与飞行', adventure: '🧭 冒险探索', build: '🏗️ 经营建造', arcade: '🕹️ 动作街机', cozy: '🌿 休闲放松' },
    inp: { touch: '👆 触屏', controller: '🎮 手柄', both: '👆🎮 触屏+手柄', keyboard: '⌨️ 键盘鼠标' },

/* ============================== Storage (never throws, tolerant) ============================== */
const store = {

function loadSettings() {

}

}
function detectLang() {
  const n = String(navigator.language || '').toLowerCase();
  if (n.startsWith('zh')) return /^zh-(tw|hk|mo|hant)/.test(n) ? 'zh-Hant' : 'zh-Hans';
  if (n.startsWith('fr')) return 'fr';

}
function recentList() {
  const r = store.get(K.recent);
  let list = r && Array.isArray(r.list) ? r.list.filter(x => x && typeof x.id === 'string').map(x => ({ id: x.id, at: +x.at || 0 })) : null;
  if (!list) { const l = store.get(K.last); list = l && typeof l.id === 'string' ? [{ id: l.id, at: +l.at || 0 }] : []; }  // migrate the old single "last" key
  const seen = new Set();
  return list.sort((a, b) => b.at - a.at).filter(x => !seen.has(x.id) && seen.add(x.id)).slice(0, CFG.recentMax);
}
function remember(id) {
  const at = Date.now();
  store.set(K.last, { id, at });
  store.set(K.recent, { v: 1, list: [{ id, at }, ...recentList().filter(x => x.id !== id)].slice(0, CFG.recentMax) });
}

  const f = store.get(K.favs);
  const ids = f && Array.isArray(f.ids) ? f.ids : Array.isArray(f) ? f : [];
  return [...new Set(ids.filter(x => typeof x === 'string'))];
}
function isFav(id) { return favIds().includes(id); }

  const ids = favIds(), on = !ids.includes(id);

/* ============================== Sound (only after the first tap / key) ============================== */
let actx = null, unlocked = false;

    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    const t = actx.currentTime, P = {
      move: [[660, 0, 0.035, 'triangle']], bump: [[150, 0, 0.06, 'sine']],
      ok: [[523, 0, 0.06, 'triangle'], [784, 0.05, 0.09, 'triangle']], back: [[440, 0, 0.05, 'triangle'], [330, 0.045, 0.07, 'triangle']],
      fav: [[784, 0, 0.05, 'sine'], [1175, 0.05, 0.1, 'sine']], unfav: [[587, 0, 0.05, 'sine'], [392, 0.05, 0.08, 'sine']],
    }[kind] || [];

      o.start(t + d); o.stop(t + d + len + 0.02);

}

/* ============================== Load games.json ============================== */
function cleanGame(g) {
  if (!g || typeof g !== 'object' || typeof g.id !== 'string' || typeof g.url !== 'string') return null;
  let url;
  try { url = new URL(g.url, location.href); } catch (e) { return null; }
  if (!/^https?:$/.test(url.protocol)) return null;
  const c = g.credit && typeof g.credit === 'object' ? g.credit : {};
  return {
    id: g.id, url: url.href, latest: String(g.latest || ''),
    category: g.category === 'community' ? 'community' : 'family',
    credit: { author: String(c.author || ''), made: String(c.made || '') },
    input: ['controller', 'both', 'keyboard'].includes(g.input) ? g.input : 'touch',
    ext: typeof g.external === 'string' || g.link === true,
    genre: typeof g.genre === 'string' ? g.genre : '',
    color: typeof g.color === 'string' && /^#[0-9a-f]{3,8}$/i.test(g.color) ? g.color : '#7783b5',
    name: g.name && typeof g.name === 'object' ? g.name : { en: g.id }, blurb: g.blurb && typeof g.blurb === 'object' ? g.blurb : {},
    icon: typeof g.icon === 'string' && /^<svg[\s>]/.test(g.icon.trim()) ? g.icon : '',
    art: (() => { try { const u = typeof g.art === 'string' && new URL(g.art, location.href); return u && /^https?:$/.test(u.protocol) ? u.href : ''; } catch (e) { return ''; } })(),
    logo: g.logo && typeof g.logo === 'object' && Array.isArray(g.logo.fill) && g.logo.fill.length ? {
      fill: g.logo.fill.slice(0, 3).map(String), stroke: String(g.logo.stroke || '#1a1030'), glow: String(g.logo.glow || 'transparent') } : null,
  };
}
async function loadGames() {
  S.status = 'loading'; render();
  try {
    const r = await fetch(GAMES_URL, { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const list = Array.isArray(d) ? d : (d && d.games);
    if (!Array.isArray(list)) throw new Error('bad format');
    const seen = new Set();
    S.games = list.map(cleanGame).filter(g => g && !seen.has(g.id) && seen.add(g.id));
    S.status = 'ok';
  } catch (e) {
    S.status = 'error';
  }
  render();
  const back = sess.get(SS_FOCUS); sess.del(SS_FOCUS);           // came back from a game: land on its tile
  const el = findKey(back);
  if (el && visible(el)) setFocus(el, true);
  else if (!focusEl || !document.body.contains(focusEl) || !visible(focusEl)) setFocus(defaultFocus(), false);
}

function findKey(key) {                                       // a tile by its key, or the same game on another shelf
  if (!key) return null;
  const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
  if (el && visible(el)) return el;
  const id = key.includes(':') ? key.slice(key.indexOf(':') + 1) : key;
  return [...document.querySelectorAll(`#shelves .tile[data-id="${CSS.escape(id)}"]`)].find(visible) || null;
}

/* ============================== Shelves (what goes where) ============================== */
const padish = () => IS_XBOX || S.padSeen;
function rankForDevice(list) {
  const good = padish() ? g => g.input === 'controller' || g.input === 'both' : g => g.input === 'touch' || g.input === 'both';
  return [...list].sort((a, b) => (good(b) ? 1 : 0) - (good(a) ? 1 : 0));   // stable: keeps games.json order within a group
}
const norm = t => String(t || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '');
function matches(g, q) {
  const hay = norm([...Object.values(g.name || {}), ...Object.values(g.blurb || {}), g.credit.author, g.credit.made, g.id,
    g.genre && STR[lang].genres[g.genre], tr('inp')[g.input]].join(' '));
  return q.split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function buildShelves() {
  const G = S.games || [], out = [];
  const q = norm(S.q).trim();
  if (S.searchOpen && q) { out.push({ id: 'results', title: tr('results', G.filter(g => matches(g, q)).length), items: rankForDevice(G.filter(g => matches(g, q))) }); return out; }
  const rec = recentList().map(x => byId(x.id)).filter(Boolean);
  if (rec.length >= CFG.recentShelfMin) out.push({ id: 'recent', title: tr('shRecent'), items: rec });
  const fav = favIds().map(byId).filter(Boolean);
  if (fav.length) out.push({ id: 'fav', title: tr('shFav'), items: fav });
  const fam = G.filter(g => g.category === 'family');
  if (fam.length) out.push({ id: 'family', title: tr('shFamily'), items: fam, wide: true });
  if (padish()) { const pad = G.filter(g => g.input === 'controller' || g.input === 'both'); if (pad.length) out.push({ id: 'pad', title: tr('shPad'), items: pad }); }
  const com = G.filter(g => g.category === 'community');
  if (com.length) out.push({ divider: true });
  for (const gen of GENRES) {
    const it = com.filter(g => g.input !== 'keyboard' && g.genre === gen);
    if (it.length) out.push({ id: 'g-' + gen, title: STR[lang].genres[gen] || gen, items: rankForDevice(it) });
  }
  const other = com.filter(g => g.input !== 'keyboard' && !GENRES.includes(g.genre));
  if (other.length) out.push({ id: 'g-other', title: tr('gOther'), items: rankForDevice(other) });
  const kb = com.filter(g => g.input === 'keyboard');
  if (kb.length) out.push({ id: 'kbd', title: tr('shKeyboard'), note: IS_DESKTOP ? '' : tr('kbdNote'), items: kb });
  return out;
}
function heroGame() {
  const r = recentList().map(x => byId(x.id)).find(Boolean);

  const fam = (S.games || []).filter(g => g.category === 'family');
  const pool = fam.length ? fam : (S.games || []);
  if (!pool.length) return null;

}

/* ---------- key art & title lettering (launch-style logos) ---------- */
// An icon can be on the page several times (hero, shelves, detail bar); ids are page-wide, so each copy gets its own.
let svgN = 0;
function uniqSvg(svg) {

}

  }
  if (e.target && e.target.id === 'q') {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); $('q').blur(); setMode('key'); act({ type: 'move', dir: KEYDIR[e.key], player: 'kbd', src: 'key' }); }
    else if (e.key === 'Enter') { e.preventDefault(); $('q').blur(); setMode('key'); const f = document.querySelector('#shelves .tile'); setFocus(f || $('q')); }
    else if (e.key === 'Escape') { e.preventDefault(); act({ type: 'back', player: 'kbd', src: 'key' }); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (KEYDIR[e.key]) { e.preventDefault(); act({ type: 'move', dir: KEYDIR[e.key], player: 'kbd', src: 'key' }); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act({ type: 'activate', player: 'kbd', src: 'key' }); }
  else if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GamepadB') { e.preventDefault(); act({ type: 'back', player: 'kbd', src: 'key' }); }
  else if (e.key === '/' ) { e.preventDefault(); setMode('key'); act({ type: 'search', player: 'kbd', src: 'key' }); }
  else if (e.key === 'f' || e.key === 'F') { if (S.mode === 'key') act({ type: 'fav', player: 'kbd', src: 'key' }); }
  else if (e.key === 'PageDown' || e.key === 'PageUp') { e.preventDefault(); act({ type: 'page', dir: e.key === 'PageDown' ? 1 : -1, player: 'kbd', src: 'key' }); }
});

/* ============================== Gamepad ============================== */
const padState = {};   // index -> { prev: bool[], dir, next }
function rumble(player, mag, ms) {
  if (typeof player !== 'number') return;
  try {
    const gp = navigator.getGamepads && navigator.getGamepads()[player];
    if (gp && gp.vibrationActuator) gp.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: mag, weakMagnitude: mag }).catch(() => {});
  } catch (e) {}
}
function padDir(gp, down) {
  if (down[12]) return 'up'; if (down[13]) return 'down'; if (down[14]) return 'left'; if (down[15]) return 'right';
  const x = gp.axes[0] || 0, y = gp.axes[1] || 0;
  if (Math.hypot(x, y) < CFG.deadZone) return null;
  if (Math.max(Math.abs(x), Math.abs(y)) < CFG.navThreshold) return null;
  return Math.abs(x) > Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
}
const BTN = { 0: 'activate', 1: 'back', 2: 'search', 3: 'fav', 4: 'pageL', 5: 'pageR', 9: 'menu' };
function pollPads(now) {
  let list = [];
  try { list = Array.from((navigator.getGamepads && navigator.getGamepads()) || []).filter(Boolean); } catch (e) {}
  if (list.length !== padCount) { padCount = list.length; renderPads(); }
  const live = new Set();
  for (const gp of list) {
    const i = gp.index; live.add(i);
    const down = gp.buttons.map(b => !!(b && (b.pressed || b.value > 0.5)));
    let st = padState[i];
    if (!st) st = padState[i] = { prev: down, dir: null, next: 0 };   // buttons already held at connect don't fire
    const dir = padDir(gp, down);
    const used = down.some(Boolean) || dir;
    if (used && !S.padSeen) { S.padSeen = true; sess.set(HUB_ID + '/pad', '1'); const k = focusEl && focusEl.dataset.key; render(); if (k) { const el = document.querySelector(`[data-key="${CSS.escape(k)}"]`); if (el) setFocus(el, false); } }
    if (dir !== st.dir) {
      st.dir = dir;
      if (dir) { act({ type: 'move', dir, player: i, src: 'pad' }); st.next = now + CFG.repeatDelay; }
    } else if (dir && now >= st.next) {
      act({ type: 'move', dir, player: i, src: 'pad' }); st.next = now + CFG.repeatRate;
    }
    for (const b in BTN) {
      if (down[b] && !st.prev[b]) {
        const t = BTN[b];
        if (t === 'pageL' || t === 'pageR') act({ type: 'page', dir: t === 'pageR' ? 1 : -1, player: i, src: 'pad' });
        else act({ type: t, player: i, src: 'pad' });
      }
    }
    st.prev = down;
  }
  for (const k of Object.keys(padState)) if (!live.has(+k)) delete padState[k];
}
window.addEventListener('gamepadconnected', () => { renderPads(); });
window.addEventListener('gamepaddisconnected', () => { renderPads(); });
function loop(now) { pollPads(now); requestAnimationFrame(loop); }

/* ============================== Start ============================== */
window.addEventListener('pageshow', e => { if (e.persisted && S.games) { render(); const el = findKey(sess.get(SS_FOCUS)); sess.del(SS_FOCUS); if (el) setFocus(el, true); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.games) render(); });
window.addEventListener('resize', () => document.querySelectorAll('.shelf').forEach(arrowState));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
render();
loadGames();
requestAnimationFrame(loop);
})();
</script>
