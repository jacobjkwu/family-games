<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Family Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#2c5a34;color:#1d3b25;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","PingFang TC","Microsoft YaHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
main{max-width:760px;margin:0 auto;padding:32px 18px}
h1{color:#fff8e1;font-size:34px;margin:0 0 20px}
a.card{display:flex;gap:16px;align-items:center;background:#f3e6bf;border:4px solid #1d3b25;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.3);padding:18px;color:inherit;text-decoration:none;min-height:96px}
a.card:active{transform:translateY(3px)}
a.card:focus{outline:6px solid #f59e0b;outline-offset:4px}
.icon{font-size:56px}.name{font-size:26px;font-weight:800}.blurb{font-size:17px;opacity:.85}
</style>
</head>
<body>
<main>
  <h1>🎮 Family Games</h1>
  <a class="card" href="drawrassic-park/"><span class="icon">🦖</span><span><span class="name">Drawrassic Park</span><br><span class="blurb">画恐龙 · 养恐龙 · 斗兽场 · ☁️ 自动云备份</span></span></a>
</main>
</body>
</html>
