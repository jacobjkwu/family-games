<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>巨蟹王城堡保卫战 3D</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#120a18;color:#fff;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
button{font:inherit;color:#fff;border:0;border-radius:12px;background:#3b2a52;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.94)}
button:disabled{opacity:.4}
#hud{display:flex;align-items:center;gap:7px;padding:6px 10px;background:linear-gradient(#2d1840,#1d0f2a);flex-wrap:wrap;font-size:clamp(13px,1.6vw,16px);border-bottom:2px solid #4a2f63;z-index:5}
.pill{background:#00000060;border-radius:20px;padding:5px 11px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
.hpbar{position:relative;width:clamp(70px,10vw,130px);height:13px;background:#000a;border-radius:7px;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff4d4d,#ff9a4d);transition:width .2s}
#shfill{position:absolute;left:0;top:0;height:40%;width:0;background:#8fd0ff}
.sp{flex:1}
.big{font-size:clamp(15px,1.8vw,18px);font-weight:800;padding:9px 15px}
#btnShop{background:linear-gradient(#ffb341,#ff7a1a);color:#3a1600;box-shadow:0 3px 0 #a64300}
#btnCheat{background:#5a3a7a}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(#1d0f2a,#2d1840);border-top:2px solid #4a2f63;flex-wrap:wrap;z-index:5}
#guns{display:flex;gap:5px;flex-wrap:wrap}
.gun{min-width:50px;height:52px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 6px;line-height:1.1}
.gun small{font-size:10px;opacity:.85}
.gun.on{background:#ffcf3d;color:#3a2200;box-shadow:0 0 0 3px #fff6}
#ults{display:flex;align-items:center;gap:6px;background:#0006;border-radius:14px;padding:4px 8px}
#energy{width:clamp(60px,8vw,110px);height:16px;border-radius:8px;background:#000;position:relative;overflow:hidden;border:1px solid #ffd84a66}
#energyFill{height:100%;width:0;background:linear-gradient(90deg,#ff7a1a,#ffd84a,#fff3a0);box-shadow:0 0 10px #ffd84a}
#energyTxt{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:800;line-height:16px;text-shadow:0 1px 2px #000}
.ult{width:50px;height:50px;font-size:24px;padding:0;position:relative;background:radial-gradient(#5a3a7a,#2a1a3a);border:2px solid #ffd84a55}
.ult.ready{border-color:#ffd84a;box-shadow:0 0 14px #ffd84a;animation:pulse 1s infinite}
.ult small{position:absolute;bottom:1px;left:0;right:0;font-size:9px;font-weight:800}
.ult.lock{filter:grayscale(1);opacity:.45}
@keyframes pulse{50%{box-shadow:0 0 22px #ffd84a}}
#btnWave{background:linear-gradient(#5be36b,#21a83a);color:#06300f;box-shadow:0 3px 0 #13702a}
#btnWave.hide{display:none}
#banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000c;border:2px solid #7cff8a;border-radius:14px;padding:7px 9px 7px 14px;display:none;align-items:center;gap:10px;font-size:15px;z-index:6;white-space:nowrap}
#banner button{background:#7cff8a;color:#063010;font-weight:800}
#popup{position:absolute;display:none;background:#1d1229f2;border:2px solid #ffcf3d;border-radius:14px;padding:10px;z-index:7;width:220px;font-size:13px}
#popup .row{display:flex;gap:8px;margin-top:8px}
#popup button{flex:1;font-weight:800}
#popup .up{background:#3d8bff}
#popup .sell{background:#c0392b}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal.show{display:flex}
.panel{background:linear-gradient(#3a2152,#1f1029);border:3px solid #ffcf3d;border-radius:22px;width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid #ffffff22}
.phead h2{margin:0;font-size:21px}
.tabs{display:flex;gap:5px;padding:8px 12px 0;flex-wrap:wrap}
.tab{font-size:15px;padding:9px 13px;border-radius:12px 12px 0 0;background:#ffffff14}
.tab.on{background:#ffcf3d;color:#3a2200;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{background:#ffffff12;border:2px solid #ffffff22;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:5px;text-align:left;color:#fff}
.card .ic{font-size:36px;line-height:1}
.card .nm{font-weight:800;font-size:16px}
.card .ds{font-size:12.5px;opacity:.82;flex:1;line-height:1.45}
.card .pr{font-weight:800;color:#ffcf3d;font-size:15px}
.card.no{opacity:.45}
.card.kill{border-color:#ff4d6d;background:#ff4d6d1f}
.card.owned{border-color:#7cff8a}
.card.cur{border-color:#ffd84a;box-shadow:0 0 16px #ffd84a66}
.card img{width:100%;border-radius:12px;background:radial-gradient(#4a2f63,#1a0d24)}
.tag{display:inline-block;background:#ff4d6d;color:#fff;border-radius:8px;padding:1px 6px;font-size:11px;margin-left:4px;vertical-align:middle}
.sec{grid-column:1/-1;font-weight:800;font-size:16px;margin-top:4px}
#toast{position:fixed;left:50%;top:21%;transform:translateX(-50%);font-size:clamp(24px,4.4vw,42px);font-weight:900;pointer-events:none;text-shadow:0 3px 0 #000,0 0 18px #000;z-index:15;opacity:0;transition:opacity .3s;white-space:nowrap;text-align:center}
#toast .sub{font-size:clamp(14px,2vw,19px);font-weight:700;color:#fff;margin-top:4px}
#combo{position:absolute;right:16px;top:30%;text-align:center;font-weight:900;font-size:22px;color:#ffd84a;text-shadow:0 3px 0 #000,0 0 14px #ff7a1a;pointer-events:none;opacity:0;z-index:4}
#combo b{font-size:52px;display:block;line-height:1}
#combo span{font-size:24px;color:#fff}
#combo.pop{animation:cpop 1.6s ease-out}
@keyframes cpop{0%{opacity:0;transform:scale(2.4) rotate(-8deg)}12%{opacity:1;transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#bossbars{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:min(560px,70%);z-index:4;pointer-events:none}
.bb{margin-bottom:6px;text-shadow:0 2px 0 #000}
.bb .n{font-weight:900;font-size:15px;display:flex;justify-content:space-between}
.bb .t{height:14px;border-radius:7px;background:#000b;border:2px solid #ffd84a;overflow:hidden}
.bb .f{height:100%;background:linear-gradient(90deg,#ff2d55,#ff9a4d);transition:width .15s}
#dialog{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:10px;background:#000c;border:2px solid #ffd84a;border-radius:16px;padding:8px 14px 8px 8px;z-index:5;max-width:min(560px,80%);opacity:0;transform:translateY(20px);transition:all .25s;pointer-events:none}
#dialog.show{opacity:1;transform:none}
#dialog .pt{font-size:40px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:radial-gradient(#ffd84a55,transparent);border-radius:50%}
#dialog .nm{font-weight:900;color:#ffd84a;font-size:14px}
#dialog .dtx{font-size:16px;font-weight:700}
#bossIntro{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(transparent 30%,#000c)}
#bossIntro.show{display:flex}
#bossIntro .stripe{position:absolute;left:0;right:0;height:46px;background:repeating-linear-gradient(-45deg,#ffcf3d 0 24px,#111 24px 48px);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:stripe 1s linear infinite}
#bossIntro .stripe span{background:#111;color:#ff2d55;font-weight:900;font-size:26px;padding:0 20px;letter-spacing:6px}
#bossIntro .s1{top:12%}#bossIntro .s2{bottom:12%;animation-direction:reverse}
@keyframes stripe{to{background-position:68px 0}}
#bossIntro .card2{text-align:center;animation:bin .6s cubic-bezier(.2,1.6,.4,1)}
#bossIntro .face{font-size:min(28vw,190px);line-height:1;filter:drop-shadow(0 0 30px var(--c));animation:shake .15s infinite}
#bossIntro .nm{font-size:clamp(32px,6vw,60px);font-weight:900;text-shadow:0 4px 0 #000,0 0 30px var(--c)}
#bossIntro .st{font-size:30px;color:#ffd84a;text-shadow:0 2px 0 #000}
#bossIntro .ln{font-size:clamp(16px,2.6vw,24px);font-weight:800;margin-top:8px;text-shadow:0 2px 0 #000}
#bossIntro .tip{font-size:15px;opacity:.9;margin-top:6px;text-shadow:0 2px 0 #000}
@keyframes bin{0%{transform:scale(3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%{transform:translate(2px,1px)}50%{transform:translate(-2px,-1px)}100%{transform:translate(1px,-2px)}}
#fxo{position:absolute;inset:0;pointer-events:none;z-index:3}
#white{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
#hurt{position:absolute;inset:0;background:radial-gradient(transparent 50%,#ff000099);opacity:0;pointer-events:none;z-index:3}
#ink{position:absolute;inset:0;pointer-events:none;z-index:3}
#ink div{position:absolute;border-radius:50%;background:radial-gradient(#0a0010 55%,#1a0020cc 70%,transparent 72%)}
#txts{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.tx{position:absolute;left:0;top:0;font-weight:900;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 6px #000,1px 1px 0 #000,-1px -1px 0 #000;font-size:14px;will-change:transform}
.tx.big{font-size:20px}
#over{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(#3a1d50dd,#0b0510f2);padding:14px;overflow-y:auto}
#over .box{max-width:900px;width:100%;text-align:center}
#over h1{font-size:clamp(30px,5.5vw,56px);margin:4px 0;text-shadow:0 4px 0 #000,0 0 30px #ff7a1a;background:linear-gradient(#fff3a0,#ffb341);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000)}
#over p{font-size:16px;line-height:1.6;opacity:.92;margin:6px 0}
#over .crab{font-size:clamp(60px,11vw,110px);animation:bob 1.2s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.mapc{background:#ffffff14;border:3px solid #ffffff22;border-radius:18px;padding:12px;text-align:left}
.mapc.on{border-color:#ffd84a;box-shadow:0 0 20px #ffd84a66;background:#ffd84a1a}
.mapc .ic{font-size:40px}
.mapc .nm{font-size:19px;font-weight:900}
.mapc .df{color:#ffd84a}
.mapc .ds{font-size:13px;opacity:.85;margin-top:4px}
.go{font-size:24px;font-weight:900;padding:14px 38px;background:linear-gradient(#ffb341,#ff7a1a);color:#3a1600;box-shadow:0 4px 0 #a64300;margin:6px}
.ghost{background:#ffffff1a}
.thu{display:inline-block;background:#ff7a1a;color:#fff;padding:4px 12px;border-radius:10px;font-weight:900;margin-bottom:6px;animation:pulse 1s infinite}
.menu{display:flex;flex-direction:column;gap:8px;padding:14px;min-width:280px}
.menu button{font-size:18px;padding:12px;font-weight:700}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.row2 button{flex:1}
.row2 button.on{background:#ffcf3d;color:#3a2200}
.cbody{padding:14px;display:flex;flex-direction:column;gap:10px}
.cbody input{flex:1;min-width:0;font-size:20px;padding:10px 12px;border-radius:12px;border:2px solid #ffcf3d;background:#120a18;color:#fff;-webkit-user-select:text;user-select:text}
.qrow{display:flex;flex-wrap:wrap;gap:8px}
.qrow button{flex:1;min-width:84px;font-size:17px;font-weight:800;padding:11px 8px;background:#ffcf3d;color:#3a2200}
.achl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:12px;overflow-y:auto}
.ach{background:#ffffff10;border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;opacity:.45}
.ach.got{opacity:1;border:2px solid #ffd84a}
.ach .i{font-size:30px}
#verBadge{position:absolute;left:6px;bottom:4px;font-size:11px;opacity:.55;z-index:4;pointer-events:none;background:#0006;border-radius:6px;padding:1px 5px}
#fps{position:absolute;right:6px;bottom:4px;font-size:11px;opacity:.6;z-index:4;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="pill">💰 <b id="gold">0</b></div>
    <div class="pill">🦀 <div class="hpbar"><div id="hpfill"></div><div id="shfill"></div></div><b id="hptxt"></b></div>
    <div class="pill">🌊 <b id="wave">1</b></div>
    <div class="pill">👥 <b id="left">100</b></div>
    <div class="sp"></div>
    <button id="btnSpeed">⏩ x1</button>
    <button id="btnMenu">☰</button>
    <button id="btnCheat">🔑</button>
    <button id="btnShop" class="big">🛒 超市</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ink"></div><div id="hurt"></div><div id="white"></div>
    <div id="txts"></div>
    <div id="bossbars"></div>
    <div id="combo"></div>
    <div id="dialog"><div class="pt"></div><div><div class="nm"></div><div class="dtx"></div></div></div>
    <div id="banner"><span id="bannerTxt"></span><button id="bannerDone">完成</button></div>
    <div id="popup"></div>
    <div id="fps"></div>
    <div id="verBadge"></div>
  </div>
  <div id="bar">
    <div id="guns"></div>
    <div id="ults"><div id="energy"><div id="energyFill"></div><div id="energyTxt">0</div></div><div id="ultBtns" style="display:flex;gap:5px"></div></div>
    <div class="sp"></div>
    <button id="btnWave" class="big">⚔️ 开始第 1 波</button>
  </div>
</div>

<div id="shop" class="modal"><div class="panel">
  <div class="phead"><h2>🛒 蟹蟹超市</h2><div class="pill">💰 <b id="shopGold">0</b></div><div class="sp"></div><button id="shopClose" class="big">✕ 关闭</button></div>
  <div class="tabs" id="tabs"></div><div class="grid" id="grid"></div>
</div></div>

<div id="cheat" class="modal"><div class="panel" style="width:min(500px,100%)">
  <div class="phead"><h2>🔑 秘籍</h2><div class="sp"></div><button id="cheatClose" class="big">✕ 关闭</button></div>
  <div class="cbody">
    <div style="font-size:16px">现在的金币：💰 <b id="cheatNow">0</b></div>
    <div style="display:flex;gap:8px"><input id="cheatInput" type="text" inputmode="text" placeholder="输入金币数，或者输入暗号…"><button id="cheatSet" class="big" style="background:#5be36b;color:#06300f">确定</button></div>
    <div class="qrow"><button data-add="1000">+1000</button><button data-add="10000">+1万</button><button data-add="100000">+10万</button><button data-set="9999999">💰 最多</button><button data-set="0">清零</button></div>
    <div style="font-size:13px;opacity:.7">🤫 听说还有一些神秘暗号……试试 666？</div>
  </div>
</div></div>

<div id="menu" class="modal"><div class="panel" style="width:min(460px,100%)">
  <div class="phead"><h2>☰ 菜单</h2><div class="sp"></div><button id="menuClose" class="big">▶ 继续</button></div>
  <div class="menu">
    <div>🎨 画质</div><div class="row2" id="qBtns"><button data-q="auto">自动</button><button data-q="high">高</button><button data-q="mid">中</button><button data-q="low">低</button></div>
    <div class="row2"><button id="btnSfx">🔊 音效：开</button><button id="btnMusic">🎵 音乐：开</button></div>
    <div class="row2"><button id="btnFps">📈 显示帧率</button><button id="btnAch">🏆 成就</button></div>
    <div>🧪 压力测试（生成敌人，自动开无敌和帧率）</div><div class="row2" id="stressBtns"><button data-n="100">+100</button><button data-n="500">+500</button><button data-n="1000">+1000</button></div>
    <button id="btnRestart">🔄 重新开始</button>
    <button id="btnHome">🏠 回到主菜单</button>
    <button id="btnSwitch">🔀 切换版本</button>
  </div>
</div></div>

<div id="achM" class="modal"><div class="panel" style="width:min(760px,100%)">
  <div class="phead"><h2>🏆 成就</h2><div class="sp"></div><button id="achClose" class="big">✕ 关闭</button></div>
  <div class="achl" id="achList"></div>
</div></div>

<div id="bossIntro"><div class="stripe s1"><span>⚠ WARNING ⚠ BOSS 来袭 ⚠</span></div><div class="stripe s2"><span>⚠ WARNING ⚠ BOSS 来袭 ⚠</span></div><div class="card2"></div></div>
<div id="toast"></div>
<div id="over"><div class="box" id="overBox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';
// ======================= 工具 =======================
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const key = (c, r) => c + ',' + r;
const GAME_VERSION = 6;
const COLS = 16, ROWS = 9, HG = .34; // 高台高度
const IS_THURSDAY = new Date().getDay() === 4;

// ======================= 地图 =======================
const MAPS = [
  {id:'beach', name:'海滨城堡', ic:'🏖️', diff:1, hpMul:1, gold:320,
   desc:'阳光沙滩上的城堡，海浪声声。适合新手。',
   wp:[[-1,1],[3,1],[3,6],[7,6],[7,2],[11,2],[11,7],[14,7],[14,4],[15,4]],
   bosses:{3:[['pirate',1]],5:[['dragon',1]],7:[['octopus',2]],9:[['golem',2]],10:[['tycoon',3]]},
   weather:'none', ground:'sand', far:'sea'},
  {id:'lava', name:'熔岩要塞', ic:'🌋', diff:2, hpMul:1.25, gold:340,
   desc:'建在火山口的要塞，岩浆翻滚。敌人更强。',
   wp:[[-1,4],[2,4],[2,1],[6,1],[6,7],[9,7],[9,2],[12,2],[12,6],[14,6],[14,4],[15,4]],
   bosses:{3:[['golem',1]],5:[['dragon',1]],7:[['lich',2]],9:[['ufo',2]],10:[['tycoon',3]]},
   weather:'embers', ground:'lava', far:'volcano'},
  {id:'ice', name:'冰雪王宫', ic:'❄️', diff:3, hpMul:1.5, gold:380,
   desc:'超长的冰雪之路，最终有双 Boss 等着你！',
   wp:[[-1,7],[3,7],[3,3],[1,3],[1,1],[5,1],[5,5],[8,5],[8,1],[11,1],[11,7],[13,7],[13,3],[15,3]],
   bosses:{3:[['ufo',1]],5:[['lich',1]],7:[['golem',2]],9:[['dragon',2]],10:[['tycoon',3],['octopus',2]]},
   weather:'snow', ground:'snow', far:'mountain'},
];
const STAGES = [
  {name:'☀️ 白天',     sun:0xfff3dd, sunI:2.4, amb:0xbfd8ff, ambI:.9,  sky:[0x6fb8ff,0xcfeaff], fog:0xcfe4f5, torch:0},
  {name:'🌇 黄昏',     sun:0xffa060, sunI:1.7, amb:0xb08aa0, ambI:.7,  sky:[0x5b3a7a,0xff9a5a], fog:0xd99a7a, torch:.7},
  {name:'🌙 深夜',     sun:0x8fa8ff, sunI:.45, amb:0x3a4a80, ambI:.45, sky:[0x05081a,0x1b2550], fog:0x141c38, torch:1.4},
  {name:'🔥 最终决战', sun:0xff6a4a, sunI:1.0, amb:0x80303a, ambI:.55, sky:[0x1a0005,0x7a1010], fog:0x4a1010, torch:1.2},
];
const WAVE_SIZES = [5,6,7,8,9,10,11,12,14,18];
const TOTAL = 100;

function stageLerp(dt, idx, bossDark) {

  C.sun.lerp(_c.setHex(st.sun), k); C.amb.lerp(_c.setHex(st.amb), k); C.s0.lerp(_c.setHex(st.sky[0]), k); C.s1.lerp(_c.setHex(st.sky[1]), k); C.fog.lerp(_c.setHex(st.fog), k);
  C.sunI += (st.sunI * (bossDark ? .7 : 1) - C.sunI)*k; C.ambI += (st.ambI * (bossDark ? .8 : 1) - C.ambI)*k; C.torch += (st.torch - C.torch)*k;
  G.sun.color.copy(C.sun); G.sun.intensity = C.sunI; G.hemi.color.copy(C.amb); G.hemi.intensity = C.ambI;
  G.skyMat.uniforms.top.value.copy(C.s0); G.skyMat.uniforms.bot.value.copy(C.s1); G.scene.fog.color.copy(C.fog);

}

// ======================= 3D 模型 =======================
const GEO = {};
function geo(name, fn) { if (!GEO[name]) { GEO[name] = fn(); GEO[name].userData.keep = true; } return GEO[name]; }
const sphere = (r, w, h) => geo('sph' + r + w + h, () => new THREE.SphereGeometry(r, w || 16, h || 12));
const cyl = (a, b, h, s) => geo('cyl' + a + b + h + s, () => new THREE.CylinderGeometry(a, b, h, s || 10));
const box = (x, y, z) => geo('box' + x + y + z, () => new THREE.BoxGeometry(x, y, z));
const cone = (r, h, s) => geo('cone' + r + h + s, () => new THREE.ConeGeometry(r, h, s || 10));
const torus = (r, t, a) => geo('tor' + r + t + (a || 0), () => new THREE.TorusGeometry(r, t, 8, 28, a || Math.PI*2));
const octa = r => geo('oct' + r, () => new THREE.OctahedronGeometry(r));
function emis(col, i) { return mat('emis' + col + i, {color:col, emissive:col, emissiveIntensity:i || 1.5, roughness:.3, toneMapped:false}); }
const add = (p, geo, m, x, y, z, cast) => { const o = mesh(geo, m, x, y, z, cast); p.add(o); return o; };

// ---------- 合并静态零件，减少绘制次数（性能关键） ----------
function concatGeos(geos) {
  let n = 0; for (const g of geos) n += g.attributes.position.count;
  const pos = new Float32Array(n*3), nor = new Float32Array(n*3), uv = new Float32Array(n*2); let o = 0;
  for (const g of geos) { const c = g.attributes.position.count; pos.set(g.attributes.position.array, o*3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array, o*3); if (g.attributes.uv) uv.set(g.attributes.uv.array, o*2); o += c; g.dispose(); }
  const r = new THREE.BufferGeometry(); r.setAttribute('position', new THREE.BufferAttribute(pos, 3)); r.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); r.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  r.computeBoundingSphere(); r.userData.merged = true; return r;
}
function mergeMeshes(root, skip) {
  skip = new Set((skip || []).filter(Boolean));
  for (const v of Object.values(root.userData)) if (v && v.isObject3D) skip.add(v);
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert(), buckets = new Map(), rm = [];
  root.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh || o === root || Array.isArray(o.material)) return;
    for (let p = o; p && p !== root; p = p.parent) if (skip.has(p) || p.userData.noMerge) return;
    const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone()); g.applyMatrix4(m);
    if (m.determinant() < 0) { const a = g.attributes.position.array; for (let i = 0; i < a.length; i += 9) for (let k = 0; k < 3; k++) { const t = a[i+3+k]; a[i+3+k] = a[i+6+k]; a[i+6+k] = t; } }
    const k = o.material.uuid + (o.castShadow ? 'c' : '') + (o.receiveShadow ? 'r' : '');
    if (!buckets.has(k)) buckets.set(k, {mat:o.material, cast:o.castShadow, recv:o.receiveShadow, geos:[]});
    buckets.get(k).geos.push(g); rm.push(o);
  });
  for (const o of rm) o.parent.remove(o);
  for (const b of buckets.values()) { const me = new THREE.Mesh(concatGeos(b.geos), b.mat); me.castShadow = b.cast; me.receiveShadow = b.recv; me.matrixAutoUpdate = false; root.add(me); }
  return root;
}
function disposeMerged(root) { root.traverse(o => { if (o.geometry && o.geometry.userData.merged) o.geometry.dispose(); }); }

// ---------- 螃蟹大王（5 个等级，越来越炫） ----------
function makeKing(lvl) {

  $('grid').innerHTML = Object.entries(src).map(([k, d]) => {
    let price = `💰 ${d.cost}`, cls = '';
    if (shopTab === 'gun' && S.owned[k]) { price = S.gun === k ? '✅ 正在使用' : '👆 点击装备'; cls = 'owned'; } else if (S.gold < d.cost) cls = 'no';
    if (d.kill) cls += ' kill';
    let extra = '';
    if (shopTab === 'guard') extra = `<br>${d.dmg ? '伤害 ' + d.dmg : '辅助'}${d.range ? ' · 射程 ' + d.range : ''}${d.air ? ' · ✈️对空' : ''}${d.heavy ? ' · 🛡️重型' : ''}${d.fly ? ' · 🛩️空军' : ''}${d.mobile ? ' · 🚶会移动' : ''}`;
    if (shopTab === 'trap' && d.cd) extra = `<br>冷却 ${d.cd} 秒`;
    if (k === 'kfc' && IS_THURSDAY) extra = '<br><b style="color:#ffb347">今天真的是星期四！</b>';
    return `<button class="card ${cls}" data-k="${k}"><div class="ic">${d.ic}</div><div class="nm">${d.name}${d.kill ? '<span class="tag">秒杀</span>' : ''}${d.money ? '<span class="tag" style="background:#d4a017">赚钱</span>' : ''}</div><div class="ds">${d.desc}${extra}</div><div class="pr">${price}</div></button>`;
  }).join('');
}
function renderKingTab() {
  if (!kingPics) kingPics = renderKingPics();
  $('grid').innerHTML = `<div class="sec">👑 螃蟹大王进化（升级后外形、血量、伤害全面提升，还会解锁新大招）</div>` + KING_LV.slice(1).map((L, i) => {
    const lv = i + 1, cur = S.klvl === lv, got = S.klvl >= lv, next = S.klvl + 1 === lv;
    return `<button class="card ${cur ? 'cur' : ''} ${!got && !next ? 'no' : ''}" data-king="${lv}"><img src="${kingPics[i]}"><div class="nm">Lv${lv} ${L.name}</div>
      <div class="ds">❤️ ${L.hp} · ⚔️ x${L.dmg}<br>${L.desc}</div><div class="pr">${cur ? '✅ 当前' : got ? '已拥有' : next ? `⬆ 进化 💰${L.cost}` : '🔒 先升前一级'}</div></button>`;
  }).join('') + `<div class="sec">⚡ 大招（底部按钮释放，消耗能量）</div>` + ULTS.map(u => `<div class="card ${S.klvl >= u.lvl ? 'owned' : 'no'}"><div class="ic">${u.ic}</div><div class="nm">${u.name}</div><div class="ds">${u.desc}<br>大王 Lv${u.lvl} 解锁</div><div class="pr">⚡ ${u.cost}</div></div>`).join('');
}
function renderKingPics() {
  const pics = [];
  try {
    const r = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true}); r.setSize(220, 170); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
    const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff, 0x664444, 1.4)); const dl = new THREE.DirectionalLight(0xffffff, 2.5); dl.position.set(2, 4, 3); sc.add(dl);
    try { sc.environment = G.scene.environment; } catch (e) {}
    const cam = new THREE.PerspectiveCamera(32, 220/170, .1, 50); cam.position.set(0, 1.5, 3.4); cam.lookAt(0, .55, 0);
    for (let l = 1; l <= 5; l++) { const K = makeKing(l); setKingGun(K, l >= 5 ? 'golden' : l >= 4 ? 'beam' : l >= 3 ? 'rocket' : l >= 2 ? 'smg' : 'pistol'); animKing(K, 1, .016, -Math.PI*.8, false, 0); K.group.rotation.y = -.35; sc.add(K.group);
      r.render(sc, cam); pics.push(r.domElement.toDataURL()); sc.remove(K.group); }
    r.dispose(); r.forceContextLoss();
  } catch (e) { for (let i = 0; i < 5; i++) pics.push(''); }
  return pics;
}
function renderBook() {
  const lv = LV.slice(1).map((L, i) => `<div class="card" style="border-color:${L.col}"><div class="nm" style="color:${L.col}">Lv${i + 1} ${L.name} ${L.gear.join('')}</div><div class="ds">${L.desc}</div></div>`).join('');
  const en = Object.entries(ENEMY).map(([k, d]) => { const s = S.seen[k]; return `<div class="card" style="${s ? '' : 'opacity:.5'}"><div class="ic">${s ? d.e + (d.ride || '') : '❓'}</div><div class="nm">${s ? d.name : '？？？'}</div><div class="ds">${s ? d.tip : '还没遇到过'}${d.from < 99 ? `<br><span style="opacity:.7">第 ${d.from} 波起</span>` : ''}</div><div class="pr">❤️ ${d.hp} · 💰 ${d.gold}</div></div>`; }).join('');
  const bs = Object.entries(BOSS).map(([k, d]) => { const s = S.seen['boss_' + k]; return `<div class="card kill" style="${s ? '' : 'opacity:.5'}"><div class="ic">${s ? d.e : '❓'}</div><div class="nm">${s ? d.name : '？？？'}<span class="tag">BOSS</span></div><div class="ds">${s ? `技能「${d.skill}」：${d.tip}<br>「${d.line}」` : '还没遇到过'}</div><div class="pr">❤️ ${d.hp}+</div></div>`; }).join('');
  $('grid').innerHTML = `<div class="sec">⚔️ 装备等级（头顶有等级牌，越高越难打、钱越多）</div>${lv}<div class="sec">😈 Boss（${Object.keys(BOSS).length} 种，分星级）</div>${bs}<div class="sec">👥 入侵者（${Object.keys(ENEMY).length} 种）</div>${en}`;
}
$('tabs').addEventListener('click', ev => { const b = ev.target.closest('[data-t]'); if (b) { shopTab = b.dataset.t; renderShop(); } });
$('grid').addEventListener('click', ev => {
  const kb = ev.target.closest('[data-king]'); if (kb) { if (+kb.dataset.king === S.klvl + 1) { upgradeKing(); renderShop(); } return; }
  const b = ev.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k;
  if (shopTab === 'gun') { if (S.owned[k]) { S.gun = k; renderGuns(); renderShop(); return; } if (S.gold < GUNS[k].cost) return toast('💰 金币不够了！', '#ff6b6b');
    S.gold -= GUNS[k].cost; S.owned[k] = true; S.gun = k; sfx('buy'); renderGuns(); renderShop(); toast(`获得 ${GUNS[k].ic} ${GUNS[k].name}！`, '#ffd84a'); return; }
  if (shopTab === 'item') { const d = ITEMS[k]; if (S.gold < d.cost) return toast('💰 金币不够了！', '#ff6b6b'); S.gold -= d.cost; closeShop(); useItem(k); return; }
  const d = (shopTab === 'trap' ? TRAPS : GUARDS)[k]; if (S.gold < d.cost) return toast('💰 金币不够了！', '#ff6b6b');
  closeShop(); startPlacing(shopTab === 'trap' ? 'trap' : 'guard', k);
});
$('btnShop').onclick = openShop; $('shopClose').onclick = closeShop;
$('shop').addEventListener('click', ev => { if (ev.target.id === 'shop') closeShop(); });

// ======================= 秘籍 / 菜单 / 成就 =======================
let cheatOpen = false, menuOpen = false;
function openCheat() { if (!S || !S.started || S.over) return; closePopup(); stopPlacing(); S.firing = false; cheatOpen = true; $('cheatNow').textContent = S.gold; $('cheatInput').value = ''; $('cheat').classList.add('show'); }
function closeCheat() { cheatOpen = false; $('cheat').classList.remove('show'); $('cheatInput').blur(); }
function cheatGold(v) { v = clamp(Math.floor(v), 0, 9999999); if (!isFinite(v)) return; S.gold = v; $('cheatNow').textContent = v; ach('cheat'); sfx('buy'); }
$('btnCheat').onclick = openCheat; $('cheatClose').onclick = closeCheat;
$('cheat').addEventListener('click', ev => { if (ev.target.id === 'cheat') return closeCheat(); const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.add) cheatGold(S.gold + Number(b.dataset.add)); else if (b.dataset.set !== undefined) cheatGold(Number(b.dataset.set)); });
$('cheatSet').onclick = () => { const raw = $('cheatInput').value.trim(); if (!raw) return toast('请先输入数字或暗号', '#ff6b6b');
  if (/^\d+$/.test(raw)) { if (applyCode(raw)) { closeCheat(); return; } cheatGold(Number(raw)); toast(`💰 金币改成 ${S.gold} 了！`, '#ffd84a'); closeCheat(); return; }
  if (applyCode(raw)) closeCheat(); else toast('🤔 这个暗号没有反应…', '#aaa'); };
$('cheatInput').addEventListener('keydown', ev => { if (ev.key === 'Enter') $('cheatSet').click(); });
function openMenu() { if (!S || !S.started) return; menuOpen = true; S.firing = false; $('menu').classList.add('show'); syncMenu(); }
function closeMenu() { menuOpen = false; $('menu').classList.remove('show'); }
function syncMenu() {
  document.querySelectorAll('#qBtns button').forEach(b => b.classList.toggle('on', b.dataset.q === QUALITY.mode));
  $('btnSfx').textContent = `🔊 音效：${sfxOn ? '开' : '关'}`; $('btnMusic').textContent = `🎵 音乐：${Music.on ? '开' : '关'}`;
}
$('btnMenu').onclick = openMenu; $('menuClose').onclick = closeMenu;
$('qBtns').addEventListener('click', ev => { const b = ev.target.closest('[data-q]'); if (!b) return; QUALITY.mode = b.dataset.q; SAVE.q = QUALITY.mode; save(); applyQuality(); syncMenu(); });
$('btnSfx').onclick = () => { sfxOn = !sfxOn; SAVE.sfx = sfxOn; save(); syncMenu(); };
$('btnMusic').onclick = () => { Music.on = !Music.on; SAVE.music = Music.on; save(); syncMenu(); };
$('btnFps').onclick = () => { const f = $('fps'); f.style.display = f.style.display === 'block' ? 'none' : 'block'; };
$('btnAch').onclick = () => { $('achList').innerHTML = Object.entries(ACH).map(([k, a]) => `<div class="ach ${SAVE.ach[k] ? 'got' : ''}"><div class="i">${SAVE.ach[k] ? a[0] : '🔒'}</div><div><b>${a[1]}</b><div style="font-size:12px;opacity:.8">${a[2]}</div></div></div>`).join(''); $('achM').classList.add('show'); };
$('achClose').onclick = () => $('achM').classList.remove('show');
$('btnRestart').onclick = () => { closeMenu(); startGame(S.mi); };
$('stressBtns').addEventListener('click', ev => { const b = ev.target.closest('[data-n]'); if (!b || !S) return; const n = +b.dataset.n; closeMenu();
  const ks = Object.keys(ENEMY).filter(k => ENEMY[k].from < 99); for (let i = 0; i < n; i++) { const e = spawn(pick(ks), {lvl:1 + Math.floor(Math.random()*5), child:true}); e.d = Math.random()*PATH_LEN*.85; }
  S.waveActive = true; S.invincible = true; $('fps').style.display = 'block'; toast(`🧪 压力测试：${n} 个敌人（已开无敌）`, '#9fe7ff'); });
$('btnHome').onclick = () => { closeMenu(); showTitle(); };
$('btnSwitch').onclick = () => { save(); try { localStorage.setItem(`${GAME_ID}/launcher/last`, String(GAME_VERSION)); } catch (e) {} location.href = 'index.html'; };
$('verBadge').textContent = 'v' + GAME_VERSION;
try { localStorage.setItem(`${GAME_ID}/launcher/last`, String(GAME_VERSION)); } catch (e) {}
$('btnSpeed').onclick = () => { if (!S) return; S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1; $('btnSpeed').textContent = '⏩ x' + S.speed; };
$('btnWave').onclick = () => { initAudio(); startWave(); };
document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.started && !S.over) openMenu(); });

// ======================= 标题 / 结束 =======================
let selMap = SAVE.map || 0;
function showTitle() {
  clearDyn(); clearTexts(); newGame(selMap); buildWorld(); S.started = false;
  const o = $('over'); o.style.display = 'flex';
  $('overBox').innerHTML = `${IS_THURSDAY ? '<div class="thu">🍗 今天是疯狂星期四！击杀有几率掉鸡腿，超市还有特价全家桶！</div><br>' : ''}
    <div class="crab">🦀</div><h1>巨蟹王城堡保卫战 3D</h1>
    <p>巨蟹大王刮彩票中了一座城堡 🏰，还在地下室挖出了传说中的<b>「万年蟹黄」</b>！<br>消息一传开，<b>100 名玩家</b>组团来抢……守住王座，让他们横着进来、竖着出去！</p>
    <div class="maps">${MAPS.map((m, i) => `<button class="mapc ${i === selMap ? 'on' : ''}" data-m="${i}"><div class="ic">${m.ic}</div><div class="nm">${m.name}</div><div class="df">难度 ${'★'.repeat(m.diff)}${'☆'.repeat(3 - m.diff)}</div><div class="ds">${m.desc}</div></button>`).join('')}</div>
    <p style="font-size:14px;opacity:.8">👆 按住战场开枪 · 🛒 买陷阱/兵种/枪/道具 · 👑 升级大王 · ⚡ 攒能量放大招 · 👉 戳戳大王有惊喜</p>
    <button class="go" id="btnStart">⚔️ 开始守城！</button><button class="go ghost" id="btnAch2">🏆 成就 ${Object.keys(SAVE.ach).length}/${Object.keys(ACH).length}</button>`;
  o.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { selMap = +b.dataset.m; SAVE.map = selMap; save(); showTitle(); });
  $('btnStart').onclick = () => { initAudio(); startGame(selMap); };
  $('btnAch2').onclick = () => $('btnAch').onclick();
  hudCache = {}; updateHud();
}
function startGame(mi) {
  clearDyn(); clearTexts(); PT.n = 0; newGame(mi); buildWorld(); S.started = true;
  $('over').style.display = 'none'; renderGuns(); renderUlts(); hudCache = {}; updateHud(); $('btnSpeed').textContent = '⏩ x1';
  setTimeout(() => dialog('🦀', '巨蟹大王', `欢迎来到${MAP.name}！谁敢来抢本王的蟹黄，统统夹走！`), 400);
  Music.setIntense(0);
}
function endGame(win) {
  S.over = true; S.firing = false; stopPlacing(); closePopup(); closeShop(); closeCheat();
  if (win) { ach('win'); if (S.hp >= S.maxHp) ach('perfect'); }
  const o = $('over'); o.style.display = 'flex';
  $('overBox').innerHTML = `<div class="crab">${win ? '🦀👑' : '🦀💫'}</div><h1>${win ? '城堡守住了！' : '王座被抢走了…'}</h1>
    <p>${win ? `100 名入侵玩家全部被打跑！万年蟹黄保住了！<br>巨蟹大王：「本王就说嘛，谁也别想横着走进来！」` : `入侵者攻到了第 ${S.wave} 波，大王被扛走了……<br>巨蟹大王：「本王还会回来的！」`}</p>
    <p>⚔️ 击败 <b>${S.killed}</b> · 😈 漏过 <b>${S.leaked}</b> · 🔥 最高连杀 <b>${S.best}</b> · 😈 Boss <b>${S.stats.bosses}</b><br>💰 一共赚了 <b>${S.earned}</b> · 👑 大王 Lv<b>${S.klvl}</b></p>
    ${win ? '<button class="go" id="btnEndless">♾️ 继续：无尽模式</button>' : ''}<button class="go ${win ? 'ghost' : ''}" id="btnAgain">🔄 再来一局</button><button class="go ghost" id="btnHome2">🏠 主菜单</button>`;
  $('btnAgain').onclick = () => startGame(S.mi); $('btnHome2').onclick = showTitle;
  if (win) $('btnEndless').onclick = () => { o.style.display = 'none'; S.over = false; S.endless = true; S.wave = 11; S.countdown = 15; toast('♾️ 无尽模式！敌人会越来越强…', '#ff5c8a'); };
  sfx(win ? 'levelup' : 'hurt');
}

// ======================= 主循环 =======================
let last = performance.now(), hudT = 0, fpsT = 0, fpsN = 0;
function modalOpen() { return shopOpen || cheatOpen || menuOpen || $('achM').classList.contains('show'); }
function loop(now) {
  const frameMs = now - last; let dt = Math.min(.05, frameMs/1000); last = now;
  const running = S && S.started && !S.over && !modalOpen();
  if (running) { for (let i = 0; i < S.speed; i++) { update(dt); if (S.over) break; } }
  else updateParticles(dt);
  renderFrame(dt, now/1000);
  updateTexts(running ? dt*(S ? S.speed : 1) : dt);
  if (S) { $('white').style.opacity = Math.min(1, S.white); $('hurt').style.opacity = Math.min(1, S.hurtFlash*2 + (S.hp < S.maxHp*.25 && S.started ? .25 + Math.sin(now/200)*.1 : 0)); }
  hudT -= dt; if (hudT <= 0 && S) { updateHud(); hudT = .1; }
  fpsN++; fpsT += frameMs; if (fpsT > 500) { $('fps').textContent = `${Math.round(fpsN*1000/fpsT)} FPS · ${QUALITY.pr.toFixed(2)}x · ${PT.n} 粒子 · ${S ? S.enemies.length : 0} 敌人`; fpsN = 0; fpsT = 0; }
  adaptQuality(frameMs, dt);
  requestAnimationFrame(loop);
}
function boot() {
  if (typeof THREE === 'undefined') { $('overBox').innerHTML = '<h1>3D 引擎加载失败</h1><p>请检查网络连接后刷新页面。</p>'; return; }
  gfxInit(); QUALITY.mode = SAVE.q || 'auto'; if (SAVE.sfx === false) sfxOn = false; if (SAVE.music === false) Music.on = false;
  gfxResize(); applyQuality(); showTitle();
  window.addEventListener('resize', () => setTimeout(() => { gfxResize(); }, 60));
  requestAnimationFrame(loop);
}
boot();

</script>
</body>
