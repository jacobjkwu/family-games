.notes{font-size:.9rem;line-height:1.5;opacity:.92}

.modal.show{display:flex}
.panel{background:linear-gradient(#3a2152,#1f1029);border:3px solid #ffcf3d;border-radius:1.25rem;padding:1.1rem;max-width:34rem;width:100%;max-height:100%;overflow-y:auto}

#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#000d;border:2px solid #7cff8a;border-radius:.9rem;padding:.6rem 1rem;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90%}
.pA{color:#5be36b;font-weight:900}.pB{color:#ff5c5c;font-weight:900}

    rcTitle:'🛟 找回存檔', rcHelp:'列出瀏覽器裡還留著的所有存檔副本（主存檔、備份、每日副本、複製前的備份、損壞的資料），可以恢復任意一份。恢復前會先備份目前的存檔。',
    rcOpen:'🛟 找回存檔', rcHide:'收起', kMain:'目前存檔', kBak:'上一次的備份', kDay:'每日副本', kCopy:'複製/匯入前的備份', kBroken:'損壞的資料', kLegacy:'v5 舊存檔',
    damaged:'讀不出來（已損壞）', current:'正在使用', copyRaw:'複製原始資料', bkCopy:'📋 複製備份碼（最新版本）', copied:'📋 備份碼已複製！', copyFail:'沒法自動複製，請長按下面的文字複製：', close:'關閉',
    noData:'還沒有可以備份的進度', maps:{beach:'海濱城堡', lava:'熔岩要塞', ice:'冰雪王宮'}, pad:'🎮 手把：<span class="pA">Ⓐ</span> 確定 · <span class="pB">Ⓑ</span> 返回 · 十字鍵/搖桿 移動'},

    yes:'Confirm', no:'Cancel', done:'✅ Copied, the old save was backed up', restore:'Restore', restoreQ:'Restore the {s} save from this copy?\n\n{what}\n\nThe current save is backed up first.', restored:'✅ Restored', noCopies:'No copies found',
    rcTitle:'🛟 Recover saves', rcHelp:'Lists every save copy still in this browser (main save, backup, daily copies, backups made before copying, damaged data). Restore any of them; the current save is backed up first.',
    rcOpen:'🛟 Recover saves', rcHide:'Hide', kMain:'Current save', kBak:'Previous backup', kDay:'Daily copy', kCopy:'Backup before copy/import', kBroken:'Damaged data', kLegacy:'v5 save',
    damaged:'Can’t be read (damaged)', current:'In use', copyRaw:'Copy raw data', bkCopy:'📋 Copy backup code (latest version)', copied:'📋 Backup code copied!', copyFail:'Couldn’t copy automatically. Select the text below and copy it:', close:'Close',
    noData:'No progress to back up yet', maps:{beach:'Seaside Castle', lava:'Lava Fortress', ice:'Ice Palace'}, pad:'🎮 Controller: <span class="pA">Ⓐ</span> select · <span class="pB">Ⓑ</span> back · D-pad/stick move'},
  fr: {title:'Le Roi Crabe défend son château', cont:'▶ Continuer v{v}', open:'Ouvrir', latest:'Récente', date:'Date', schema:'Format de sauvegarde', none:'pas de sauvegarde',
    missing:'Les v{list} n’ont pas été conservées comme fichiers séparés et ne s’ouvrent pas ici.', cpTitle:'📋 Copier la progression', cpHelp:'Copiez la progression (succès, cartes perso, partie en cours) d’une version vers une autre. La sauvegarde remplacée est d’abord copiée ; restaure-la avec « Récupérer ».',
    cpGo:'Copier', same:'Choisissez deux versions différentes', noSave:'La v{v} n’a pas de sauvegarde et ne peut pas être copiée', empty:'La v{v} n’a pas encore de sauvegarde, rien à copier', cantDown:'Impossible de copier de {a} vers l’ancien format {b}',
    confirm:'Copier la progression de la v{a} vers la v{b} ?\n\nSauvegarde de la v{b} qui sera remplacée :\n{what}\n\nElle sera d’abord copiée.', downWarn:'\n\n⚠️ Copie vers une version plus ancienne : ce qu’elle ne connaît pas (cartes perso, partie en cours) sera perdu.',
    nothing:'(la v{b} n’a pas encore de sauvegarde)', summary:'{a} succès · {m} cartes perso · en cours : {r}', noRun:'aucune', run:'{map}, vague {w}',
    yes:'Confirmer', no:'Annuler', done:'✅ Copié, l’ancienne sauvegarde est conservée', restore:'Restaurer', restoreQ:'Restaurer la sauvegarde {s} depuis cette copie ?\n\n{what}\n\nLa sauvegarde actuelle est d’abord conservée.', restored:'✅ Restaurée', noCopies:'Aucune copie trouvée',
    rcTitle:'🛟 Récupérer des sauvegardes', rcHelp:'Liste toutes les copies encore présentes dans ce navigateur (principale, secours, copies du jour, copies avant copie, données abîmées). Tu peux en restaurer une ; l’actuelle est d’abord conservée.',
    rcOpen:'🛟 Récupérer', rcHide:'Masquer', kMain:'Sauvegarde actuelle', kBak:'Copie précédente', kDay:'Copie du jour', kCopy:'Copie avant copie/import', kBroken:'Données abîmées', kLegacy:'Sauvegarde v5',
    damaged:'Illisible (abîmée)', current:'Utilisée', copyRaw:'Copier les données', bkCopy:'📋 Copier le code (dernière version)', copied:'📋 Code copié !', copyFail:'Copie automatique impossible. Sélectionne le texte ci-dessous et copie-le :', close:'Fermer',
    noData:'Pas encore de progression à sauvegarder', maps:{beach:'Château du Rivage', lava:'Forteresse de Lave', ice:'Palais de Glace'}, pad:'🎮 Manette : <span class="pA">Ⓐ</span> choisir · <span class="pB">Ⓑ</span> retour · croix/stick pour bouger'},
};
const LANG_NAMES = [['en', 'English'], ['fr', 'Français'], ['zh-Hans', '简体中文'], ['zh-Hant', '繁體中文']];
// 内置版本表（versions.json 读不到时用）
const FALLBACK = {game:GAME, versions:[{v:10, file:'crab-castle-v10.html', date:'2026-11-13', schema:'s3', notes:{}}, {v:9, file:'crab-castle-v9.html', date:'2026-11-13', schema:'s3', notes:{}}, {v:8, file:'crab-castle-v8.html', date:'2026-11-13', schema:'s3', notes:{}}, {v:7, file:'crab-castle-v7.html', date:'2026-11-13', schema:'s2', notes:{}}, {v:6, file:'crab-castle-v6.html', date:'2026-11-13', schema:'s1', notes:{}}, {v:4, file:'crab-castle-v4.html', date:'2026-11-12', schema:null, notes:{}}], missing:[1, 2, 3, 5]};

// ---------- 存储（全部 try/catch） ----------
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const keys = () => { try { return Object.keys(localStorage); } catch (e) { return []; } };
const parse = s => { if (s == null) return null; try { return JSON.parse(s); } catch (e) { return null; } };
const SETK = `${GAME}/settings`;
function settings() { const d = parse(get(SETK)); return d && typeof d === 'object' ? d : {}; }
function pickLang() {
  const s = settings().lang; if (STR[s]) return s;
  const n = (navigator.language || 'en').toLowerCase();
  if (/^zh-(tw|hk|mo|hant)/.test(n) || n.includes('hant')) return 'zh-Hant';
  if (n.startsWith('zh')) return 'zh-Hans';
  if (n.startsWith('fr')) return 'fr';
  return 'en';
}
let LANG = pickLang();
const T = (k, p) => String(STR[LANG][k] !== undefined ? STR[LANG][k] : STR.en[k] !== undefined ? STR.en[k] : k).replace(/\{(\w+)\}/g, (_, x) => p && p[x] !== undefined ? p[x] : '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));

// ---------- 存档结构与迁移（和游戏代码里的完全一致） ----------
// s1（v6）：crab-castle/save/s1 = {ach, map:序号}
// s2（v7）：crab-castle/save/s2 = {ach, mapId, maps, run}
// s3（v8）：crab-castle/save/s3 = {game, schema:3, wid, born, savedAt, ver, ach, mapId, maps, run}
const BUILTIN = ['beach', 'lava', 'ice'];
const SCHEMA_KEY = s => `${GAME}/save/${s}`;
const ORDER = ['s1', 's2', 's3'];
const newWid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const UP = {
  s1_s2: d => ({ach:d && d.ach || {}, mapId:BUILTIN[Math.max(0, Math.min(2, Number(d && d.map) || 0))], maps:[], run:null}),
  s2_s3: d => ({game:GAME, schema:3, wid:null, born:Date.now(), savedAt:0, ver:7, ach:d && d.ach || {}, mapId:d && d.mapId, maps:d && d.maps || [], run:d && d.run || null}),
};
const DOWN = {
  s2_s1: d => ({ach:d && d.ach || {}, map:Math.max(0, BUILTIN.indexOf(d && d.mapId))}),
  s3_s2: d => ({ach:d && d.ach || {}, mapId:d && d.mapId || 'beach', maps:Array.isArray(d && d.maps) ? d.maps : [], run:d && d.run || null}),
};
function convert(data, from, to) {
  let i = ORDER.indexOf(from), j = ORDER.indexOf(to), d = data;
  if (i < 0 || j < 0) return null;
  while (i < j) { d = UP[`${ORDER[i]}_${ORDER[i+1]}`](d); i++; }
  while (i > j) { const f = DOWN[`${ORDER[i]}_${ORDER[i-1]}`]; if (!f) return null; d = f(d); i--; }
  return d;
}
// 写入：s3 必须带新的 wid，这样已经打开的 v8 页面会发现存档被改了，不会盖掉它
function writeSchema(s, data) {
  const out = s === 's3' ? {...data, game:GAME, schema:3, wid:newWid(), savedAt:Date.now()} : data;
  return set(SCHEMA_KEY(s), JSON.stringify(out));
}
function backupCurrent(s) { const raw = get(SCHEMA_KEY(s)); if (raw != null) set(`${SCHEMA_KEY(s)}/copy-backup-${Date.now()}`, raw); }
function readSave(s) {
  const ok = d => d && typeof d === 'object' && (s !== 's3' || (d.game === GAME && d.schema === 3)) ? d : null;
  return ok(parse(get(SCHEMA_KEY(s)))) || ok(parse(get(SCHEMA_KEY(s) + '/bak')));
}
function describe(d, s) {
  if (!d || typeof d !== 'object') return null;
  const a = Object.keys(d.ach || {}).length, m = s !== 's1' && Array.isArray(d.maps) ? d.maps.length : 0;
  const maps = STR[LANG].maps || STR.en.maps, mapName = id => (maps && maps[id]) || ((d.maps || []).find(x => x && x.id === id) || {}).name || '🗺️';
  const r = s !== 's1' && d.run ? T('run', {map:mapName(d.run.mapId), w:d.run.wave}) : T('noRun');
  return T('summary', {a, m, r});
}

// ---------- 界面 ----------
let VERS = FALLBACK, showRecover = false;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.opacity = 0, 2400); }
function ask(msg, yes) { $('dlgMsg').textContent = msg; $('dlgYes').textContent = T('yes'); $('dlgNo').textContent = T('no'); $('dlg').classList.add('show');
  $('dlgYes').onclick = () => { $('dlg').classList.remove('show'); yes(); padRefocus(); }; $('dlgNo').onclick = () => { $('dlg').classList.remove('show'); padRefocus(); }; padRefocus(); }
function go(v) { set(`${GAME}/launcher/last`, String(v.v)); location.href = v.file; }
const vOf = s => (VERS.versions.filter(v => v.schema === s).sort((a, b) => b.v - a.v)[0] || {}).v;
function render() {
  document.documentElement.lang = LANG === 'en' ? 'en' : LANG === 'fr' ? 'fr' : LANG === 'zh-Hant' ? 'zh-TW' : 'zh-CN';
  $('title').textContent = T('title'); document.title = T('title');
  $('langs').innerHTML = LANG_NAMES.map(([k, n]) => `<button data-l="${k}" class="${k === LANG ? 'on' : ''}">${n}</button>`).join('');
  const vs = VERS.versions.slice().sort((a, b) => b.v - a.v), latest = vs[0];
  const last = vs.find(v => String(v.v) === get(`${GAME}/launcher/last`)) || latest;
  $('cont').textContent = T('cont', {v:last.v}); $('cont').onclick = () => go(last);
  $('list').innerHTML = vs.map(v => `<div class="ver ${v === latest ? 'latest' : ''}"><div class="info"><div class="t">v${v.v}${v === latest ? `<span class="badge">${T('latest')}</span>` : ''}</div>
    <div class="meta">${T('date')} ${v.date} · ${T('schema')}: ${v.schema || T('none')}</div><div class="notes">${esc((v.notes && (v.notes[LANG] || v.notes.en)) || '')}</div></div>
    <button class="open" data-v="${v.v}">${T('open')} v${v.v}</button></div>`).join('');
  $('missing').textContent = VERS.missing && VERS.missing.length ? T('missing', {list:VERS.missing.join(', v')}) : '';
  $('cpTitle').textContent = T('cpTitle'); $('cpHelp').textContent = T('cpHelp'); $('cpGo').textContent = T('cpGo');
  const opts = sel => vs.map(v => `<option value="${v.v}" ${v.v === sel ? 'selected' : ''}>v${v.v}${v.schema ? ' · ' + v.schema : ' (' + T('none') + ')'}</option>`).join('');
  const f = +$('cpFrom').value || (vs[1] || vs[0]).v, t = +$('cpTo').value || vs[0].v;
  $('cpFrom').innerHTML = opts(f); $('cpTo').innerHTML = opts(t);
  $('rcTitle').textContent = T('rcTitle'); $('rcHelp').textContent = T('rcHelp'); $('rcOpen').textContent = showRecover ? T('rcHide') : T('rcOpen'); $('bkCopy').textContent = T('bkCopy');
  $('codeClose').textContent = T('close'); $('padHelp').innerHTML = T('pad');
  renderRecover();
}
// ---------- 🛟 找回存档：列出所有副本 ----------
function copies() {
  const out = [];
  for (const k of keys()) {
    let m = k.match(/^crab-castle\/save\/(s\d+)(?:\/(bak|day-(\d{8})|copy-backup-(\d+)|broken-(\d+)))?$/), s, kind, ts = 0;
    if (m) { s = m[1]; kind = !m[2] ? 'main' : m[2] === 'bak' ? 'bak' : m[3] ? 'day' : m[4] ? 'copy' : 'broken'; ts = +(m[4] || m[5] || 0); if (m[3]) ts = Date.UTC(+m[3].slice(0, 4), +m[3].slice(4, 6) - 1, +m[3].slice(6, 8)); }
    else if (k === 'crab3d') { s = 's0'; kind = 'legacy'; }
    else continue;
    const raw = get(k), d = parse(raw);
    if (!ts && d && d.savedAt) ts = +d.savedAt;
    out.push({k, s, kind, ts, d, raw, ok:!!(d && typeof d === 'object')});
  }
  const rank = {main:0, bak:1, day:2, copy:3, broken:4, legacy:5};
  return out.sort((a, b) => b.s.localeCompare(a.s) || rank[a.kind] - rank[b.kind] || b.ts - a.ts);
}
function renderRecover() {
  const el = $('recover'); if (!showRecover) { el.innerHTML = ''; return; }
  const list = copies(); if (!list.length) { el.innerHTML = `<div class="small" style="margin-top:.6rem">${T('noCopies')}</div>`; return; }
  const name = {main:'kMain', bak:'kBak', day:'kDay', copy:'kCopy', broken:'kBroken', legacy:'kLegacy'};
  el.innerHTML = list.map((c, i) => {
    const sc = c.s === 's0' ? 's1' : c.s, v = vOf(sc), when = c.ts ? new Date(c.ts).toLocaleString() : '';
    const sum = c.ok ? describe(c.d, sc) : T('damaged');
    const canRestore = c.ok && c.kind !== 'main' && ORDER.includes(sc);
    return `<div class="bk ${c.ok ? '' : 'bad'}"><span><span class="k">${c.s === 's0' ? 'v5' : 'v' + (v || '?') + ' · ' + c.s} · ${T(name[c.kind])}</span>${when ? ' · ' + when : ''}<br><span class="small">${esc(sum)}</span></span>
      ${canRestore ? `<button data-rc="${i}">${T('restore')}</button>` : c.kind === 'main' ? `<span class="small">${T('current')}</span>` : `<button data-raw="${i}">${T('copyRaw')}</button>`}</div>`;
  }).join('');
  el._list = list;
}
function copyText(text, ok) {
  const fallback = () => { $('codeMsg').textContent = T('copyFail'); $('codeTxt').value = text; $('codeDlg').classList.add('show'); padRefocus(); };
  try { if (!navigator.clipboard || !navigator.clipboard.writeText) return fallback(); navigator.clipboard.writeText(text).then(() => toast(ok), fallback); } catch (e) { fallback(); }
}
// 和游戏里一样的备份码：CRABCASTLE- + base64(JSON)
function backupCode() {
  for (const s of ['s3', 's2', 's1']) { const d = readSave(s); if (d) {
    const save = s === 's3' ? d : convert(d, s, 's3');
    const o = {game:GAME, kind:'backup', schema:3, version:vOf('s3') || 8, date:new Date().toISOString(), save, settings:settings()};
    return 'CRABCASTLE-' + btoa(unescape(encodeURIComponent(JSON.stringify(o)))); } }
  return null;
}
document.addEventListener('click', ev => {
  const l = ev.target.closest('[data-l]'); if (l) { LANG = l.dataset.l; const s = settings(); s.lang = LANG; set(SETK, JSON.stringify(s)); render(); padRefocus(); return; }
  const o = ev.target.closest('[data-v]'); if (o) { go(VERS.versions.find(v => v.v === +o.dataset.v)); return; }
  const r = ev.target.closest('[data-rc]'); if (r) { const c = $('recover')._list[+r.dataset.rc]; const s = c.s === 's0' ? 's1' : c.s;
    const data = c.s === 's0' ? {ach:c.d.ach || {}, map:c.d.map || 0} : c.d;
    ask(T('restoreQ', {s, what:describe(data, s)}), () => { backupCurrent(s); if (writeSchema(s, data)) toast(T('restored')); renderRecover(); }); return; }
  const w = ev.target.closest('[data-raw]'); if (w) { const c = $('recover')._list[+w.dataset.raw]; copyText(c.raw || '', T('copied')); return; }
});
$('rcOpen').onclick = () => { showRecover = !showRecover; render(); padRefocus(); };
$('bkCopy').onclick = () => { const c = backupCode(); if (!c) return toast(T('noData')); copyText(c, T('copied')); try { const m = parse(get(`${GAME}/meta`)) || {}; m.lastBackup = Date.now(); set(`${GAME}/meta`, JSON.stringify(m)); } catch (e) {} };
$('codeClose').onclick = () => { $('codeDlg').classList.remove('show'); padRefocus(); };
$('cpGo').onclick = () => {
  const A = VERS.versions.find(v => v.v === +$('cpFrom').value), B = VERS.versions.find(v => v.v === +$('cpTo').value);
  if (!A || !B || A === B) return toast(T('same'));
  if (!A.schema) return toast(T('noSave', {v:A.v})); if (!B.schema) return toast(T('noSave', {v:B.v}));
  const src = readSave(A.schema); if (!src) return toast(T('empty', {v:A.v}));
  const out = A.schema === B.schema ? src : convert(src, A.schema, B.schema); if (!out) return toast(T('cantDown', {a:A.schema, b:B.schema}));
  const cur = readSave(B.schema), what = describe(cur, B.schema) || T('nothing', {b:B.v});
  const down = ORDER.indexOf(B.schema) < ORDER.indexOf(A.schema);
  ask(T('confirm', {a:A.v, b:B.v, what}) + (down ? T('downWarn') : ''), () => {
    backupCurrent(B.schema); if (writeSchema(B.schema, out)) toast(T('done')); renderRecover();
  });
};
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// ---------- 手柄：十字键/摇杆移动焦点，A 确定，B 返回 ----------
const PADS = {prev:{}, focus:null, dir:null, t:0, on:false};
function layer() { for (const id of ['codeDlg', 'dlg']) if ($(id).classList.contains('show')) return $(id); return document.body; }
function items(L) { return [...L.querySelectorAll('button,select,textarea')].filter(el => !el.disabled && el.offsetParent !== null && !(L === document.body && el.closest('.modal'))); }
function setF(el) { if (PADS.focus) PADS.focus.classList.remove('gp-focus'); PADS.focus = el; if (el) { el.classList.add('gp-focus'); try { el.scrollIntoView({block:'nearest'}); } catch (e) {} } }
function padRefocus() { if (!PADS.on) return; requestAnimationFrame(() => { const L = layer(), it = items(L); if (!PADS.focus || !it.includes(PADS.focus)) setF(L === document.body ? $('cont') : it[it.length - 1] || it[0]); }); }
function move(dx, dy) {
  const L = layer(), it = items(L); const cur = it.includes(PADS.focus) ? PADS.focus : null; if (!cur) return setF(it[0]);
  const r = cur.getBoundingClientRect(); let best = null, bs = 1e9;
  for (const el of it) { if (el === cur) continue; const q = el.getBoundingClientRect();
    // 沿方向的距离（边到边）+ 侧向偏移（范围重叠时为 0）
    const along = dx > 0 ? q.left - r.right : dx < 0 ? r.left - q.right : dy > 0 ? q.top - r.bottom : r.top - q.bottom;
    const ctr = dx ? (q.left + q.width/2 - r.left - r.width/2)*dx : (q.top + q.height/2 - r.top - r.height/2)*dy;
    if (ctr <= 2 || along < -Math.min(r.width, r.height)*.5) continue;
    const overlap = dx ? Math.min(r.bottom, q.bottom) - Math.max(r.top, q.top) : Math.min(r.right, q.right) - Math.max(r.left, q.left);
    const side = overlap > 0 ? 0 : dx ? Math.abs(q.top + q.height/2 - r.top - r.height/2) : Math.abs(q.left + q.width/2 - r.left - r.width/2);
    const sc = Math.max(0, along) + side*2.2; if (sc < bs) { bs = sc; best = el; } }
  if (best) setF(best);
}
function poll() {
  let pads = []; try { pads = [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(Boolean); } catch (e) {}
  const down = {}, held = {}; let lx = 0, ly = 0;
  for (const p of pads) { const prev = PADS.prev[p.index] || []; const now = p.buttons.map(b => !!(b && (b.pressed || b.value > .6)));
    now.forEach((v, i) => { if (v) { held[i] = 1; if (!prev[i]) down[i] = 1; } }); PADS.prev[p.index] = now;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0; if (Math.hypot(ax, ay) > .55) { lx = ax; ly = ay; } }
  const any = Object.keys(held).length || lx || ly;
  if (any && !PADS.on) { PADS.on = true; PADS.wait = true; setF($('cont')); }   // 第一次按：只显示焦点
  if (PADS.wait && !any) PADS.wait = false;
  if (PADS.on && !PADS.wait) {
    let dir = held[12] ? 'u' : held[13] ? 'd' : held[14] ? 'l' : held[15] ? 'r' : null;
    if (!dir && (lx || ly)) dir = Math.abs(lx) > Math.abs(ly) ? (lx > 0 ? 'r' : 'l') : (ly > 0 ? 'd' : 'u');
    let step = null; if (dir) { if (PADS.dir !== dir) { PADS.dir = dir; PADS.t = 22; step = dir; } else if (--PADS.t <= 0) { PADS.t = 8; step = dir; } } else PADS.dir = null;
    if (step) move(...{u:[0, -1], d:[0, 1], l:[-1, 0], r:[1, 0]}[step]);
    if (down[0] && PADS.focus) { const f = PADS.focus; if (f.tagName === 'SELECT') { f.selectedIndex = (f.selectedIndex + 1) % f.options.length; f.dispatchEvent(new Event('change')); } else f.click(); }
    if (down[1]) { if ($('codeDlg').classList.contains('show')) $('codeClose').click(); else if ($('dlg').classList.contains('show')) $('dlgNo').click(); else if (showRecover) $('rcOpen').click(); }
  }
  requestAnimationFrame(poll);
}
document.addEventListener('pointerdown', () => { if (PADS.on) { PADS.on = false; setF(null); } }, true);
render(); requestAnimationFrame(poll);
fetch('versions.json', {cache:'no-store'}).then(r => r.json()).then(j => { if (j && Array.isArray(j.versions)) { VERS = j; render(); } }).catch(() => {});
</script>
