<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>巨蟹王城堡保卫战 · 版本</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(#3a1d50,#0b0510);color:#fff;font-family:-apple-system,"PingFang SC","PingFang TC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overscroll-behavior:none}
body{padding:16px;padding-bottom:40px}
.wrap{max-width:880px;margin:0 auto}
button,select{font:inherit;color:#fff;border:0;border-radius:12px;background:#3b2a52;padding:10px 14px;min-height:44px;cursor:pointer;touch-action:manipulation}
select{font-size:16px;appearance:none;-webkit-appearance:none;border:2px solid #ffffff33;min-width:0;max-width:100%}
button:active{transform:scale(.96)}
button:disabled{opacity:.4}
h1{text-align:center;font-size:clamp(26px,5vw,44px);margin:6px 0;background:linear-gradient(#fff3a0,#ffb341);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000)}
.crab{text-align:center;font-size:64px}
.langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
.langs button.on{background:#ffcf3d;color:#3a2200;font-weight:800}
.cont{display:block;width:100%;font-size:clamp(20px,3.6vw,28px);font-weight:900;padding:16px;background:linear-gradient(#5be36b,#21a83a);color:#06300f;box-shadow:0 4px 0 #13702a;margin:6px 0 18px}
.ver{background:#ffffff12;border:2px solid #ffffff22;border-radius:18px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ver.latest{border-color:#ffd84a;box-shadow:0 0 18px #ffd84a44}
.ver .info{flex:1;min-width:220px}
.ver .t{font-size:20px;font-weight:900}
.badge{display:inline-block;background:#ffd84a;color:#3a2200;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:900;margin-left:6px;vertical-align:middle}
.meta{font-size:13px;opacity:.75;margin:3px 0}
.notes{font-size:14px;line-height:1.5;opacity:.92}
.open{font-weight:900;background:linear-gradient(#ffb341,#ff7a1a);color:#3a1600;padding:12px 22px}
.box{background:#00000040;border-radius:18px;padding:14px;margin-top:18px}
.box h2{margin:0 0 8px;font-size:19px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{flex:1;min-width:120px}
.small{font-size:13px;opacity:.75;line-height:1.5}
.bk{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#ffffff0c;border-radius:10px;padding:6px 10px;margin-top:6px;font-size:14px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.panel{background:linear-gradient(#3a2152,#1f1029);border:3px solid #ffcf3d;border-radius:20px;padding:18px;max-width:520px;width:100%}
.panel .msg{font-size:16px;line-height:1.6;white-space:pre-line;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;border:2px solid #7cff8a;border-radius:14px;padding:10px 16px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90%}
</style>
</head>
<body>
<div class="wrap">
  <div class="crab">🦀👑</div>
  <h1 id="title"></h1>
  <div class="langs" id="langs"></div>
  <button class="cont" id="cont"></button>
  <div id="list"></div>
  <div class="small" id="missing" style="text-align:center;margin:8px 0"></div>
  <div class="box">
    <h2 id="cpTitle"></h2>
    <div class="small" id="cpHelp" style="margin-bottom:8px"></div>
    <div class="row"><select id="cpFrom"></select><div style="flex:0;min-width:auto;text-align:center">→</div><select id="cpTo"></select><button id="cpGo" style="background:#3d8bff;font-weight:800"></button></div>
    <div id="backups"></div>
  </div>
</div>
<div class="modal" id="dlg"><div class="panel"><div class="msg" id="dlgMsg"></div><div class="row"><button id="dlgYes" style="background:#c0392b;font-weight:800"></button><button id="dlgNo"></button></div></div></div>
<div id="toast"></div>
<script>
'use strict';
const GAME = 'crab-castle';
const $ = id => document.getElementById(id);
// ---------- 文字表（四种语言） ----------
const STR = {
  'zh-Hans': {title:'巨蟹王城堡保卫战', cont:'▶ 继续 v{v}', open:'打开', latest:'最新', date:'日期', schema:'存档结构', none:'无存档',
    missing:'v{list} 没有单独保存的文件，这里打不开。', cpTitle:'📋 复制进度', cpHelp:'把一个版本的进度（成就、自制地图、进行中的游戏）复制到另一个版本。被覆盖的存档会先备份，可以随时恢复。',
    cpGo:'复制', from:'从', to:'到', same:'请选两个不同的版本', noSave:'v{v} 没有存档，不能复制', empty:'v{v} 还没有存档，没有可复制的内容',
    confirm:'把 v{a} 的进度复制到 v{b}？\n\n将被替换的 v{b} 存档：\n{what}\n\n替换前会自动备份。', downWarn:'\n\n⚠️ 复制到旧版本：自制地图和进行中的游戏在旧版里用不了，会被丢掉。',
    nothing:'（v{b} 目前没有存档）', summary:'成就 {a} 个 · 自制地图 {m} 张 · 进行中：{r}', noRun:'无', run:'{map} 第 {w} 波',
    yes:'确定', no:'取消', done:'✅ 已复制，备份已保存', backups:'💾 备份', restore:'恢复', restoreQ:'用这个备份恢复 v{v} 的存档？当前存档也会先备份。', restored:'✅ 已恢复', noBackups:'还没有备份'},
  'zh-Hant': {title:'巨蟹王城堡保衛戰', cont:'▶ 繼續 v{v}', open:'打開', latest:'最新', date:'日期', schema:'存檔結構', none:'無存檔',
    missing:'v{list} 沒有單獨保存的檔案，這裡打不開。', cpTitle:'📋 複製進度', cpHelp:'把一個版本的進度（成就、自製地圖、進行中的遊戲）複製到另一個版本。被覆蓋的存檔會先備份，可以隨時恢復。',
    cpGo:'複製', from:'從', to:'到', same:'請選兩個不同的版本', noSave:'v{v} 沒有存檔，不能複製', empty:'v{v} 還沒有存檔，沒有可複製的內容',
    confirm:'把 v{a} 的進度複製到 v{b}？\n\n將被替換的 v{b} 存檔：\n{what}\n\n替換前會自動備份。', downWarn:'\n\n⚠️ 複製到舊版本：自製地圖和進行中的遊戲在舊版裡用不了，會被丟掉。',
    nothing:'（v{b} 目前沒有存檔）', summary:'成就 {a} 個 · 自製地圖 {m} 張 · 進行中：{r}', noRun:'無', run:'{map} 第 {w} 波',
    yes:'確定', no:'取消', done:'✅ 已複製，備份已保存', backups:'💾 備份', restore:'恢復', restoreQ:'用這個備份恢復 v{v} 的存檔？目前的存檔也會先備份。', restored:'✅ 已恢復', noBackups:'還沒有備份'},
  en: {title:'Crab King Castle Defense', cont:'▶ Continue v{v}', open:'Open', latest:'Latest', date:'Date', schema:'Save format', none:'no saves',
    missing:'v{list} were not kept as separate files and can’t be opened here.', cpTitle:'📋 Copy progress', cpHelp:'Copy progress (achievements, custom maps, game in progress) from one version to another. The overwritten save is backed up first and can be restored.',
    cpGo:'Copy', from:'From', to:'To', same:'Pick two different versions', noSave:'v{v} has no saves and can’t be copied', empty:'v{v} has no save yet, nothing to copy',
    confirm:'Copy progress from v{a} to v{b}?\n\nv{b} save that will be replaced:\n{what}\n\nIt will be backed up first.', downWarn:'\n\n⚠️ Copying to an older version: custom maps and the game in progress don’t exist there and will be dropped.',
    nothing:'(v{b} has no save yet)', summary:'{a} achievements · {m} custom maps · in progress: {r}', noRun:'none', run:'{map}, wave {w}',
    yes:'Confirm', no:'Cancel', done:'✅ Copied, backup saved', backups:'💾 Backups', restore:'Restore', restoreQ:'Restore v{v}’s save from this backup? The current save is backed up first.', restored:'✅ Restored', noBackups:'No backups yet'},
  fr: {title:'Le Roi Crabe défend son château', cont:'▶ Continuer v{v}', open:'Ouvrir', latest:'Récente', date:'Date', schema:'Format de sauvegarde', none:'pas de sauvegarde',
    missing:'Les v{list} n’ont pas été conservées comme fichiers séparés et ne s’ouvrent pas ici.', cpTitle:'📋 Copier la progression', cpHelp:'Copiez la progression (succès, cartes perso, partie en cours) d’une version vers une autre. La sauvegarde remplacée est d’abord sauvegardée et peut être restaurée.',
    cpGo:'Copier', from:'De', to:'Vers', same:'Choisissez deux versions différentes', noSave:'La v{v} n’a pas de sauvegarde et ne peut pas être copiée', empty:'La v{v} n’a pas encore de sauvegarde, rien à copier',
    confirm:'Copier la progression de la v{a} vers la v{b} ?\n\nSauvegarde de la v{b} qui sera remplacée :\n{what}\n\nElle sera d’abord sauvegardée.', downWarn:'\n\n⚠️ Copie vers une version plus ancienne : les cartes perso et la partie en cours n’y existent pas et seront perdues.',
    nothing:'(la v{b} n’a pas encore de sauvegarde)', summary:'{a} succès · {m} cartes perso · en cours : {r}', noRun:'aucune', run:'{map}, vague {w}',
    yes:'Confirmer', no:'Annuler', done:'✅ Copié, sauvegarde de secours créée', backups:'💾 Sauvegardes', restore:'Restaurer', restoreQ:'Restaurer la sauvegarde de la v{v} depuis cette copie ? La sauvegarde actuelle est d’abord conservée.', restored:'✅ Restaurée', noBackups:'Aucune sauvegarde pour l’instant'},
};
const LANG_NAMES = [['en', 'English'], ['fr', 'Français'], ['zh-Hans', '简体中文'], ['zh-Hant', '繁體中文']];
const MAP_NAMES = {beach:'海滨城堡', lava:'熔岩要塞', ice:'冰雪王宫'};
// 内置版本表（versions.json 读不到时用）
const FALLBACK = {game:GAME, versions:[{v:7, file:'crab-castle-v7.html', date:'2026-11-13', schema:'s2', notes:{}}, {v:6, file:'crab-castle-v6.html', date:'2026-11-13', schema:'s1', notes:{}}, {v:4, file:'crab-castle-v4.html', date:'2026-11-12', schema:null, notes:{}}], missing:[1, 2, 3, 5]};

// ---------- 存储（全部 try/catch） ----------
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const keys = () => { try { return Object.keys(localStorage); } catch (e) { return []; } };
const parse = s => { try { return JSON.parse(s); } catch (e) { return null; } };
const SETK = `${GAME}/settings`;
function settings() { const d = parse(get(SETK)); return d && typeof d === 'object' ? d : {}; }
function pickLang() {
  const s = settings().lang; if (STR[s]) return s;
  const n = (navigator.language || 'en').toLowerCase();
  if (/^zh-(tw|hk|mo|hant)/.test(n) || n.includes('hant')) return 'zh-Hant';
  if (n.startsWith('zh')) return 'zh-Hans';
  if (n.startsWith('fr')) return 'fr';
  return 'en';
}
let LANG = pickLang();
const T = (k, p) => (STR[LANG][k] || STR.en[k] || k).replace(/\{(\w+)\}/g, (_, x) => p && p[x] !== undefined ? p[x] : '');

// ---------- 存档结构与迁移（与游戏代码一致） ----------
// s1（v6）：crab-castle/save/s1 = {ach, map:序号}
// s2（v7）：crab-castle/save/s2 = {ach, mapId, maps, run}
const BUILTIN = ['beach', 'lava', 'ice'];
const SCHEMA_KEY = s => `${GAME}/save/${s}`;
const ORDER = ['s1', 's2'];
const UP = { s1_s2: d => ({ach:d && d.ach || {}, mapId:BUILTIN[Math.max(0, Math.min(2, Number(d && d.map) || 0))], maps:[], run:null}) };
const DOWN = { s2_s1: d => ({ach:d && d.ach || {}, map:Math.max(0, BUILTIN.indexOf(d && d.mapId))}) };
function convert(data, from, to) {
  let i = ORDER.indexOf(from), j = ORDER.indexOf(to), d = data;
  while (i < j) { d = UP[`${ORDER[i]}_${ORDER[i+1]}`](d); i++; }
  while (i > j) { const f = DOWN[`${ORDER[i]}_${ORDER[i-1]}`]; if (!f) return null; d = f(d); i--; }
  return d;
}
function readSave(s) { return parse(get(SCHEMA_KEY(s))) || parse(get(SCHEMA_KEY(s) + '/bak')); }
function describe(d, s) {
  if (!d) return null;
  const a = Object.keys(d.ach || {}).length, m = s === 's2' && Array.isArray(d.maps) ? d.maps.length : 0;
  const r = s === 's2' && d.run ? T('run', {map:MAP_NAMES[d.run.mapId] || (d.maps || []).find(x => x.id === d.run.mapId)?.name || '🗺️', w:d.run.wave}) : T('noRun');
  return T('summary', {a, m, r});
}

// ---------- 界面 ----------
let VERS = FALLBACK;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.opacity = 0, 2200); }
function ask(msg, yes) { $('dlgMsg').textContent = msg; $('dlgYes').textContent = T('yes'); $('dlgNo').textContent = T('no'); $('dlg').classList.add('show');
  $('dlgYes').onclick = () => { $('dlg').classList.remove('show'); yes(); }; $('dlgNo').onclick = () => $('dlg').classList.remove('show'); }
function go(v) { set(`${GAME}/launcher/last`, String(v.v)); location.href = v.file; }
function render() {
  document.documentElement.lang = LANG === 'en' ? 'en' : LANG === 'fr' ? 'fr' : LANG === 'zh-Hant' ? 'zh-TW' : 'zh-CN';
  $('title').textContent = T('title'); document.title = T('title');
  $('langs').innerHTML = LANG_NAMES.map(([k, n]) => `<button data-l="${k}" class="${k === LANG ? 'on' : ''}">${n}</button>`).join('');
  const vs = VERS.versions.slice().sort((a, b) => b.v - a.v), latest = vs[0];
  const last = vs.find(v => String(v.v) === get(`${GAME}/launcher/last`)) || latest;
  $('cont').textContent = T('cont', {v:last.v}); $('cont').onclick = () => go(last);
  $('list').innerHTML = vs.map(v => `<div class="ver ${v === latest ? 'latest' : ''}"><div class="info"><div class="t">v${v.v}${v === latest ? `<span class="badge">${T('latest')}</span>` : ''}</div>
    <div class="meta">${T('date')} ${v.date} · ${T('schema')}：${v.schema || T('none')}</div><div class="notes">${(v.notes && (v.notes[LANG] || v.notes.en)) || ''}</div></div>
    <button class="open" data-v="${v.v}">${T('open')} v${v.v}</button></div>`).join('');
  $('missing').textContent = VERS.missing && VERS.missing.length ? T('missing', {list:VERS.missing.join(', v')}) : '';
  $('cpTitle').textContent = T('cpTitle'); $('cpHelp').textContent = T('cpHelp'); $('cpGo').textContent = T('cpGo');
  const opts = sel => vs.map(v => `<option value="${v.v}" ${v.v === sel ? 'selected' : ''}>${v.v === sel ? '' : ''}v${v.v}${v.schema ? '' : ' (' + T('none') + ')'}</option>`).join('');
  const f = +$('cpFrom').value || (vs[1] || vs[0]).v, t = +$('cpTo').value || vs[0].v;
  $('cpFrom').innerHTML = opts(f); $('cpTo').innerHTML = opts(t);
  renderBackups();
}
function renderBackups() {
  const bks = keys().filter(k => /\/save\/s\d+\/copy-backup-\d+$/.test(k)).sort().reverse();
  const vOf = s => (VERS.versions.filter(v => v.schema === s).sort((a, b) => b.v - a.v)[0] || {}).v || s;
  $('backups').innerHTML = `<div class="small" style="margin-top:10px">${T('backups')}</div>` + (bks.length ? bks.map(k => { const s = k.match(/save\/(s\d+)\//)[1], ts = +k.split('-').pop();
    return `<div class="bk"><span>v${vOf(s)} · ${new Date(ts).toLocaleString()}<br><span class="small">${describe(parse(get(k)), s) || ''}</span></span><button data-r="${k}">${T('restore')}</button></div>`; }).join('') : `<div class="small">${T('noBackups')}</div>`);
}
document.addEventListener('click', ev => {
  const l = ev.target.closest('[data-l]'); if (l) { LANG = l.dataset.l; const s = settings(); s.lang = LANG; set(SETK, JSON.stringify(s)); render(); return; }
  const o = ev.target.closest('[data-v]'); if (o) { go(VERS.versions.find(v => v.v === +o.dataset.v)); return; }
  const r = ev.target.closest('[data-r]'); if (r) { const k = r.dataset.r, s = k.match(/save\/(s\d+)\//)[1], v = (VERS.versions.find(x => x.schema === s) || {}).v;
    ask(T('restoreQ', {v}), () => { const cur = get(SCHEMA_KEY(s)); if (cur) set(`${SCHEMA_KEY(s)}/copy-backup-${Date.now()}`, cur); set(SCHEMA_KEY(s), get(k)); toast(T('restored')); renderBackups(); }); }
});
$('cpGo').onclick = () => {
  const A = VERS.versions.find(v => v.v === +$('cpFrom').value), B = VERS.versions.find(v => v.v === +$('cpTo').value);
  if (!A || !B || A === B) return toast(T('same'));
  if (!A.schema) return toast(T('noSave', {v:A.v})); if (!B.schema) return toast(T('noSave', {v:B.v}));
  const src = readSave(A.schema); if (!src) return toast(T('empty', {v:A.v}));
  const out = A.schema === B.schema ? src : convert(src, A.schema, B.schema); if (!out) return toast('✗');
  const cur = readSave(B.schema), what = describe(cur, B.schema) || T('nothing', {b:B.v});
  const down = ORDER.indexOf(B.schema) < ORDER.indexOf(A.schema);
  ask(T('confirm', {a:A.v, b:B.v, what}) + (down ? T('downWarn') : ''), () => {
    const raw = get(SCHEMA_KEY(B.schema)); if (raw) set(`${SCHEMA_KEY(B.schema)}/copy-backup-${Date.now()}`, raw);
    if (set(SCHEMA_KEY(B.schema), JSON.stringify(out))) toast(T('done')); renderBackups();
  });
};
document.addEventListener('gesturestart', e => e.preventDefault());
render();
fetch('versions.json', {cache:'no-store'}).then(r => r.json()).then(j => { if (j && Array.isArray(j.versions)) { VERS = j; render(); } }).catch(() => {});
</script>
<script type="module" src="../shared/family-cloud.js" data-games="crab-castle" data-chip="float"></script>
</body>
</html>
