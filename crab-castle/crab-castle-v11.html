<head>
<meta charset="utf-8">

<title>Crab King Castle Defense</title>
<style>
/* 字号用 rem：iPad 上 1rem = 16px，电视（≥1500×850）上 1rem = 28px */
html{font-size:16px}
/* 电视：1rem = 28px，正文 ≥ 28px，关键数字 ≥ 40px，重要界面留 5% 安全边距 */
@media (min-width:1500px) and (min-height:850px){html{font-size:28px} #app{padding:5vh 5vw} .modal,#over{padding:5vh 5vw!important}
  .pill b,#hptxt{font-size:1.45rem} #energy{height:1.25rem} #energyTxt{line-height:1.25rem}
  .card .ds,.mapc .ds,.mapc .df,.ach .ad,.dv,.howto,.bkline,.gun small,.ult small,#energyTxt,#popup,.tab,.tx,#padHint,#dialog .nm,.card .pr,.sec,#banner,#remind,.tag,#over p,.cbody div,.menu div,#bossIntro .tip,.bb .n,#toast .sub,.phead h2{font-size:1rem!important}
  .gun{min-width:4.2rem;height:3.6rem} .gun small{max-width:7rem} .ult{width:3.4rem;height:3.4rem} .ult small{bottom:-2px}
  #verBadge,#fps{font-size:.6rem}}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#120a18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","PingFang TC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
button,select{font:inherit;color:#fff;border:0;border-radius:.75rem;background:#3b2a52;padding:.5rem .75rem;min-height:44px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.94)}
button:disabled{opacity:.4}
.gp-focus{outline:.3rem solid #ffe34a!important;outline-offset:.15rem;box-shadow:0 0 0 .55rem rgba(255,227,74,.35)!important;position:relative;z-index:2}
input,textarea{font-size:max(16px,1rem)!important}
#hud{display:flex;align-items:center;gap:.45rem;padding:.4rem .6rem;background:linear-gradient(#2d1840,#1d0f2a);flex-wrap:wrap;font-size:clamp(.8rem,1.6vw,1rem);border-bottom:2px solid #4a2f63;z-index:5}
.pill{background:#00000060;border-radius:1.25rem;padding:.3rem .7rem;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
.hpbar{position:relative;width:clamp(4.4rem,10vw,8rem);height:.8rem;background:#000a;border-radius:.45rem;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff4d4d,#ff9a4d);transition:width .2s}
#shfill{position:absolute;left:0;top:0;height:40%;width:0;background:#8fd0ff}
.sp{flex:1}
.big{font-size:clamp(.95rem,1.8vw,1.15rem);font-weight:800;padding:.55rem .95rem}
#btnShop{background:linear-gradient(#ffb341,#ff7a1a);color:#3a1600;box-shadow:0 3px 0 #a64300}
#btnCheat{background:#5a3a7a}
#modBadge{display:none;background:#c0392b;font-size:.75rem}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:linear-gradient(#1d0f2a,#2d1840);border-top:2px solid #4a2f63;flex-wrap:wrap;z-index:5}
#guns{display:flex;gap:.3rem;flex-wrap:wrap}
.gun{min-width:3.1rem;height:3.25rem;font-size:1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.1rem .4rem;line-height:1.1}
.gun small{font-size:.62rem;opacity:.85;max-width:5.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gun.on{background:#ffcf3d;color:#3a2200;box-shadow:0 0 0 3px #fff6}
#ults{display:flex;align-items:center;gap:.4rem;background:#0006;border-radius:.9rem;padding:.25rem .5rem}
#energy{width:clamp(3.8rem,8vw,7rem);height:1rem;border-radius:.5rem;background:#000;position:relative;overflow:hidden;border:1px solid #ffd84a66}
#energyFill{height:100%;width:0;background:linear-gradient(90deg,#ff7a1a,#ffd84a,#fff3a0);box-shadow:0 0 10px #ffd84a}
#energyTxt{position:absolute;inset:0;text-align:center;font-size:.7rem;font-weight:800;line-height:1rem;text-shadow:0 1px 2px #000}
.ult{width:3.1rem;height:3.1rem;font-size:1.5rem;padding:0;position:relative;background:radial-gradient(#5a3a7a,#2a1a3a);border:2px solid #ffd84a55}
.ult.ready{border-color:#ffd84a;box-shadow:0 0 14px #ffd84a;animation:pulse 1s infinite}
.ult.sel{outline:3px solid #7cff8a}
.ult small{position:absolute;bottom:1px;left:0;right:0;font-size:.56rem;font-weight:800}
.ult.lock{filter:grayscale(1);opacity:.45}
@keyframes pulse{50%{box-shadow:0 0 22px #ffd84a}}
#btnWave{background:linear-gradient(#5be36b,#21a83a);color:#06300f;box-shadow:0 3px 0 #13702a}
#btnWave.hide{display:none}
#banner{position:absolute;left:50%;top:.5rem;transform:translateX(-50%);background:#000c;border:2px solid #7cff8a;border-radius:.9rem;padding:.45rem .55rem .45rem .9rem;display:none;align-items:center;gap:.6rem;font-size:.95rem;z-index:6;max-width:94%}
#banner button{background:#7cff8a;color:#063010;font-weight:800}
#popup{position:absolute;display:none;background:#1d1229f2;border:2px solid #ffcf3d;border-radius:.9rem;padding:.6rem;z-index:7;width:15rem;font-size:.82rem}
#popup .row{display:flex;gap:.5rem;margin-top:.5rem}
#popup button{flex:1;font-weight:800}
#popup .up{background:#3d8bff}
#popup .sell{background:#c0392b}
#padHint{position:absolute;left:50%;bottom:.4rem;transform:translateX(-50%);background:#000b;border-radius:.7rem;padding:.3rem .8rem;font-size:.85rem;z-index:5;pointer-events:none;display:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
.pA{color:#5be36b;font-weight:900}.pB{color:#ff5c5c;font-weight:900}.pX{color:#4da3ff;font-weight:900}.pY{color:#ffd84a;font-weight:900}
#remind{position:absolute;left:50%;bottom:3.6rem;transform:translateX(-50%);background:#1d1229f2;border:2px solid #7cff8a;border-radius:.9rem;padding:.5rem .7rem;z-index:8;display:none;align-items:center;gap:.5rem;max-width:94%;font-size:.9rem}
#storageBad{display:none;background:#c0392b;color:#fff;padding:.4rem .7rem;font-weight:800;font-size:.9rem;text-align:center;z-index:9}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:.75rem}
.modal.show{display:flex}
.panel{background:linear-gradient(#3a2152,#1f1029);border:3px solid #ffcf3d;border-radius:1.4rem;width:min(60rem,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-bottom:2px solid #ffffff22;flex-wrap:wrap}
.phead h2{margin:0;font-size:1.3rem}
.tabs{display:flex;gap:.3rem;padding:.5rem .75rem 0;flex-wrap:wrap}
.tab{font-size:.95rem;padding:.55rem .8rem;border-radius:.75rem .75rem 0 0;background:#ffffff14}
.tab.on{background:#ffcf3d;color:#3a2200;font-weight:800}
.grid{display:grid;grid-auto-rows:max-content;align-content:start;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:.55rem;padding:.75rem;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{background:#ffffff12;border:2px solid #ffffff22;border-radius:1rem;padding:.6rem;display:flex;flex-direction:column;gap:.3rem;text-align:left;color:#fff}
.card .ic{font-size:2.2rem;line-height:1}
.card .nm{font-weight:800;font-size:1rem}
.card .ds{font-size:.78rem;opacity:.82;flex:1;line-height:1.45}
.card .pr{font-weight:800;color:#ffcf3d;font-size:.95rem}
.card.no{opacity:.45}
.card.kill{border-color:#ff4d6d;background:#ff4d6d1f}
.card.owned{border-color:#7cff8a}
.card.cur{border-color:#ffd84a;box-shadow:0 0 16px #ffd84a66}
.card img{width:100%;border-radius:.75rem;background:radial-gradient(#4a2f63,#1a0d24)}
.tag{display:inline-block;background:#ff4d6d;color:#fff;border-radius:.5rem;padding:1px .35rem;font-size:.7rem;margin-left:.25rem;vertical-align:middle}
.sec{grid-column:1/-1;font-weight:800;font-size:1rem;margin-top:.25rem}
#toast{position:fixed;left:50%;top:21%;transform:translateX(-50%);font-size:clamp(1.4rem,4.4vw,2.6rem);font-weight:900;pointer-events:none;text-shadow:0 3px 0 #000,0 0 18px #000;z-index:15;opacity:0;transition:opacity .3s;text-align:center;max-width:94vw}
#toast .sub{font-size:clamp(.9rem,2vw,1.2rem);font-weight:700;color:#fff;margin-top:.25rem}
#combo{position:absolute;right:1rem;top:30%;text-align:center;font-weight:900;font-size:1.4rem;color:#ffd84a;text-shadow:0 3px 0 #000,0 0 14px #ff7a1a;pointer-events:none;opacity:0;z-index:4}
#combo b{font-size:3.25rem;display:block;line-height:1}
#combo span{font-size:1.5rem;color:#fff}
#combo.pop{animation:cpop 1.6s ease-out}
@keyframes cpop{0%{opacity:0;transform:scale(2.4) rotate(-8deg)}12%{opacity:1;transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#bossbars{position:absolute;left:50%;top:.4rem;transform:translateX(-50%);width:min(35rem,70%);z-index:4;pointer-events:none}
.bb{margin-bottom:.4rem;text-shadow:0 2px 0 #000}
.bb .n{font-weight:900;font-size:.95rem;display:flex;justify-content:space-between}
.bb .t{height:.9rem;border-radius:.45rem;background:#000b;border:2px solid #ffd84a;overflow:hidden}
.bb .f{height:100%;background:linear-gradient(90deg,#ff2d55,#ff9a4d);transition:width .15s}
#dialog{position:absolute;left:.75rem;bottom:.75rem;display:flex;align-items:center;gap:.6rem;background:#000c;border:2px solid #ffd84a;border-radius:1rem;padding:.5rem .9rem .5rem .5rem;z-index:5;max-width:min(35rem,80%);opacity:0;transform:translateY(20px);transition:all .25s;pointer-events:none}
#dialog.show{opacity:1;transform:none}
body.padmode #dialog{bottom:3.6rem}
#dialog .pt{font-size:2.5rem;width:3.25rem;height:3.25rem;display:flex;align-items:center;justify-content:center;background:radial-gradient(#ffd84a55,transparent);border-radius:50%}
#dialog .nm{font-weight:900;color:#ffd84a;font-size:.9rem}
#dialog .dtx{font-size:1rem;font-weight:700}
#bossIntro{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(transparent 30%,#000c)}
#bossIntro.show{display:flex}
#bossIntro .stripe{position:absolute;left:0;right:0;height:2.9rem;background:repeating-linear-gradient(-45deg,#ffcf3d 0 24px,#111 24px 48px);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:stripe 1s linear infinite}
#bossIntro .stripe span{background:#111;color:#ff2d55;font-weight:900;font-size:1.6rem;padding:0 1.25rem;letter-spacing:.3rem;white-space:nowrap}
#bossIntro .s1{top:12%}#bossIntro .s2{bottom:12%;animation-direction:reverse}
@keyframes stripe{to{background-position:68px 0}}
#bossIntro .card2{text-align:center;animation:bin .6s cubic-bezier(.2,1.6,.4,1);padding:0 1rem}
#bossIntro .face{font-size:min(28vw,12rem);line-height:1;filter:drop-shadow(0 0 30px var(--c));animation:shake .15s infinite}
#bossIntro .nm{font-size:clamp(2rem,6vw,3.75rem);font-weight:900;text-shadow:0 4px 0 #000,0 0 30px var(--c)}
#bossIntro .st{font-size:1.9rem;color:#ffd84a;text-shadow:0 2px 0 #000}
#bossIntro .ln{font-size:clamp(1rem,2.6vw,1.5rem);font-weight:800;margin-top:.5rem;text-shadow:0 2px 0 #000}
#bossIntro .tip{font-size:.95rem;opacity:.9;margin-top:.4rem;text-shadow:0 2px 0 #000}
@keyframes bin{0%{transform:scale(3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%{transform:translate(2px,1px)}50%{transform:translate(-2px,-1px)}100%{transform:translate(1px,-2px)}}
#white{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
#hurt{position:absolute;inset:0;background:radial-gradient(transparent 50%,#ff000099);opacity:0;pointer-events:none;z-index:3}
#ink{position:absolute;inset:0;pointer-events:none;z-index:3}
#ink div{position:absolute;border-radius:50%;background:radial-gradient(#0a0010 55%,#1a0020cc 70%,transparent 72%)}
#txts{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.tx{position:absolute;left:0;top:0;font-weight:900;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 6px #000,1px 1px 0 #000,-1px -1px 0 #000;font-size:.875rem;will-change:transform}
.tx.big{font-size:1.25rem}
#over{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(#3a1d50dd,#0b0510f2);padding:.9rem;overflow-y:auto;-webkit-overflow-scrolling:touch}
#over .box{max-width:58rem;width:100%;text-align:center;margin:auto}
#over h1{font-size:clamp(1.9rem,5.5vw,3.5rem);margin:.25rem 0;background:linear-gradient(#fff3a0,#ffb341);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000)}
#over p{font-size:1rem;line-height:1.6;opacity:.92;margin:.4rem 0}
#over .crab{font-size:clamp(3.75rem,11vw,6.9rem);animation:bob 1.2s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.langs{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap;margin:.4rem 0}
.langs button.on{background:#ffcf3d;color:#3a2200;font-weight:800}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(12.5rem,1fr));gap:.6rem;margin:.75rem 0}
.mapc{background:#ffffff14;border:3px solid #ffffff22;border-radius:1.1rem;padding:.75rem;text-align:left}
.mapc.on{border-color:#ffd84a;box-shadow:0 0 20px #ffd84a66;background:#ffd84a1a}
.mapc .ic{font-size:2.5rem}
.mapc .nm{font-size:1.2rem;font-weight:900}
.mapc .df{color:#ffd84a}
.mapc .ds{font-size:.82rem;opacity:.85;margin-top:.25rem}
.go{font-size:1.5rem;font-weight:900;padding:.85rem 2.4rem;background:linear-gradient(#ffb341,#ff7a1a);color:#3a1600;box-shadow:0 4px 0 #a64300;margin:.4rem}
.ghost{background:#ffffff1a}
.thu{display:inline-block;background:#ff7a1a;color:#fff;padding:.25rem .75rem;border-radius:.6rem;font-weight:900;margin-bottom:.4rem;animation:pulse 1s infinite}
.bkline{font-size:.9rem;opacity:.9;margin:.4rem 0}
.due{background:#7a2a2a;border:2px solid #ff9a4d;border-radius:.9rem;padding:.5rem .75rem;margin:.4rem auto;max-width:40rem;display:flex;gap:.5rem;align-items:center;justify-content:center;flex-wrap:wrap}
.menu{display:flex;flex-direction:column;gap:.5rem;padding:.9rem;min-width:17.5rem;overflow-y:auto}
.menu button{font-size:1.05rem;padding:.7rem;font-weight:700}
.row2{display:flex;gap:.4rem;flex-wrap:wrap}
.row2 button{flex:1}
.row2 button.on{background:#ffcf3d;color:#3a2200}
.cbody{padding:.9rem;display:flex;flex-direction:column;gap:.6rem;overflow-y:auto}
.cbody input,.cbody textarea{flex:1;min-width:0;padding:.6rem .75rem;border-radius:.75rem;border:2px solid #ffcf3d;background:#120a18;color:#fff;-webkit-user-select:text;user-select:text}
.cbody textarea{min-height:6rem;font-family:ui-monospace,Menlo,monospace;font-size:max(16px,.8rem)!important}
.qrow{display:flex;flex-wrap:wrap;gap:.5rem}
.qrow button{flex:1;min-width:5.25rem;font-size:1.05rem;font-weight:800;padding:.7rem .5rem;background:#ffcf3d;color:#3a2200}
.achl{display:grid;grid-auto-rows:max-content;align-content:start;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:.5rem;padding:.75rem;overflow-y:auto}
.ach{background:#ffffff10;border-radius:.75rem;padding:.5rem;display:flex;gap:.5rem;align-items:center;opacity:.45}
.ach.got{opacity:1;border:2px solid #ffd84a}
.ach .i{font-size:1.9rem}
#fps{position:absolute;right:.4rem;bottom:.25rem;font-size:.7rem;opacity:.75;z-index:4;pointer-events:none;display:none;background:#0008;padding:0 .3rem;border-radius:.3rem}
#verBadge{position:absolute;left:.4rem;bottom:.25rem;font-size:.7rem;opacity:.55;z-index:4;pointer-events:none;background:#0006;border-radius:.4rem;padding:1px .3rem}
#edGrid{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;touch-action:none;aspect-ratio:16/9;width:100%;max-height:52vh;background:#0006;border-radius:.6rem;padding:3px}
.ec{background:var(--top);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(.6rem,2vw,1.4rem);box-shadow:inset 0 -3px 0 #0003}
.ec.p{background:var(--path);box-shadow:inset 0 0 0 2px #ffcf3d99}
.ec.st{outline:2px dashed #7cff8a;animation:pulse 1s infinite}
.ec .ar{color:#ffcf3d;opacity:.85;font-weight:900}
.ec.cur{outline:4px solid #ffe34a;outline-offset:-4px}
.ach .ad{font-size:.8rem;opacity:.8}
.howto{font-size:.9rem!important;opacity:.8}
.dv button:disabled{opacity:.25}
.dv{display:grid;grid-template-columns:1fr auto auto;gap:.3rem .5rem;align-items:center;padding:.25rem 0;border-bottom:1px solid #ffffff14;font-size:.9rem}
.dv input[type=range]{grid-column:1/-1;width:100%;height:2rem}
.dv .val{font-weight:800;color:#ffd84a;font-variant-numeric:tabular-nums;min-width:3.5rem;text-align:right}
.dv button{min-height:2.2rem;padding:.2rem .6rem}
.dgrp{font-weight:900;color:#ffd84a;margin-top:.6rem}
#pcards{position:absolute;inset:0;pointer-events:none;z-index:5}
#netPill{display:none;position:absolute;right:.5rem;top:.4rem;z-index:6;background:#000b;border:2px solid #3d8bff;border-radius:.8rem;padding:.2rem .6rem;font-weight:800;font-size:.85rem;pointer-events:none}
#netPause{display:none;position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:7;background:#000c;border:3px solid #ffcf3d;border-radius:1rem;padding:.6rem 1.2rem;font-weight:900;font-size:1.3rem;pointer-events:none}
.netcode{font-size:2.6rem;font-weight:900;letter-spacing:.4rem;text-align:center;color:#ffd84a;margin:.3rem 0;font-family:ui-monospace,Menlo,monospace}
.netmsg{font-size:1rem;font-weight:800;text-align:center;margin:.5rem 0;line-height:1.5}
#netCodeIn{flex:2;min-width:7rem;font-size:max(18px,1.3rem);text-transform:uppercase;letter-spacing:.3rem;text-align:center;padding:.55rem;border-radius:.6rem;border:2px solid #3d8bff;background:#120a18;color:#fff;-webkit-user-select:text;user-select:text}
.pc{position:absolute;display:flex;align-items:center;gap:.4rem;background:#000b;border:3px solid var(--pc);border-radius:.9rem;padding:.2rem .4rem .2rem .7rem;pointer-events:auto;font-size:1rem;white-space:nowrap}
.pc b{color:var(--pc);font-size:1.2rem}.pc i{font-style:normal;font-weight:800}
.pc button{min-width:44px;padding:.3rem .5rem}
.pc.bottom{left:50%;bottom:.4rem;transform:translateX(-50%)}
.pc.top{left:50%;top:.4rem;transform:translateX(-50%) rotate(180deg)}
.pc.left{left:.3rem;top:50%;transform-origin:0 0;transform:rotate(90deg) translate(-50%,-100%)}
.pc.right{left:calc(100% - .3rem);top:50%;transform-origin:0 0;transform:rotate(-90deg) translate(-50%,-100%)}
.pc.pad{left:.4rem}
.pc.mini{padding:.25rem .6rem;opacity:.9}
#editor,#achM,#importM,#devM,#netM{z-index:35}
#ask,#emptyM,#extM{z-index:40}
</style>
</head>
<body>
<div id="app">
  <div id="storageBad" data-i="storageBad"></div>
  <div id="hud">
    <div class="pill">💰 <b id="gold">0</b></div>
    <div class="pill">🦀 <div class="hpbar"><div id="hpfill"></div><div id="shfill"></div></div><b id="hptxt"></b></div>
    <div class="pill">🌊 <b id="wave">1</b></div>
    <div class="pill">👥 <b id="left">100</b></div>
    <button id="modBadge" data-i="modded"></button>
    <div class="sp"></div>
    <button id="btnSpeed">⏩ x1</button>
    <button id="btnMenu">☰</button>
    <button id="btnCheat">🔑</button>
    <button id="btnShop" class="big" data-i="shop"></button>
  </div>

// ---------- 子弹 ----------
function updateBullets(dt) {
  for (const b of S.bullets) {
    b.life = (b.life === undefined ? 3 : b.life) - dt; if (b.life <= 0) continue;
    if (b.delay > 0) { b.delay -= dt; continue; }
    if (b.lob) { // 抛物线炮弹
      b.t += dt; const f = Math.min(1, b.t / b.T);
      b.px = b.x + (b.tx - b.x)*f; b.pz = b.z + (b.tz - b.z)*f; b.ph = b.h + Math.sin(f*Math.PI)*1.2;
      if (Math.random() < .5) emit(b.px, b.ph, b.pz, 0, .2, 0, .4, .2, 0x888888, {cell:'smoke', mode:1});
      if (f >= 1) { b.life = 0; explode(b.tx, b.tz, b.splash || 1, b.dmg); }
      continue;
    }
    if (b.target) { // 追踪
      const t = b.target; if (!t.dead) { b.tx = t.x; b.tz = t.y; b.th = .55 + eh(t); } else if (b.th === undefined) b.th = .5;
      if (b.kind === 'missile') { b.vy = (b.vy || 0) - dt*6; b.h = Math.max(b.th, b.h + b.vy*dt); if (Math.random() < .7) emit(b.x, b.h, b.z, 0, .3, 0, .5, .25, 0x999999, {cell:'smoke', mode:1, s2:.6}); }

      const dx = b.tx - b.x, dz = b.tz - b.z, dh = (b.th || .5) - b.h, dist = Math.hypot(dx, dz, dh), st = b.spd*dt;
      if (dist <= st + .1) {
        b.life = 0;
        if (b.splash) explode(b.tx, b.tz, b.splash, b.dmg, {air:b.air});
        else if (!t.dead) { hurt(t, b.dmg, {col:b.crit ? 0xffd23f : b.slow ? 0x8fe3ff : 0xffffff}); if (b.slow) setSlow(t, 1.6, b.slow); if (b.freeze && Math.random() < .3) setFreeze(t, .8);
          burst(b.tx, b.th, b.tz, 5, b.col, 2, .2, .15, {cell:'spark'}); }
      } else { b.x += dx/dist*st; b.z += dz/dist*st; b.h += dh/dist*st; }
      continue;
    }
    // 大王子弹（直线）
    const steps = Math.ceil(Math.hypot(b.vx, b.vz)*dt/.2);
    for (let s = 0; s < steps && b.life > 0; s++) {
      b.x += b.vx*dt/steps; b.z += b.vz*dt/steps; b.h += (.55 - b.h)*Math.min(1, dt*4);
      if (b.x < -2 || b.x > COLS + 2 || b.z < -2 || b.z > ROWS + 2) { b.life = 0; break; }
      if (S.bird && Math.hypot(S.bird.x - b.x, S.bird.z - b.z) < .7) { const v = Math.round(rand(150, 400)); addGold(v, S.bird.x, S.bird.z); toast(T('birdHit', {n:v}), '#ffd84a'); burst(S.bird.x, S.bird.h, S.bird.z, 50, 0xffd23f, 5, .8, .25); ach('bird'); S.bird = null; sfx('chest'); }
      forNear(b.x, b.z, 1.2, e => {
        if (b.hit.has(e) || e.dropT > 0 || e.hidT > 0) return;
        if (Math.hypot(e.x - b.x, e.y - b.z) < e.size*.42 + .1) {
          b.hit.add(e);
          if (b.splash) { explode(b.x, b.z, b.splash, b.dmg, {src:'king', air:true}); b.life = 0; return true; }
          if (b.instakill) { instakill(e, 'kill', .12); burst(e.x, .7, e.y, 20, 0xffd700, 4, .4, .2, {cell:'spark'}); }
          else { hurt(e, b.dmg, {src:'king', p:b.p}); burst(b.x, .6 + eh(e), b.z, 4, b.col, 2.5, .2, .15, {cell:'spark'}); }

          if (--b.pierce <= 0) { b.life = 0; return true; }
        }
      });
    }
  }
  S.bullets = S.bullets.filter(b => b.life > 0);
}

// ---------- 暗号 ----------
function applyCode(raw) {
  const c = raw.trim().toLowerCase().replace(/\s/g, '');
  const ALIAS = {'疯狂星期四':'v50', 'kfc':'v50', 'chicken':'v50', 'poulet':'v50', 'chill':'躺平', 'relax':'躺平', 'overtime':'996', 'heuressup':'996', 'powerup':'我要变强', 'maxking':'我要变强', 'thanks':'蟹蟹', 'merci':'蟹蟹', 'god':'无敌', 'invincible':'无敌', 'love':'520', '躺平':'躺平', '我要變強':'我要变强', '無敵':'无敌', '謝謝':'蟹蟹'};
  const code = Object.keys(CODES).find(k => k.toLowerCase() === c) || ALIAS[c] || null;
  if (!code) return false;
  ach('cheat');
  switch (code) {
    case '666': addGold(666); break;
    case '888': addGold(888); for (let i = 0; i < 60; i++) emit(rand(1, 15), 5, rand(0, 9), 0, -1, 0, 3, .3, 0xffffff, {cell:'coin', mode:1, grav:2}); break;
    case '520': S.hp = S.maxHp; for (let i = 0; i < 40; i++) emit(KING.x + rand(-2, 2), rand(.5, 2), KING.y + rand(-2, 2), 0, 1, 0, 2, .35, 0xffffff, {cell:'❤️', mode:1}); break;
    case '躺平': S.mods.slow = true; break;
    case '996': S.mods.overtime = true; break;
    case 'v50': useItem('kfc'); break;
    case '我要变强': while (S.klvl < 5) { S.gold += price(KING_LV[S.klvl + 1].cost); upgradeKing(); } break;
    case '蟹蟹': S.energy = 100; break;
    case '无敌': S.invincible = !S.invincible; break;
  }
  toast('🔑 ' + CODES[code] + (code === '无敌' ? (S.invincible ? T('codeOn') : T('codeOff')) : ''), '#ffd84a');
  sfx('buy'); return true;
}

function shopBuy(tab, k) {

    S.gold -= c; S.owned[k] = true; S.gun = k; sfx('buy'); renderGuns(); renderShop(); toast(T('gotGun', {ic:GUNS[k].ic, n:GUNS[k].name}), '#ffd84a'); return true;
  }
  if (tab === 'item') { const d = ITEMS[k], c = price(d.cost); if (S.gold < c) { toast(T('noGold'), '#ff6b6b'); return false; } S.gold -= c; closeShop(); useItem(k); return true; }
  const d = (tab === 'trap' ? TRAPS : GUARDS)[k]; if (S.gold < price(d.cost)) { toast(T('noGold'), '#ff6b6b'); return false; }

  try { const raw = code.trim().replace(/^CRAB1:/, ''); const o = JSON.parse(decodeURIComponent(escape(atob(raw))));
    const cells = []; for (let i = 0; i + 1 < o.c.length; i += 2) cells.push([parseInt(o.c[i], 16), parseInt(o.c[i+1], 10)]);
    if (validateCells(cells)) return null; return makeCustomMap(cells, String(o.n || T('sharedMap')).slice(0, 16), clamp(o.t|0, 0, 2), clamp(o.d|0 || 1, 1, 3), 'u' + Date.now());
  } catch (e) { return null; }
}

const ED = {cells:[], name:'', theme:0, diff:2, id:null, drawing:false, hist:[]};
function openEditor(m) {
  ED.cells = m ? m.cells.map(c => c.slice()) : []; ED.name = m ? m.name : T('myMap'); ED.theme = m ? m.theme : 0; ED.diff = m ? m.diff : 2; ED.id = m ? m.id : null; ED.hist = [];
  $('edName').value = ED.name; $('editor').classList.add('show'); edRender();
}
function closeEditor() { $('editor').classList.remove('show'); }
function edCellAt(ev) {
  const g = $('edGrid'), r = g.getBoundingClientRect(), c = Math.floor((ev.clientX - r.left)/r.width*COLS), rr = Math.floor((ev.clientY - r.top)/r.height*ROWS);
  return c >= 0 && rr >= 0 && c < COLS && rr < ROWS ? [c, rr] : null;
}
function edTouch(cell, first) {
  const P = ED.cells, last = P[P.length - 1];
  if (!P.length) { if (cell[0] !== 0) { edMsg(T('edStartHere')); return; } P.push(cell); return; }
  const idx = P.findIndex(p => p[0] === cell[0] && p[1] === cell[1]);
  if (idx >= 0) { if (idx < P.length - 1 && (first || idx === P.length - 2)) P.length = idx + 1; return; } // 往回拖 = 擦掉
  if (last[0] === COLS - 1 && P.length > 1 && last !== P[0]) { edMsg(T('edAtEnd')); return; }
  // 拖得太快跳格时，同一行/列自动补齐
  const dc = cell[0] - last[0], dr = cell[1] - last[1];
  if ((dc === 0 || dr === 0) && Math.abs(dc + dr) >= 1) {
    const sc = Math.sign(dc), sr = Math.sign(dr); let [c, r] = last; const add = [];
    while (c !== cell[0] || r !== cell[1]) { c += sc; r += sr; if (P.some(p => p[0] === c && p[1] === r) || add.some(p => p[0] === c && p[1] === r)) return; add.push([c, r]); if (c === COLS - 1) break; }
    P.push(...add);
  }
}
let edMsgT = null;
function edMsg(t, ok) { const m = $('edMsg'); m.textContent = t; m.style.color = ok ? '#7cff8a' : '#ffcf3d'; clearTimeout(edMsgT); edMsgT = setTimeout(() => edRender(), 2200); }
function edRender() {
  const P = ED.cells, set = new Map(P.map((p, i) => [p.join(','), i]));
  const TH = THEME[THEMES[ED.theme].ground], end = P.length && P[P.length - 1][0] === COLS - 1;
  let h = '';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = set.get(c + ',' + r); let cls = 'ec', inner = '';
    if (i !== undefined) { cls += ' p'; if (i === 0) inner = '🚪'; else if (i === P.length - 1) inner = end ? '👑' : '✋';
      else { const a = P[i-1], b = P[i+1]; inner = `<span class="ar">${b ? (b[0] > c ? '→' : b[0] < c ? '←' : b[1] > r ? '↓' : '↑') : ''}</span>`; } }
    else if (c === 0 && !P.length) cls += ' st' + (INPUT.pad && r === (ED.padRow === undefined ? 4 : ED.padRow) ? ' cur' : '');
    h += `<div class="${cls}">${inner}</div>`;
  }
  const g = $('edGrid'); g.innerHTML = h; g.style.setProperty('--top', TH.top[0]); g.style.setProperty('--path', TH.path[0]);
  document.querySelectorAll('#edTheme button').forEach((b, i) => b.classList.toggle('on', i === ED.theme));
  document.querySelectorAll('#edDiff button').forEach((b, i) => b.classList.toggle('on', i + 1 === ED.diff));
  const err = P.length ? validateCells(P) : (INPUT.pad ? T('edHelpPad') : T('edHelp'));
  $('edMsg').textContent = err || T('edOk', {n:P.length}); $('edMsg').style.color = err ? '#ffcf3d' : '#7cff8a';
  $('edSave').disabled = $('edPlay').disabled = $('edShare').disabled = !!err;
}
function edCurrent() { const name = ($('edName').value || T('myMap')).trim().slice(0, 16); return makeCustomMap(ED.cells, name, ED.theme, ED.diff, ED.id || 'u' + Date.now()); }
function edSave() {
  const err = validateCells(ED.cells); if (err) return edMsg(err);
  const m = edCurrent(); ED.id = m.id;
  const i = SAVE.maps.findIndex(x => x.id === m.id); if (i >= 0) SAVE.maps[i] = m; else { if (SAVE.maps.length >= 30) return edMsg(T('edMax')); SAVE.maps.push(m); }
  selMap = SAVE.mapId = m.id; save(); bigMoment(); edMsg(T('edSaved'), true); return m;
}
(function edInit() {
  const g = $('edGrid');
  g.addEventListener('pointerdown', ev => { ev.preventDefault(); if (ED.drawing) return; ED.drawing = ev.pointerId; ED.hist.push(ED.cells.map(c => c.slice())); if (ED.hist.length > 40) ED.hist.shift();
    try { g.setPointerCapture(ev.pointerId); } catch (e) {} const c = edCellAt(ev); if (c) { edTouch(c, true); edRender(); } });
  g.addEventListener('pointermove', ev => { if (ED.drawing !== ev.pointerId) return; const c = edCellAt(ev); if (c) { const n = ED.cells.length; edTouch(c, false); if (ED.cells.length !== n) edRender(); } });
  const up = ev => { if (ED.drawing === ev.pointerId) ED.drawing = false; };
  g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
  $('edTheme').onclick = ev => { const b = ev.target.closest('[data-t]'); if (b) { ED.theme = +b.dataset.t; edRender(); } };
  $('edDiff').onclick = ev => { const b = ev.target.closest('[data-d]'); if (b) { ED.diff = +b.dataset.d; edRender(); } };
  $('edUndo').onclick = () => { if (ED.hist.length) ED.cells = ED.hist.pop(); else ED.cells.pop(); edRender(); };
  $('edClear').onclick = () => { ED.hist.push(ED.cells.map(c => c.slice())); ED.cells = []; edRender(); };
  $('edRandom').onclick = () => { ED.hist.push(ED.cells.map(c => c.slice())); ED.cells = randomCells() || []; edRender(); };
  $('edSave').onclick = () => { edSave(); };
  $('edPlay').onclick = () => { const m = edSave(); if (!m) return; closeEditor(); initAudio(); startGame(m.id); };
  $('edShare').onclick = () => { const err = validateCells(ED.cells); if (err) return edMsg(err); const code = mapToCode(edCurrent()); $('edCode').value = code;
    try { navigator.clipboard.writeText(code).then(() => edMsg(T('edCopied'), true), () => edMsg(T('edCodeBelow'), true)); } catch (e) { edMsg(T('edCodeBelow'), true); } };
  $('edImport').onclick = () => { const m = codeToMap($('edCode').value); if (!m) return edMsg(T('edBadCode')); ED.cells = m.cells; ED.name = m.name; ED.theme = m.theme; ED.diff = m.diff; ED.id = null; $('edName').value = m.name; edRender(); edMsg(T('edImported'), true); };
  $('edClose').onclick = () => { closeEditor(); if (!S || !S.started) showTitle(); };
})();

boot();

</script>
